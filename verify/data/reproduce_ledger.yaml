    source: laf_mid.g2_T220
    paper: {value: 0.34, err: 0.05, tag: V, where: "Laferriere 2023; cards/laferriere2023.yaml"}
    tol: {kind: abs, value: 0.10}
    tol_reason: "audit fix 4: +-0.10 absolute, pre-registered"
    expect: fail
    reason: "UNIDENTIFIABLE, not a solver miss (p2-rootcause 3; r2-physics-a Q5): mid-point 220 K g2 0.576 vs 0.34. For the filtered cap-2 cascade g2[0] = 2 P2 eps_eff/[P1 + P2(1 + eps_eff)]^2, mu is irrelevant and the model floor is g2 >= eps_eff = eps S_XX/S_X; the data need eps_eff ~ 0.33 (0.340/0.338/0.324/0.301 at mu 0.25/0.65/1.6/3.0), i.e. a third of the XX line in the window at ANY pump. Which filter applies at 220 K and delta_xx decide it, and neither is published: eps_op ~ 0.95 at the card mid-point (delta_xx 3.5, w 12.5 meV) is excluded by the data, while (delta_xx 5.5, w <= 9 meV = the paper's 12 nm filter at 1.35 um) or (3.5, w <= 5.5) reproduce it. The one missing physics term, XX-selective loss k_XX = 2 k_X e^{E_b/kT} [DR] (opt-in cw_g2.escape_rates_from_retention xx_escape_Eb_meV, default off), gives S_XX/S_X = 0.85 at the proxy S_X and moves g2 0.585 -> ~0.56 only; it would need S_XX/S_X ~ 0.35 (a 20 meV activation difference) to reach 0.34. Kept as a known failure; E_b / the filter are NEVER tuned on this point"
