    expect: fail
    reason: "FLIPPED after first run (first guess was pass, following the scripts/run_zhao_fit.py docstring 'reproduces closely'): the production sde.py outcome is outside the 1-sigma combined criterion even on the calibrated row; tolerance NOT widened. Residual 1.6 sigma, MC-stable over 5 seeds (1.0173-1.0177): a real offset of a calibration to a possibly WRONG observable (intracavity, see zhao_quiet); do not retune until an output-flux estimator settles which observable the calibration should target (p2-rootcause 6b)"
  - id: zhao_quiet
    class: U
    desc: "Zhao quiet-pump g2(0) at I = 4 I_th"
    source: zhao.quiet
    paper: {value: 0.9823, err: 0.006, tag: V, where: "Zhao 2024; cards/zhao.yaml"}
    tol: {kind: combined_sigma, k: 1.0}
    tol_reason: "same criterion as the normal row"
    expect: fail
    reason: "WRONG OBSERVABLE (p2-rootcause 6a): g2 here comes from the INTRACAVITY photon-number variance, which is not squeezed (g2 > 1 for every F_pump); the pump regulation appears only in the low-frequency OUTPUT photon flux (Fano 0.64 at a 6 ns window for F_pump 0.08, versus ~9-11 at 10-100 ps), which is what Zhao measured (broadband photocurrent squeezing). The earlier reason (tuning near-miss) does not identify this. Needs an output-flux estimator (rank-3 fix in sde.py, not in this spec)"

