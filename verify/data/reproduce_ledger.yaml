  # 25 K) were RETIRED to the regression pins above/below by devlib-r2-physb: the planar model is the wrong device class for
  # a dot-in-nanowire (dipole layer cannot be screened by <= 1 injected pair per dot, F shifts 0.03 MV/cm; the field must be
  # small intrinsically = relaxation). The applicable comparison is the nanowire pair nw_desh2013_lambda and the field-free
  # bracket nw_desh2013_EX_fieldfree_bracket below.
