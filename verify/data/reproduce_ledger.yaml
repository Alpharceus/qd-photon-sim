    desc: "WRONG DEVICE CLASS (planar model on a pillar dot): planar nitride Zhang-2013 geometry radiative lifetime (ns, 300 K) vs measured 3.40 ns"
    source: nitride.zhang2013_tau_ns
    paper: {value: 3.40, tag: V, where: "Zhang et al., APL 103, 192114 (2013), Fig. 2 (mono-exponential, 10 K); fsim_core.nitride_levels.ZHANG2013_LIFETIME_NS; no uncertainty printed in the module. Evaluated at 10 K since devlib-r2-physb"}
    tol: {kind: rel, value: 0.5}
    tol_reason: "[E] the paper prints no lifetime error; a generous +-50% (mono-exponential TRPL fit class) is registered"
    expect: fail
    reason: "planar unrelaxed field; see the pillar items nit_zhang2013_* (r2-physics-b Q3b): the planar module puts the 2.4 MV/cm unrelaxed film field on a D = 29 nm pillar dot: overlap^2 0.013 -> 102 ns at the 10 K measurement temperature (106 ns at 300 K, which is what this item compared before) vs 3.40 ns. Nonlinear polarization changes F by only ~5 % (tested), so it is not the fix. The pillar relaxes the shear and part of the piezo charge at the free sidewall; the one-parameter fit is in nit_zhang2013_tau_fit_sf / nit_zhang2013_EX_heldout"
  - {id: kd_nit_zhang2013_tau_pin, class: KD, desc: "regression pin: planar Zhang-2013 geometry lifetime at 300 K (ns)", source: nitride.zhang2013_tau_ns_300K, paper: {pin: 106.0, pin_note: "audit-recorded 106 ns (p0-verifiability.md); 300 K evaluation kept as the pin after the item moved to 10 K"}, tol: {kind: regression, value: 2.0}, tol_reason: "drift guard only, about 2%", expect: pass}
  - {id: kd_nit_zhang2013_tau_10K_pin, class: KD, desc: "regression pin: planar Zhang-2013 geometry lifetime at the 10 K measurement temperature (ns)", source: nitride.zhang2013_tau_ns, paper: {pin: 101.8, pin_note: "observed 2026-10-12 (r2-physics-b probe: 102 ns at 10 K)"}, tol: {kind: regression, value: 2.0}, tol_reason: "drift guard only, about 2%", expect: pass}
  - id: kd_nit_desh2014_g2
    class: KD
    desc: "WRONG DEVICE CLASS (planar platform for a nanowire experiment): planar nitride comparison card (Deshpande 2014) g2_op vs measured 0.29"
    source: nitride.desh2014_g2
    paper: {value: 0.29, err: 0.1, tag: V, where: "Deshpande et al., APL 105, 141109 (2014), abstract-only; CONDITIONS INCOMPLETE; err is an [E] +-0.1 (same as the Reischle registration)"}
    tol: {kind: abs, value: 0.10}
    tol_reason: "[E] the abstract prints no error; +-0.1 registered, matching the Reischle item"
    expect: fail
    reason: "XX unresolved at 35 meV -> model floor ~1 at low mu on either counting law (pulsed Poisson cap-2 and CW), conditions incomplete (abstract only), plus WRONG DEVICE CLASS (planar platform, F = -6294 kV/cm, S_X 4e-4, so 0.988 means nothing). Relaxing the planar card still gives 0.775-0.823 because gamma300 = 35 meV >> |delta_xx| = 10 meV puts the XX inside the X line (eps ~ 1). 0.29 requires an XX-selective loss k_nr_XX ~ 2.4 gamma_XX = 3.8/ns [DR, an XX Auger-class or filter loss] or a filter < 10 meV; neither is stated in the abstract. See the nw_desh2014_* diagnostics (opt-in k_nr_XX_ns; never tuned)"
  - {id: kd_nit_desh2014_g2_pin, class: KD, desc: "regression pin: nitride comparison card g2_op", source: nitride.desh2014_g2, paper: {pin: 0.988, pin_note: "audit-recorded 0.988 (p0-verifiability.md)"}, tol: {kind: regression, value: 0.01}, tol_reason: "drift guard only, 0.01", expect: pass}

