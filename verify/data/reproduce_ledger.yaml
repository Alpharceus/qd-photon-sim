  # ------------------------------------------------------------------ 4b. Reischle 80 K, FAITHFUL DC tiers (devlib-rc2, pre-registered)
  # Production path: device.evaluate(drive.cw=True, EL-transport, 0.46 um aperture, 80 K) at a low-current point supplies gamma_X,
  # the retention S (-> k_X) and eps (the paper's own 11.9 mA drives the self-heating loop to runaway in the default mesa,
  # p2-rootcause R2); then cw_g2.cw_report (exponential IRF, tau 0.5 ns = FWHM 693 ps, the paper's fit-model IRF) at a pump rate r fixed
  # by the measured dip width tau_c ~ 1 ns [V]: r = 1/tau_c - gamma_X - k_X, floored at 0.01/ns [A] (a negative r is not realisable;
  # if that happens the model dip is faster than measured, which is then part of the result). Tolerances = the paper's own errors:
  #   0.03 background-corrected: err 0.065 [DR] = 0.05 / rho^2 (0.25 +- 0.05 deconvolved, rho = 0.88, Eq. 1);
  #   0.25 deconvolved: +-0.05 (paper); 0.43 raw: +-0.05 (anchor rel 0.12, rt_edge_anchors.yaml).
  # Predictions registered BEFORE the first run: g2_dot and meas_rho088 pass (the background law with the measured rho IS the
  # paper's Eq. 1); both raw items fail (production 80 K retention S ~ 0.09 -> k_X ~ 10/ns -> a dip far narrower than ~1 ns).
  - {id: reischle_dc_g2_dot_bgcorr, class: U, desc: "FAITHFUL DC (r from dip width): model intrinsic g2_dot(0) vs the paper's BACKGROUND-CORRECTED 0.03", source: reischle_dc.g2_dot0, paper: {value: 0.03, err: 0.065, tag: DR, where: "Reischle 2008 Opt. Express 16, 12771: rho-corrected g2(0) = 0.03 (QD C, 80 K); err = 0.05 / 0.88^2 propagated from the deconvolved 0.25 +- 0.05 through Eq. 1"}, tol: {kind: abs, value: 0.065}, tol_reason: "propagated published uncertainty (see err)", expect: pass}
  - {id: reischle_dc_meas_rho088, class: U, desc: "U given MEASURED rho 0.88 (background TRANSCRIBED from the paper, not predicted): model with-background g2(0) vs deconvolved 0.25", source: reischle_dc.g2_meas0_rho088, paper: {value: 0.25, err: 0.05, tag: V, where: "Reischle 2008 Fig. 3b; verify/data/rt_edge_anchors.yaml id reischle08-g2-80k-deconvolved"}, tol: {kind: abs, value: 0.05}, tol_reason: "the paper's own +-0.05 (the as-configured items used a looser +-0.10)", expect: pass}
  - {id: reischle_dc_raw_rho088, class: U, desc: "U given MEASURED rho 0.88 (background transcribed): model raw g2(0) (convolved with the 0.5 ns exponential IRF) vs measured raw dip 0.43", source: reischle_dc.g2_raw0_rho088, paper: {value: 0.43, err: 0.05, tag: V, where: "Reischle 2008 Fig. 3b; rt_edge_anchors.yaml id reischle08-g2-80k (rel 0.12)"}, tol: {kind: abs, value: 0.05}, tol_reason: "the paper's own +-0.05", expect: fail, reason: "registered prediction: the production 80 K retention (S ~ 0.09, k_X ~ 10/ns) makes the model dip ~10x narrower than the measured ~1 ns recovery, so the 0.5 ns IRF washes it out (raw near 0.9). The comparison is like-for-like; the miss is a model feature (retention at 80 K for this confinement chain), not an observable mismatch"}
  - {id: reischle_dc_raw_predicted_rho, class: U, desc: "U (background NOT predicted by any production term): model raw g2(0) with the MODEL's own rho (~1.0) vs measured raw dip 0.43", source: reischle_dc.g2_raw0_rho_model, paper: {value: 0.43, err: 0.05, tag: V, where: "Reischle 2008 Fig. 3b"}, tol: {kind: abs, value: 0.05}, tol_reason: "the paper's own +-0.05", expect: fail, reason: "background not predicted (p2-rootcause 1, item c): the model's injection background is ~2e3/s vs ~9e7/s signal (rho ~ 1.0) while the paper measured 0.88 from current spreading and ensemble/barrier emission under a 460 nm aperture; no production term predicts that"}

