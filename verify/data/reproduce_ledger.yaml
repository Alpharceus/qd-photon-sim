# Expectation ledger for verify/verify_reproduce_cards.py  (devlib-vf2)
#
# PRE-REGISTRATION RULES (written before the verifier was first run):
#   * `tol` and `tol_reason` come from the paper's own uncertainty, the audit
#     (.workers/devlib/p0-verifiability.md) or the spec; NEVER from an observed
#     model value.  Exception: class KD "regression" items pin the CURRENT model
#     value on purpose (a drift guard, not a physics claim) -- their `pin` is an
#     observed value and is labelled as such.
#   * `expect: pass | fail`.  The verifier exits 0 iff every outcome == expect.
#     A known failure is `expect: fail` + `reason`.  A tolerance is never widened
#     after seeing a result; a wrong guess of `expect` is corrected by flipping
#     `expect` and the flip is listed in the `flips:` block at the bottom.
#   * classes: C calibration (fitted to this very data), U unfitted prediction,
#     H held-out, KD known deviation (documented model miss).
#   * tol kinds (verify_reproduce_cards.py::judge):
#       abs            |model - paper.value| <= tol
#       upper_bound    model <= paper.value + tol          (published upper bound)
#       range          paper.lo <= model <= paper.hi        (published spread)
#       energy_meV     |E(model nm) - E(paper nm)| <= tol   (nm -> meV via hc)
#       rel            |model - paper.value| / paper.value <= tol
#       combined_sigma |model - paper.value| <= k * hypot(model SE, paper.err)
#       regression     |model - pin| <= tol                (drift guard)
#   * `source` = "<group>.<key>": the evaluator group (production code path) and
#     the key within its result dict.
#   * Tags follow the repo convention: [V] read from the paper, [DR] derived,
#     [E] estimate, [A] assumption.

meta:
  ledger_version: 1
  written: "2026-10-12"
  model_head: "rt-edge-emitter @ deb733a (working tree)"
  runtime_budget_s: 180

