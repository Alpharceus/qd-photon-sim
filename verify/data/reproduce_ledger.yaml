    expect: fail
    reason: "ILL-POSED observable (p2-rootcause 1): the fixture is a pulsed, saturated peak-area g2 (0.034 = the dot's intrinsic purity, which agrees with the paper's BACKGROUND-CORRECTED 0.03); the paper measured a DC dip convolved with a ~0.5 ns IRF, with a measured background rho = 0.88. Not a model failure on its own; see reischle_dc_* for the like-for-like comparison. verify_rt_edge_papers.py:690 counted eligibility as agreement"
  - id: reischle_80K_deconv
