  # Production path: the evaluator fixture of verify_rt_edge_papers._xcheck_reischle2008_g2_80K
  # (InP/AlGaInP p-i-n EL preset, 80 K), replicated call-for-call.
  - id: reischle_80K_raw
    class: U
    desc: "as-configured (non-faithful inputs: PULSED saturation model vs a DC raw dip): Reischle 80 K EL g2_op vs measured raw dip 0.43"
    source: reischle.g2_op
    paper: {value: 0.43, err: 0.05, tag: V, where: "Reischle et al., Opt. Express 16, 12771 (2008), Fig. 3b; verify/data/rt_edge_anchors.yaml id reischle08-g2-80k (rel 0.12)"}
