  - {id: va_g2_210K, class: C, desc: "V-a fit g2 at 210 K", source: chatz_va.g2_T210, paper: {value: 0.28, err: 0.03, tag: V, where: "Chatzarakis 2023 Fig. 5"}, tol: {kind: abs, value: 0.03}, tol_reason: "V_A_TOL = 0.03", expect: pass}
  - {id: va_g2_230K, class: C, desc: "V-a fit g2 at 230 K (audit: on the +0.028 edge)", source: chatz_va.g2_T230, paper: {value: 0.36, err: 0.03, tag: V, where: "Chatzarakis 2023 Fig. 5"}, tol: {kind: abs, value: 0.03}, tol_reason: "V_A_TOL = 0.03", expect: pass}
  - id: va_78K_upper_bound
    class: C
    desc: "V-a fit g2 at 78 K vs the published UPPER BOUND 0.02 (+-0.01)"
    source: chatz_va.g2_T78
    paper: {value: 0.02, err: 0.01, bound: upper, tag: V, where: "Chatzarakis 2023 Fig. 5 (g2 < 0.02); cards/chatzarakis.yaml row bound: upper"}
    tol: {kind: upper_bound, value: 0.01}
    tol_reason: "published uncertainty on the bound is +-0.01 (card err); model must not exceed 0.02 + 0.01"
    expect: fail
    reason: "V-a model 0.035 violates the published upper bound; the +-0.03 point gate passes only because the bound is treated two-sided there. Mechanism (p2-rootcause 2a): g2_dot at 78 K is only 0.007; the rest is the fit background b0 = 0.0128 (T-independent), forced by the tau(T)/tau(78) = S(T)/S(78) block, which assumes a T-independent radiative rate [A] (violated in a lambda-microcavity as the X line walks off the mode). With the tau block dropped the refit gives 0.028. The production fit is not swapped (verify_fsim/audit bit-identity; user decision)"

