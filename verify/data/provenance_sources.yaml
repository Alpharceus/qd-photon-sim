# reproduce_ledger.yaml paper: blocks -> first regex matching `paper.where` + desc picks the files.
ledger_keywords:
  - match: "Chatzarakis"
    files:
      - "../refs/Third pass/chatzarakis2023.pdf"
      - "../refs/Third pass/chatzarakis2023_SI.pdf"
  - match: "Reischle 2008|Reischle et al"
    files:
      - "../refs/Third pass/reischle2008.txt"
  - match: "Reischle"
    files:
      - "../refs/Third pass/reischle2010.txt"
      - "../refs/Third pass/reischle2008.txt"
  - match: "Laferri"
    files:
      - "../refs/Third pass/laferriere2023.txt"
  - match: "Pryor"
    files:
      - "../refs/Third pass/pryor1998.txt"
      - "../refs/Third pass/pryor1997.txt"
  - match: "Deshpande"
    files:
      - "../refs/Third pass/deshpande2014.txt"
  - match: "Tamariz"
    files:
      - "../refs/Third pass/tamariz2020.txt"
  - match: "Zhao"
    files:
      - "../refs/Second pass/zhao.pdf"
      - "../refs/Second pass/zhao_arxiv.pdf"
      - "../refs/Second pass/zhao supplement.pdf"
  - match: "Zhang"
    files:
      - "../refs/Second pass/zhang.pdf"

zhao_supplement: "../refs/Second pass/zhao supplement.pdf"
