    claim: retention_Ea_inp_algainp
    value: 96
    unit: meV
    tolerance: 7
    conditions: "Single-dot X Arrhenius activation energy for InP/(Al0.20Ga0.80)InP."
    source: "Bommer et al., Journal of Applied Physics 110, 063108 (2011)"
    doi: "10.1063/1.3633218"
    locator: "single-dot Arrhenius fit"
    tag: V
    status: verified
    verification: "web:https://pubs.aip.org/aip/jap/article-abstract/110/6/063108/151233 -- confirmed 2026-09-05 by reading the full text (open-access mirror, kops.uni-konstanz.de): 'Activation energy derived from Arrhenius fits: Ea_X = 96 +/- 7 meV, Ea_XX = 80 +/- 8 meV' -- exact match to this anchor's value/tolerance. Not in ../_goal/paper_digests.md (outside the fact-checked six-paper digest set)."
  # Genuinely distinct second source, confirmed by downloading and reading
  # the full text (pypdf, 2026-09-05): a different Stuttgart-group paper,
  # ensemble (not single-dot) PL, reporting a family of activation energies
  # for InP QDs in Al0.20Ga0.80InP barriers depending on cladding; the value
  # below is Table 1 structure (a), the plain reference barrier with no
  # additional cladding/tunnel barrier, the closest ensemble analogue to
  # Bommer's single-dot structure. Not referenced by any design card.
  #
  # Id/year fix (council review, 2026-09-05): the id said "schulz08" but the
  # citation is physica status solidi (c) 6, 906 (2009) -- confirmed via the
  # Wiley abstract page (onlinelibrary.wiley.com/doi/abs/10.1002/
  # pssc.200880599: "Schulz - 2009 - physica status solidi c"); the arXiv
  # preprint (arXiv:0812.0452) was posted Dec 2008, which is presumably where
  # the "08" came from, but the citable journal publication is 2009. Id
  # renamed schulz08-retention-ea-ensemble -> schulz09-retention-ea-ensemble
  # to match; not referenced by id anywhere outside this file.
  - id: schulz09-retention-ea-ensemble
    claim: retention_Ea_inp_algainp
    value: 150
    unit: meV
    tolerance: 20
    conditions: "Ensemble PL intensity vs temperature, simple thermal-activation-model Arrhenius fit (Table 1, structure (a): reference Al0.20Ga0.80InP barrier, no additional cladding or tunnel barrier); InP quantum dots, same general InP/(Al,Ga)InP thermal-escape activation-energy family as Bommer 2011, but an independent ensemble measurement, not a reproduction of it."
    source: "Schulz et al., physica status solidi (c) 6, 906 (2009)"
    doi: "10.1002/pssc.200880599"
    locator: "Table 1, structure (a)"
    tag: V
    status: verified
    verification: "web:https://onlinelibrary.wiley.com/doi/abs/10.1002/pssc.200880599 -- confirmed 2026-09-05: Wiley abstract page dates the journal publication to physica status solidi (c) 6, 906 (2009); the arXiv preprint (arXiv:0812.0452, Dec 2008, same paper) full text was read directly and gives Table 1 verbatim: 'Structure (a) (b) (c) (d) (e) / EA (meV) 150 205 220 251 272 / TC (K) 150 140 150 160 192' -- exact match to this anchor's value for structure (a). Not in ../_goal/paper_digests.md (outside the fact-checked six-paper digest set)."
