  # The underlying peer-reviewed paper behind the news-summary gap above has
  # since been identified and confirmed (WebSearch + crossref + DOI-redirect
  # cross-check, 2026-09-05; re-confirmed again in this pass): Luo, Lin,
  # Huang, Lin, Lau, "Electrically pumped InP/GaAsP quantum dot lasers grown
  # on (001) Si emitting at 750 nm", Optics Express 30, 40750 (2022), DOI
  # 10.1364/OE.474320 (doi.org redirects to opg.optica.org/oe/fulltext.cfm?
  # uri=oe-30-22-40750, matching journal/vol/page exactly). This is a
  # genuine, distinct, DOI-confirmed second source for the claim's underlying
  # scientific fact.
  #
  # Council review (2026-09-05): status corrected from "missing" to
  # "verified". It was previously kept "missing" only to avoid tripping
  # verify_rt_edge_cards.py's tolerance check on cards/edge-inp-gaasp-
  # design.yaml's emission.lambda_nm (815.7 nm, this dot's own confinement-
  # derived design point -- round 4 council review corrected this comment's
  # earlier, now-stale "668 nm" reading) against the unconfirmed 755 nm
  # HKUST target -- but that card's anchor_id for emission.lambda_nm is
  # gu25-hkust-wavelength (still "missing", unchanged above), NOT this
  # anchor, so promoting THIS anchor to "verified" does not touch that gate.
  # The 815.7 nm vs 750 nm design-point mismatch is a card-level
  # provenance.assumptions entry for the concurrent cards spec to record,
  # not evidence-ledger "missing" status: the
  # underlying literature fact (a real, DOI-sourced InP/GaAsP QD laser near
  # this wavelength class exists) IS verified, even though hkust_inp_gaasp_
  # wavelength as a CLAIM still needs 2 distinct verified sources and has
  # only this one (gu25 remains "missing"), so the claim itself stays
  # evidence-incomplete overall -- this edit only corrects this one anchor's
  # own status to match the evidence, it does not complete the claim.
  - id: luo22-hkust-wavelength-si
    claim: hkust_inp_gaasp_wavelength
    value: 750
    unit: nm
    tolerance: 5
    conditions: "Electrically pumped InP/GaAsP quantum dot laser grown on (001) Si; ensemble laser target wavelength, not a single-photon emitter. A confirmed, DOI-sourced second candidate for the HKUST-class wavelength; independent matching single-dot evidence remains absent. Card-coordination note: cards/edge-inp-gaasp-design.yaml's emission.lambda_nm (815.7 nm, this dot's own confinement-derived design point) is anchored to gu25-hkust-wavelength above (still status: missing), not to this anchor; the 815.7 nm vs 750 nm design-point gap is to be tracked as a card-level provenance.assumptions entry by the concurrent cards spec, not as missing evidence on this anchor."
    source: "Luo et al., Optics Express 30, 40750 (2022)"
    doi: "10.1364/OE.474320"
    locator: "title / device wavelength"
    tag: V
    status: verified
    verification: "web:https://opg.optica.org/oe/fulltext.cfm?uri=oe-30-22-40750 -- confirmed 2026-09-05 (WebSearch): Luo, Lin, Huang, Lin, Lau, Optics Express 30(22), 40750-40755 (2022); not in ../_goal/paper_digests.md (outside the fact-checked six-paper digest set)."
