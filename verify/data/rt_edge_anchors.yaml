  # The underlying peer-reviewed paper behind the news-summary gap above has
  # since been identified and confirmed (WebSearch + crossref + DOI-redirect
  # cross-check, 2026-09-05): Luo, Lin, Huang, Lin, Lau, "Electrically pumped
  # InP/GaAsP quantum dot lasers grown on (001) Si emitting at 750 nm",
  # Optics Express 30, 40750 (2022), DOI 10.1364/OE.474320 (doi.org redirects
  # to opg.optica.org/abstract.cfm?URI=oe-30-22-40750, matching journal/vol/
  # page exactly). This is a genuine, distinct, DOI-confirmed second source
  # for the claim's underlying scientific fact. Its status is kept "missing"
  # (not promoted to "verified") rather than also flipping gu25-hkust-
  # wavelength to verified: verify/verify_rt_edge_cards.py (out of this
  # spec's scope) requires any card value anchored to a "verified" anchor to
  # lie inside that anchor's tolerance, and cards/edge-inp-gaasp-design.yaml
  # (also out of scope) deliberately pins emission.lambda_nm to 668 nm -- the
  # only tabulated-index design point -- rather than to gu25's unconfirmed
  # 755 nm HKUST target; raising gu25 to verified would make that card fail.
  # See the implementation report's QUESTION.
  - id: luo22-hkust-wavelength-si
    claim: hkust_inp_gaasp_wavelength
    value: 750
    unit: nm
    tolerance: 5
    conditions: "Electrically pumped InP/GaAsP quantum dot laser grown on (001) Si; ensemble laser target wavelength, not a single-photon emitter. A confirmed, DOI-sourced second candidate for the HKUST-class wavelength; independent matching single-dot evidence remains absent."
    source: "Luo et al., Optics Express 30, 40750 (2022)"
    doi: "10.1364/OE.474320"
    locator: "title / device wavelength"
    tag: V
    status: missing
