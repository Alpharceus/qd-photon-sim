  # (fsim_core/linewidth.py, fsim_core/device.py) but was never entered in
  # this ledger. In0.5Ga0.5As, not InP -- class proxy, same as Laferriere.
  - id: matsuda01-gamma300-class
    claim: gamma300_class_range
    value: 12
    unit: meV
    tolerance: 1
    conditions: "In0.5Ga0.5As/GaAs single quantum dot, near-field scanning optical microscopy, homogeneous linewidth at 300 K; distinct-material class proxy for the InP-dot family, not a direct InP/GaAsP or InP/GaInP measurement."
    source: "Matsuda et al., Physical Review B 63, 121304(R) (2001)"
    doi: "10.1103/PhysRevB.63.121304"
    locator: "abstract; ~12 meV homogeneous linewidth at 300 K"
    tag: V
    status: verified
    verification: "web:https://journals.aps.org/prb/abstract/10.1103/PhysRevB.63.121304 -- confirmed 2026-09-05 (WebSearch): Matsuda, Ikeda, Saiki, Tsuchiya, Saito, Nishi, \"Homogeneous linewidth broadening in a single quantum dot at room temperature investigated using a highly sensitive near-field scanning optical microscope,\" Phys. Rev. B 63, 121304(R) (2001), ~12 meV at 300 K, In0.5Ga0.5As/GaAs dot; not in ../_goal/paper_digests.md (outside the fact-checked six-paper digest set)."
  # Second, independent class-proxy source: fact-checked against
  # ../_goal/paper_digests_factcheck.md item 27 (rendered-figure + verbatim
  # p.6 quote), distinct DOI from Matsuda and from Laferriere.
  - id: chatzarakis23-gamma300-class
    claim: gamma300_class_range
    value: 6.5
    unit: meV
    tolerance: 0.5
    conditions: "InAs/GaAs (211)B piezoelectric single-quantum-dot linewidth measurement (mesa-isolated dot, Fig. S2); the (211)B and (100) single-dot linewidth curves merge at T >= 250 K to FWHM 6-7 meV (paper text, p. 6). Corrected wording: earlier text here wrongly described this as an 'ensemble (non-SSL/SSL-barrier)' and 'mesa and microcavity-dot' merge -- the ensemble non-SSL/SSL Arrhenius activation energies (125/265 meV) are a different measurement on different (ensemble) samples; the linewidth-curve merge quoted for this anchor is specifically the (211)B vs (100) SINGLE-DOT comparison per paper_digests_factcheck.md item 27. Distinct-material class proxy for the InP-dot family, not a direct InP/GaAsP or InP/GaInP measurement."
    source: "Chatzarakis et al., Physical Review Applied 20, 034011 (2023)"
    doi: "10.1103/PhysRevApplied.20.034011"
    locator: "p. 6, linewidth-curve-merge discussion; Fig. S2"
    tag: V
    status: verified
