    tag: V
    platform: InGaN_bulk
    excitation: none
    observable: bandgap_bowing_parameter_b
    value: 1.43
    unit: eV
    tolerance: {value: 0.03, meaning: "the same source also quotes a rounded 1.4 eV full-range fit; +/-0.03 eV spans both reported figures"}
    transfer_notes: >
      Background InGaN alloy bowing constant consumed internally by
      nitride_materials.ingaN() (out of scope for this piece); not a
      card-set field. Backs the In-content interpolation used at
      nitride.dot.x_in=0.25 (headline cards) and 0.40 (comparison card),
