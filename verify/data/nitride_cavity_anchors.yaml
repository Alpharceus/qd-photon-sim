# Evidence ledger for the planar InGaN/GaN cavity design cards (piece 6,
# nitride-cards-contract). Read by verify/verify_nitride_cards.py.
#
# Schema (docs/nitride_cavity_contract.md "Evidence status"): top-level
# `anchors` is a MAPPING keyed by anchor id. Each entry:
#   citation, doi_or_url, location, evidence_status, tag, platform,
#   excitation, observable, value, unit, tolerance, transfer_notes
# `evidence_status` in {full_text, abstract_only, figure_reading, estimate,
# missing}; a missing numerical value is `null`. `tag` is the measurement's
# own [V]/[DR]/[E]/[A] tag (the transfer of that measurement INTO a card
# field, e.g. nanowire->planar or GaN->InGaN, carries its own, separate tag
# on the card's provenance.sources entry -- never conflate the two: a
# verified off-platform measurement transferred onto this planar design is
# [E] or [A] in the card, never [V] there, even though the anchor itself is
# tagged [V] here). `tolerance` always names what the number means: a
# reported paper uncertainty, or (for a bare transcription/read with no
# stated paper error bar) an explicit zero/read tolerance, never left
# ambiguous. `doi_or_url` uses only identifiers actually printed in
# ../_goal/nitride_digests.md (a DOI where the digest states one, else the
# arXiv id/OSTI id/PMC id the digest gives) -- never a fabricated DOI.
#
# Source digest: ../_goal/nitride_digests.md (compiled 2026-09-09). No newly
# available primary text for Deshpande 2014 was found beyond its abstract at
# compilation time; the three deshpande2014-*-missing entries below record
# that gap explicitly rather than inventing a number.

anchors:

  # ---------------------------------------------------------------- band parameters
  bernardini1997-gan-polarization:
    citation: "Bernardini, Fiorentini, Vanderbilt, Phys. Rev. B 56, R10024 (1997)"
    doi_or_url: "arXiv:cond-mat/9705105"
    location: "Table II"
    evidence_status: full_text
    tag: V
    platform: GaN_bulk_LDA
    excitation: none
    observable: spontaneous_polarization_P_sp
    value: -0.029
    unit: C/m2
    tolerance: {value: 0.0, meaning: "point DFT value as tabulated; no reported experimental uncertainty"}
    transfer_notes: >
      Background polarization constant consumed internally by
      fsim_core/nitride_materials.py and fsim_core/nitride_levels.py's field
      solve (out of scope for this piece, already cited there per
      verify_nitride_device.py's own citation check); not a card-set
      numeric field. Supports the internal polarization-field physics
      behind nitride.dot.strain_fraction/screening_fraction/
      strain_c_fraction (all card [A]/design choices, see card provenance).

  rinke2008-gan-electron-mass:
    citation: "Rinke, Winkelnkemper, Qteish, Bimberg, Neugebauer, Scheffler, Phys. Rev. B 77, 075202 (2008)"
    doi_or_url: "arXiv:0801.0421"
    location: "Table V"
    evidence_status: full_text
    tag: V
    platform: GaN_bulk_G0W0
    excitation: none
    observable: electron_effective_mass_perp
    value: 0.186
    unit: m0
    tolerance: {value: 0.0, meaning: "point G0W0-recommended value; no reported uncertainty"}
    transfer_notes: >
      Background band-structure constant consumed internally by
      nitride_materials.py/nitride_levels.py (out of scope for this piece);
      not a card-set field.

  wu2003-ingan-bowing:
