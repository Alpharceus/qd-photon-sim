    author: "Reischle"
    year: 2008
    quantity: "delta_xx_inp_gaasp"
    value: 4
    unit: meV
    digest_section: "paper_digests.md, Paper 1, Section 5: 'Typical X-XX binding energy in this InP/GaInP system quoted as ~4-6 meV ... not measured here.' Lower endpoint recorded; this is Reischle's secondary quotation, not a direct Beirne measurement."
