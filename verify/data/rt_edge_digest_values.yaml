# Independent ground-truth transcription table for the rt-edge evidence
# ledger's value-level hallucination gate (verify/verify_rt_edge_papers.py
# _check_digest_crosscheck). This table is transcribed BY HAND from the same
# primary sources the ledger (verify/data/rt_edge_anchors.yaml) itself cites
# -- ../_goal/paper_digests.md (six fact-checked papers; digest_section
# below cites the digest's own "Paper N, Section M" numbering) for papers in
# that digest set, or a hand-confirmed web/PDF source for the six papers the
# ledger cites that are outside the digest set (Gu 2025, Luo 2022, Matsuda
# 2001, Bommer 2011 x2, Schulz 2009) -- but it is NEVER derived from the
# ledger itself. It exists so a fabricated anchor or a mutated real value in
# rt_edge_anchors.yaml has an independent number to be caught against, per
# the spec's "second, independent digest-derived table" requirement.
#
# Lookup key is (doi, quantity); `quantity` is the anchor's own `claim`
# field. Every entry corresponds to a real, DOI-bearing, non-null-value
# anchor in the ledger; the two null-value "independent gap" placeholders and
# the DOI-less hkust22-wavelength-independent-gap news-summary anchor have no
# entry here (nothing to independently transcribe).
entries:
