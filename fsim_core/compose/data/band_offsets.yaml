        checked: false
        where: 'Protesescu et al., Nano Lett. 15, 3692 (2015): m_e = 0.15, m_h = 0.14 (a_B = 3.5 nm, E_b = 40 meV)'
    sources:
    - Protesescu et al., Nano Lett. 15, 3692 (2015)
