          tag: E
          where: orthorhombic bulk at 4 K; NC PL 2.35-2.45 eV; table row 2
        dE_c:
          value: 2000
          unit: meV
          tag: E
          where: 'vacuum-level alignment EA ~3.5-3.9 eV, Protesescu 2015 class; table row 2; caveat 5: effectively infinite'
        dE_v:
          value: 1500
          unit: meV
          tag: E
          where: 'vacuum-level alignment IP ~5.9-6.2 eV; table row 2; caveat 5: effectively infinite'
