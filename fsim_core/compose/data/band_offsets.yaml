# Literature band offsets for the Composer band panel (R2 BAND). DISPLAY-ONLY: no solver reads this file.
# Source: .workers/devlib/r2-band-offsets-answer.md (Fable), low temperature (0-10 K). One entry per material kind.
# Every number is a leaf {value, unit, tag in V/DR/E/A, where[, checked, checked_against]}. V01 = Vurgaftman, Meyer, Ram-Mohan,
# J. Appl. Phys. 89, 5815 (2001); VM03 = Vurgaftman and Meyer, J. Appl. Phys. 94, 3675 (2003). Fact-check 2026-10-13
# (.workers/devlib/r2-band-offsets-check.md): the V01 table and section numbers cited here were re-checked against the full text
# and are correct. A [V] leaf is `checked: true` (with `checked_against`) only where a primary source was read directly: the V01
# tables for the III-V gaps, Wei and Zunger 1998 Table I for CdSe/ZnSe dE_v. VM03 was NOT reachable (only secondary reproductions
# matched), so VM03 leaves, the CsPbBr3 masses and the ZnSe gap stay `checked: false`. Tags are never upgraded here.
# Variants: unstr = bulk dot, strained = fully pseudomorphic 2D limit, indot = in-dot interior estimate. A variant that lists
# Eg_dot, dE_c and dE_v is closed: dE_c + dE_v + Eg_dot = Eg_barrier within 5 meV (verify_compose_materials.py). Offsets in meV.
schema: fsim-band-offsets/1
note: 'Display-only literature band offsets at 0-10 K. Checked 2026-10-13 against primary sources read directly: V01 (Vurgaftman et al. 2001) Tables I, III, VI for the GaAs, InAs, InP gaps (the V01 table and section numbers cited here are correct; the AlGaAs, GaInAs, GaInP bowing and the InAs/GaAs and InAs/InP offsets of V01 Tables XII, XIII, XV and Sec. VI.C reproduce the [DR] numbers), and Wei and Zunger 1998 Table I for the CdSe/ZnSe valence offset (0.07 eV). Not checked (checked: false): VM03 nitride values (matched only secondary reproductions), the ZnSe gap, the CsPbBr3 masses, and every [E] estimate. Tags are never upgraded.'
unverified_pending:
- 'Vurgaftman and Meyer, J. Appl. Phys. 94, 3675 (2003), DOI 10.1063/1.1600519: GaN, AlN, InN gaps, AlN/GaN and InN/GaN valence offsets, InGaN bowing, wz hole masses and its table numbers (only secondary reproductions were found)'
- 'Madelung, Semiconductors: Data Handbook, 3rd ed. (Springer, 2004): ZnSe 2.82 eV at 0 K and the zb CdSe gap'
- 'Protesescu et al., Nano Lett. 15, 3692 (2015), Supporting Information: the numeric CsPbBr3 m_e and m_h (the main text has only a_B = 3.5 nm and E_b = 40 meV)'
- 'Grundmann, Stier, Bimberg, Phys. Rev. B 52, 11969 (1995), and Stier, Grundmann, Bimberg, Phys. Rev. B 59, 5688 (1999): the in-dot InAs/GaAs band edges (0.85 eV, 450, 220 meV)'
- 'Paul et al., Appl. Phys. Lett. 111, 033102 (2017): the In0.15Ga0.85As alloy choice'
- 'Pryor, Pistol, Samuelson, Phys. Rev. B 56, 10404 (1997) (open copy arXiv:cond-mat/9705291, not read): InP/GaInP type-II sensitivity and the CuPt ordering shift'
- 'Yang et al., 2017 (CsPbBr3 magneto-absorption), reached only through arXiv:2004.05093 Table II: the primary for the 2.342 eV gap and mu = 0.126'
- 'A primary source for a CdSe/ZnSe offset range of 0.1-0.3 eV (none identified; the class range is dropped, Wei and Zunger 1998 gives 0.07 eV)'
