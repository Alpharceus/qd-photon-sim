    masses:
      m_e:
        value: 0.15
        unit: m0
        tag: V
        checked: false
        where: 'Protesescu et al., Nano Lett. 15, 3692 (2015): m_e = 0.15, m_h = 0.14. User PDF read 2026-10-13: it is the 5-page main text only, the Supporting Information is NOT included. Journal p. 3694 gives the effective Bohr diameter 7 nm (a_B = 3.5 nm) and E_b = 40 meV for CsPbBr3 (both confirmed) and says the masses were estimated from the DFT band dispersion (Tables S2, S3 in the SI), but states no numeric mass, so these stay unchecked. An independent mu = 0.126 +/- 0.01 (Yang et al. 2017 Table 1, read 2026-10-13) is 1.7x the 0.0724 implied by 0.15/0.14. Yang gives no individual m_e, m_h; only its two-band k.p trend (eq 3) assumes equal masses (0.252 each for mu = 0.126), an assumption for the trend and not a measured split, so it is no basis for replacing 0.15/0.14. Kept as is (unsourced, checked: false; treat as [E] class estimate); Yang E_b 33 meV vs Protesescu 40 meV also differ'
      m_h:
        value: 0.14
        unit: m0
        tag: V
        checked: false
        where: 'Protesescu et al., Nano Lett. 15, 3692 (2015): m_e = 0.15, m_h = 0.14. User PDF read 2026-10-13: it is the 5-page main text only, the Supporting Information is NOT included. Journal p. 3694 gives the effective Bohr diameter 7 nm (a_B = 3.5 nm) and E_b = 40 meV for CsPbBr3 (both confirmed) and says the masses were estimated from the DFT band dispersion (Tables S2, S3 in the SI), but states no numeric mass, so these stay unchecked. An independent mu = 0.126 +/- 0.01 (Yang et al. 2017 Table 1, read 2026-10-13) is 1.7x the 0.0724 implied by 0.15/0.14. Yang gives no individual m_e, m_h; only its two-band k.p trend (eq 3) assumes equal masses (0.252 each for mu = 0.126), an assumption for the trend and not a measured split, so it is no basis for replacing 0.15/0.14. Kept as is (unsourced, checked: false; treat as [E] class estimate); Yang E_b 33 meV vs Protesescu 40 meV also differ'
    sources:
