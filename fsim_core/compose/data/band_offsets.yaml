# Literature band offsets for the Composer band panel (R2 BAND). DISPLAY-ONLY: no solver reads this file.
# Source: .workers/devlib/r2-band-offsets-answer.md (Fable), low temperature (0-10 K). One entry per material kind.
# Every number is a leaf {value, unit, tag in V/DR/E/A, where[, checked, checked_against]}. V01 = Vurgaftman, Meyer, Ram-Mohan,
# J. Appl. Phys. 89, 5815 (2001); VM03 = Vurgaftman and Meyer, J. Appl. Phys. 94, 3675 (2003). Fact-check 2026-10-13
# (.workers/devlib/r2-band-offsets-check.md): the V01 table and section numbers cited here were re-checked against the full text
# and are correct. A [V] leaf is `checked: true` (with `checked_against`) only where a primary source was read directly: the V01
# tables for the III-V gaps, Wei and Zunger 1998 Table I for CdSe/ZnSe dE_v. User PDFs read directly 2026-10-13 (Corrections (user PDFs) in
# r2-band-offsets-answer.md): VM03 Tables I, III, IV, Madelung Sec. 3.14 for the ZnSe gap. The CsPbBr3 masses stay `checked: false` (SI absent). Tags are never upgraded. Second batch of user PDFs read 2026-10-13 (Grundmann 1995, Stier 1999, Paul 2017, Yang 2017, Katnani and Margaritondo 1983; sections H of r2-band-offsets-check.md and the matching section of r2-band-offsets-answer.md): InAs/GaAs in-dot dE_c 450 meV is now [V] (Grundmann p. 11977); the in-dot E_g and dE_v are NOT given by either paper and stay [E]; the CsPbBr3 gap 2.342 eV is now [V] (Yang Table 1); Paul 2017 does NOT support In0.15, so the C-band row now uses the paper cap In0.247Ga0.753As (24.7 %, [V]) with offsets re-derived; the CdSe/ZnSe dE_v 70 meV keeps WZ98 and gains Katnani and Margaritondo as a second, indirect source.
# Variants: unstr = bulk dot, strained = fully pseudomorphic 2D limit, indot = in-dot interior estimate. A variant that lists
# Eg_dot, dE_c and dE_v is closed: dE_c + dE_v + Eg_dot = Eg_barrier within 5 meV (verify_compose_materials.py). Offsets in meV.
schema: fsim-band-offsets/1
note: 'Display-only literature band offsets at 0-10 K. Checked 2026-10-13 against primary sources read directly: V01 (Vurgaftman et al. 2001) Tables I, III, VI for the GaAs, InAs, InP gaps (the V01 table and section numbers cited here are correct; the AlGaAs, GaInAs, GaInP bowing and the InAs/GaAs and InAs/InP offsets of V01 Tables XII, XIII, XV and Sec. VI.C reproduce the [DR] numbers), and Wei and Zunger 1998 Table I for the CdSe/ZnSe valence offset (0.07 eV). Not checked (checked: false): VM03 nitride values (matched only secondary reproductions), the ZnSe gap, the CsPbBr3 masses, and every [E] estimate. Tags are never upgraded. User PDFs 2026-10-13: VM03 read directly (Table I gaps GaN 3.510, AlN 6.25, InN 0.78; Table III GaInN bowing 1.4; Table IV VBO GaN/AlN 0.85 corrected from 0.8, InN/GaN 0.50) and Madelung Sec. 3.14 (ZnSe 2.8222 eV at 6 K); the Protesescu PDF lacks the SI so the CsPbBr3 masses stay unchecked; Pryor 1997 read, its unstrained InP/GaInP VBO has the opposite sign to the V01-derived value.'
unverified_pending:
- 'VM03, J. Appl. Phys. 94, 3675 (2003), DOI 10.1063/1.1600519: wz GaN/AlN/InN hole masses (the paper lists only A1-A6 parameters, no scalar mass; the 1.1 m0 class estimate is unverified). Gaps, VBOs and the InGaN bowing are now checked'
- 'Protesescu et al., Nano Lett. 15, 3692 (2015), Supporting Information (Tables S2, S3; absent from the user PDF): the numeric CsPbBr3 m_e and m_h (the main text has only a_B = 3.5 nm and E_b = 40 meV, both confirmed). Yang et al. 2017 gives only mu = 0.126 +/- 0.01 (no individual masses; its k.p trend formula assumes equal masses, i.e. 0.252 each, an assumption not a measurement), so the 0.15/0.14 split is unsourced and kept'
- 'Grundmann, Stier, Bimberg, PRB 52, 11969 (1995), and Stier, Grundmann, Bimberg, PRB 59, 5688 (1999), read 2026-10-13: the in-dot dE_c 450 meV is confirmed (Grundmann p. 11977); neither paper gives an in-dot band gap or valence-band offset (only ground-state levels, bulk offsets and strain), so the in-dot E_g,dot 0.85 eV and dE_v 220 meV remain [E] estimates that close with the 450 meV'
- 'Paul et al., Appl. Phys. Lett. 111, 033102 (2017), read 2026-10-13: resolved by switching the inas_ingaas_metamorphic_cband barrier from In0.15 to the capping layer In0.247Ga0.753As (24.7 %, [V]); the offsets are [DR] V01 re-derivations at x = 0.247. Remaining: the dots sit on the top of a 0-36.7 % In graded buffer (below the dot), so the strain reference of the dot is the buffer top, not the cap; only the cap is modelled here (display-only)'
- 'Pryor, Pistol, Samuelson, PRB 56, 10404 (1997), arXiv:cond-mat/9705291: read 2026-10-13; it has no CuPt-ordering statement (the ordering shift of up to ~0.1 eV is unsourced) and its unstrained InP/GaInP VBO (-45 meV) conflicts in sign with the V01-derived +168 meV (D2 follows Pryor); a primary for the V01 GaP/InP VBO question is still needed'
- 'CdSe/ZnSe dE_v 130 meV: Woerz, Hampel, Flierl, Gebhardt, Acta Phys. Pol. A 90, 1113 (1996) is a conference proceeding with +/-0.07 eV and does not state the measurement temperature or the strain state of the 70-shuttercycle CdSe layer; the quantum-well fit it cites (Lankes et al., J. Cryst. Growth 159, 480 (1996), 0.17 +/- 0.01 eV) was not supplied. The Woerz CdSe/ZnSe direction is printed +0.12 in the text and -0.13 in the abstract (sign typo); the leaf uses 0.13 (ZnSe/CdSe direction)'
- 'zb CdSe low-T gap: resolved by Shan, Song, Luo, Furdyna, PRB 50, 8012 (1994): E_g(0) = 1.766 +/- 0.003 eV (photoreflectance, 10-295 K, Varshni fit, MBE zb CdSe on ZnTe/GaAs(100), strain relaxed); the Madelung handbook still has no low-T zb CdSe gap'
materials:
  cdse_znse:
    dot: CdSe (zb)
    barrier: ZnSe
    type: I
    flags:
      polar: false
      type2_risk: false
      hard_wall: false
    Eg_barrier:
      value: 2.82
      unit: eV
      tag: V
      checked: true
      checked_against: Madelung, Semiconductors Data Handbook 3rd ed., Sec. 3.14 ZnSe, p. 209 (PDF p. 223), E_g,dir(Gamma8v-Gamma6c) = 2.8222(1) eV at T = 6 K, two-photon spectroscopy; read directly from the user PDF 2026-10-13
      where: Madelung 2004 Sec. 3.14 p. 209, 2.8222(1) eV at 6 K (stored rounded to 2.82, 0.2 meV; the source temperature is 6 K, not 0 K); table row 1
    variants:
      unstr:
        Eg_dot:
          value: 1.766
          unit: eV
          tag: V
          checked: true
          checked_against: Shan, Song, Luo, Furdyna, Phys. Rev. B 50, 8012 (1994), Eq. (3) fit E_0(T) = 1.766 - 6.96e-4 T^2/(281+T) eV, E_0(0) = 1.766 +/- 0.003 eV, p. 8014-8015; read directly from the user PDF 2026-10-13
          where: 'zb CdSe, band-to-band E_g at 0 K from photoreflectance on a MBE zb CdSe epilayer (ZnTe buffer on GaAs(100)), 10 K to 295 K, strain relaxed in the layer; the excitonic feature is 1.752 eV at 10 K and a 13 meV free-exciton binding energy is added (Varshni a = 6.96e-4 eV/K, b = 281 K, E_g = 1.661 eV at 295 K); consistent with the Madelung 1S exciton 1.757 eV (was 1.76 eV [E]); table row 1'
        dE_c:
          value: 924
          unit: meV
          tag: DR
          where: (E_g,bar - E_g,dot) - dE_v = (2822.2 - 1766) - 130 meV with the stored 2.82 eV barrier gap (2820 - 1766 - 130 = 924); inherits the Shan gap and the Woerz offset (was 990 meV with 1.76 eV and 70 meV; 850 meV [E] before WZ98); table row 1
        dE_v:
          value: 130
          unit: meV
          tag: V
          checked: true
          checked_against: Woerz, Hampel, Flierl, Gebhardt, Acta Phys. Pol. A 90, 1113 (1996), Sec. 2.3 p. 1116 and Fig. 3, delta E_v(ZnSe/CdSe) = -(0.13 +/- 0.07) eV (CdSe valence band above ZnSe), read from the page images of the user PDF 2026-10-13
          where: 'DIRECT interface measurement, in-situ synchrotron photoelectron spectroscopy during MBE/ALE growth of zb ZnSe and CdSe layers on GaAs(001), both growth orders: ZnSe on CdSe -(0.13 +/- 0.07) eV, CdSe on ZnSe +(0.12 +/- 0.07) eV (commutativity confirmed; the abstract prints -0.13 for the second direction, a sign typo against Sec. 2.3), band-bending corrected from the Se 3d shifts. Crystal phase zb. Not stated: the measurement temperature (in-situ UPS, taken as room temperature) and the strain state of the 70-shuttercycle CdSe layer. Supporting sources, both within the +/-0.07 eV: Wei and Zunger, Appl. Phys. Lett. 72, 2011 (1998), Table I p. 2012 (II-VI, Se, Zn/Cd), theory 0.07 eV (deduced by transitivity, uncertainty about 0.05 eV; was the primary, checked 2026-10-13); Katnani and Margaritondo, PRB 28, 1944 (1983), photoemission discontinuities against Ge and Si overlayers (Table II, +/-0.1 eV: CdSe-Ge 1.30, ZnSe-Ge 1.40, CdSe-Si 1.20, ZnSe-Si 1.25 eV; Table V positions rel. Ge: CdSe -1.33, ZnSe -1.41 eV) gives by transitivity [DR] +0.10 (Ge path), +0.05 (Si path), +0.08 eV (Table V), error about +/-0.14 eV per path, method accuracy 0.15-0.2 eV. The Katnani numbers are an INDIRECT transitivity estimate through two Ge/Si overlayer interfaces on separate room-temperature substrates, not a direct CdSe/ZnSe interface measurement (the paper itself finds commutativity deviations of 0.1-0.15 eV on average and 0.32-0.54 eV reported for ZnSe-Ge). Woerz cites an optical quantum-well result of 0.17 +/- 0.01 eV (Lankes, J. Cryst. Growth 159, 480 (1996)), not supplied. The Woerz value 130 differs from WZ98 70 by 0.86 sigma of the stated error, so it does not contradict it beyond error; the measurement is adopted as primary (was 70 meV [V] WZ98, 210 meV [E] before)'
      strained:
        Eg_dot:
          value: 2.0
          unit: eV
          tag: E
          where: 'table row 1: ~2.0 eV strained, HH shift +0.2-0.3 eV; offsets not given for this variant'
    masses:
      m_e:
        value: 0.12
        unit: m0
        tag: E
        where: class estimate for the inverse-mass level split; the masses of this row are not in the Fable table [E]
      m_h:
        value: 0.45
        unit: m0
        tag: E
        where: class estimate for the inverse-mass level split; the masses of this row are not in the Fable table [E]
    sources:
    - 'Madelung, Semiconductors: Data Handbook, 3rd ed. (Springer, 2004)'
    - Woerz, Hampel, Flierl, Gebhardt, Acta Phys. Pol. A 90, 1113 (1996), direct PES valence offset 0.13 +/- 0.07 eV (primary for dE_v)
    - Shan, Song, Luo, Furdyna, Phys. Rev. B 50, 8012 (1994), zb CdSe E_g(0) = 1.766 eV
    - Wei and Zunger, Appl. Phys. Lett. 72, 2011 (1998), theory 0.07 eV (supporting)
    - 'Katnani and Margaritondo, Phys. Rev. B 28, 1944 (1983): Tables II and V, indirect transitivity estimate +0.05 to +0.10 eV for E_v(CdSe) above E_v(ZnSe) (supporting, not a direct measurement)'
