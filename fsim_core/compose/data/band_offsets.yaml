# Literature band offsets for the Composer band panel (R2 BAND). DISPLAY-ONLY: no solver reads this file.
# Source: .workers/devlib/r2-band-offsets-answer.md (Fable), low temperature (0-10 K). One entry per material kind.
# Every number is a leaf {value, unit, tag in V/DR/E/A, where[, checked]}. NOTE: the V values are recalled from the Vurgaftman
# reviews (V01 = J. Appl. Phys. 89, 5815 (2001); VM03 = J. Appl. Phys. 94, 3675 (2003)) and the table numbers have NOT been
# re-checked against the papers, so every [V] leaf carries `checked: false`. Tags are never upgraded here.
# Variants: unstr = bulk dot, strained = fully pseudomorphic 2D limit, indot = in-dot interior estimate. A variant that lists
# Eg_dot, dE_c and dE_v is closed: dE_c + dE_v + Eg_dot = Eg_barrier within 5 meV (verify_compose_materials.py). Offsets in meV.
schema: fsim-band-offsets/1
note: 'Display-only literature band offsets at 0-10 K. [V] values are recalled from the Vurgaftman reviews and not re-checked (checked: false); tags are never upgraded.'
materials:
  cdse_znse:
    dot: CdSe (zb)
    barrier: ZnSe
    type: I
    flags:
      polar: false
      type2_risk: false
      hard_wall: false
    Eg_barrier:
      value: 2.82
      unit: eV
      tag: V
      checked: false
      where: Madelung 2004, ZnSe 2.82 eV at 0 K; table row 1
    variants:
      unstr:
        Eg_dot:
          value: 1.76
          unit: eV
          tag: E
          where: zb CdSe scatter 1.74-1.77 eV; table row 1
        dE_c:
          value: 850
          unit: meV
          tag: E
          where: natural-offset class, Wei and Zunger, Appl. Phys. Lett. 72, 2011 (1998); table row 1
        dE_v:
          value: 210
          unit: meV
          tag: E
          where: natural offset, range 100-300 meV; table row 1 (0.21 eV is the Fable recollection)
      strained:
        Eg_dot:
          value: 2.0
          unit: eV
          tag: E
          where: 'table row 1: ~2.0 eV strained, HH shift +0.2-0.3 eV; offsets not given for this variant'
    masses:
      m_e:
        value: 0.12
        unit: m0
        tag: E
        where: class estimate for the inverse-mass level split; the masses of this row are not in the Fable table [E]
      m_h:
        value: 0.45
        unit: m0
        tag: E
        where: class estimate for the inverse-mass level split; the masses of this row are not in the Fable table [E]
    sources:
    - 'Madelung, Semiconductors: Data Handbook, 3rd ed. (Springer, 2004)'
    - Wei and Zunger, Appl. Phys. Lett. 72, 2011 (1998)
