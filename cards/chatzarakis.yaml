meta:
  name: chatzarakis
  device: "(211)B InAs/GaAs piezoelectric QD in a lambda-microcavity, GaAs/AlAs SSL barriers, <Al>=57%"
  role: validation (V-a)
  source: "Chatzarakis et al., Phys. Rev. Applied 20, 034011 (2023); local PDF digitized 2026-07-21"
  note: >
    Antibunching dot of Figs. 4-5 (microcavity sample). g2 values are the
    published numbers printed in Fig. 5. Filter windows and line positions
    digitized programmatically from the embedded Fig. 4 raster (tick-calibrated,
    ~+-0.1 meV on window edges; X-peak position noisier at high T, ~+-0.5 meV).
    The 150 K and 210 K windows appear only in Fig. S4 (supplement unavailable)
    and are piecewise-linear interpolations, tagged [E] in the row source.

params:
  # --- spectral (Module C) ---
  delta_xx:
    value: 5.9
    unit: meV
    tag: DR
    source: "Fig. 4, 78 K panel: X 1.3313 eV, XX 1.3254 eV (red-shifted XX); +-0.3 meV digitization"
  E_lo:
    range: [15.0, 37.0]
    unit: meV
    tag: A
    source: >
      effective phonon activation energy of the Bose broadening term. Freed
      from the GaAs LO value (36.6) after the joint fit against Fig. S2
      overshot Gamma(>=240 K): the S2 shape (steep rise to ~150 K, then
      gentle growth) demands a lower effective energy -- alloy/interface
      phonon modes. Named Tier-2 refinement of the standing Gamma(T) model.
  gamma0:
    range: [0.05, 2.0]
    unit: meV
    tag: A
    source: "fit parameter: zero-T linewidth"
  a_ac:
    range: [0.0, 0.02]
    unit: meV/K
    tag: A
    source: "fit parameter: acoustic-phonon linear coefficient"
  b_lo:
    range: [1.0, 80.0]
    unit: meV
    tag: A
    source: "fit parameter: LO-phonon coupling strength"
  r_xx:
    range: [0.5, 1.0]
    unit: "1"
    tag: DR
    source: "Gamma_XX/Gamma_X ratio; Fig. S2 shows XX systematically narrower than X (~0.6-0.9)"

  # --- Gamma(T) anchor (V-a constraint) ---
  gamma_anchor:
    value: 6.5
    unit: meV
    tag: DR
    source: "paper Sec. III / Fig. S2: (211)B and (100) linewidths merge at T>=250 K to FWHM 6-7 meV"
  gamma_anchor_tol:
    value: 0.5
    unit: meV
    tag: DR
    source: "half-width of the published 6-7 meV interval"
  gamma_anchor_T:
    value: 250.0
    unit: K
    tag: DR
    source: "anchor temperature"

  # --- retention / background (rho path) ---
  a_esc:
    range: [1.0e+3, 1.0e+10]
    unit: "1"
    tag: A
    source: "fit parameter: WL-escape Arrhenius prefactor; paper reports order 1e7 for macro samples"
  E_a:
    range: [200.0, 290.0]
    unit: meV
    tag: DR
    source: "fit parameter bounded around the published activation energies (see E_a_prior)"
  E_a_prior:
    value: 240.0
    unit: meV
    tag: V
    source: "paper: Ea=(240+-20) meV for THIS microcavity dot (Fig. S5(b)); the 265+-30 meV of the planning doc is the <Al>=65% macro sample"
  E_a_prior_tol:
    value: 20.0
    unit: meV
    tag: V
    source: "published uncertainty for the microcavity dot"
  b_p:
    range: [1.0, 1.0e+4]
    unit: "1"
    tag: A
    source: "fit parameter: p-shell channel prefactor; paper: 'order of 100' (macro sample)"
  b_p_prior_log10:
    value: 2.0
    unit: "log10(1)"
    tag: DR
    source: "paper: coefficient b in the order of 100 -> log10 = 2"
  b_p_prior_log10_tol:
    value: 0.7
    unit: "log10(1)"
    tag: E
    source: "half-decade tolerance on an order-of-magnitude statement"
  E_b:
    value: 35.0
    unit: meV
    tag: DR
    source: "paper: Eb=(35+-5) meV, p-shell thermalization (~30 meV s-p splitting from PLE)"
  mu_op:
    value: 0.33
    unit: "1"
    tag: E
    source: "F1b operating point: pump 'a factor of 3 lower than the exciton saturation level' (paper Sec. III); mu = P/P_sat under linear capture"
  b0:
    range: [1.0e-5, 0.1]
    unit: "1"
    tag: A
    source: "fit parameter: T-independent background-to-signal ratio in the window"
  beta:
    range: [1.0e-4, 10.0]
    unit: "1"
    tag: A
    source: "fit parameter: escaped-carrier re-emission (WL/SSL background) coupling, B = b0 + beta*(1-S)"

data:
  g2_vs_T:
    tag: E
    source: >
      g2 values: published, printed in Fig. 5 [V]. Windows (w, dx) at
      78/120/170/230 K: digitized from Fig. 4 raster [DR]. Windows at
      150/210 K: piecewise-linear interpolation between digitized neighbors
      [E] -- replace from Fig. S4 when the supplement is available.
      dx = E_X - window center (negative: window blue-shifted past X).
    points:
      - {T: 78.0,  g2: 0.02, err: 0.01, bound: upper, w: 1.40, dx: -0.37}
      - {T: 120.0, g2: 0.10, err: 0.01, w: 3.19, dx: -0.70}
      - {T: 150.0, g2: 0.15, err: 0.01, w: 4.12, dx: -1.27}
      - {T: 170.0, g2: 0.18, err: 0.02, w: 4.74, dx: -1.65}
      - {T: 210.0, g2: 0.28, err: 0.03, w: 6.69, dx: -2.82}
      - {T: 230.0, g2: 0.36, err: 0.03, w: 7.66, dx: -3.41}

  gamma_vs_T:
    tag: E
    source: >
      FWHM linewidths digitized from supplement Fig. S2 (tick/decade-label
      calibrated, log axis; ~15% class error). NOTE: S2 is the MESA dot of
      main-text Fig. 3 (<Al>=57%, Delta=5.4 meV), not the microcavity
      antibunching dot -- the paper argues thermal broadening is generic for
      the class ((211)B merges with (100) at >=250 K), hence tag [E] for use
      on the cavity dot.
    points:
      - {T: 8.0,   gamma_x: 0.145, gamma_xx: 0.077}
      - {T: 78.0,  gamma_x: 1.06,  gamma_xx: 0.67}
      - {T: 90.0,  gamma_x: 0.95,  gamma_xx: 0.67}
      - {T: 100.0, gamma_x: 1.64,  gamma_xx: 1.05}
      - {T: 110.0, gamma_x: 2.52,  gamma_xx: 1.34}
      - {T: 120.0, gamma_x: 3.12,  gamma_xx: 2.43}
      - {T: 130.0, gamma_x: 3.73,  gamma_xx: 2.61}
      - {T: 140.0, gamma_x: 3.86,  gamma_xx: 2.77}
      - {T: 150.0, gamma_x: 4.20,  gamma_xx: 3.05}
      - {T: 160.0, gamma_x: 4.20,  gamma_xx: 3.23}
      - {T: 170.0, gamma_x: 4.84,  gamma_xx: 3.82}
      - {T: 200.0, gamma_x: 5.58,  gamma_xx: 4.56}
      - {T: 240.0, gamma_x: 6.22,  gamma_xx: 5.20}
      - {T: 260.0, gamma_x: 7.17,  gamma_xx: 6.22}

  tau_vs_T:
    tag: V
    source: >
      X-line decay times printed next to each spectrum in supplement Fig. S4
      (microcavity antibunching dot; mono-exponential TRPL fits; S6
      cross-checks 78 K: TRPL 1.77 ns vs antibunching 1.74 ns).
      tau(T)/tau(78K) is used as an independent retention-ratio constraint
      S(T)/S(78K), assuming a T-independent radiative rate (assumption
      ledger: cavity spectral walk-off and dark-state population violate this
      at some level).
    points:
      - {T: 78.0,  tau_ns: 1.77}
      - {T: 90.0,  tau_ns: 1.74}
      - {T: 100.0, tau_ns: 1.73}
      - {T: 110.0, tau_ns: 1.34}
      - {T: 120.0, tau_ns: 1.11}
      - {T: 130.0, tau_ns: 1.02}
      - {T: 140.0, tau_ns: 0.97}
      - {T: 150.0, tau_ns: 0.87}
      - {T: 160.0, tau_ns: 0.75}
      - {T: 170.0, tau_ns: 0.64}
      - {T: 180.0, tau_ns: 0.52}
      - {T: 190.0, tau_ns: 0.39}
      - {T: 200.0, tau_ns: 0.34}
      - {T: 210.0, tau_ns: 0.30}
      - {T: 220.0, tau_ns: 0.27}
      - {T: 230.0, tau_ns: 0.21}
