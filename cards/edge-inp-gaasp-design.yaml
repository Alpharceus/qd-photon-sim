meta:
  name: edge-inp-gaasp-design
  role: device-design
  device: >
    InP self-assembled QD in a GaAs0.60P0.40 well, (Al0.50Ga0.50)0.51In0.49P
    core cladding, (Al0.70Ga0.30)0.51In0.49P outer cladding, GaAs substrate;
    RT electrical edge emitter, HKUST-class transport diode.
  source: "primary RT edge-emitter design card, docs/rt_edge_contract.md"
  note: >
    Primary card of the room-temperature electrical edge-emitter tier
    (docs/rt_edge_contract.md). Opts into every new device.py mode:
    dot.linewidth=anchored, ret.mode=confinement (inline ret.system, no
    ret.preset), drive.mode=EL-transport with drive.diode.preset, emission.
    type=edge, aperture.compose, a non-empty filter.track_material, and
    drive.cw. Every scalar this card sets carries a design.provenance.
    sources entry keyed by its dotted design path; design.provenance also
    records the sweepable ranges the acceptance sweep consumes and the
    single-dot selection argument (aperture area x density x pi/4 < 0.5
    expected dots). drive.b_e and cavity.beta_sin are evaluator-derived and
    are never set here. Loads and evaluates with fsim_core.device
    (DeviceDesign.load / evaluate); checked mechanically by
    verify/verify_rt_edge_cards.py.

    KNOWN MODEL LIMITATION (documented, not hidden): dot_levels.DotSystem /
    device._resolve_edge give the confinement Hamiltonian and the edge-
    emission waveguide exactly ONE barrier material, used symmetrically on
    both sides of the matrix well. This device's real epitaxial stack has
    TWO distinct claddings (an inner (Al0.50Ga0.50)0.51In0.49P core and an
    outer (Al0.70Ga0.30)0.51In0.49P cladding); only the inner core enters
    ret.system.barrier (and therefore the confinement/edge-emission model).
    This is a genuine design choice, not (as previously documented here) a
    tabulation workaround: pr-pkg1-capture-escape (peer-review-triage.md
    finding 5) confirmed materials.refractive_index already resolves any
    AlGaInP x_al via composition-aware interpolation (materials.py
    _interp_n_by_x/_ALGAINP_ANCHORS), so an untabulated x_al=0.70 would
    NOT raise a KeyError today -- the inner core is used because it is the
    layer that structurally plays the "barrier" role immediately around
    the dot/matrix well (device.py's documented "shared inline stack"
    rule), matching the "one x_al per card" convention: ret.system.barrier.
    x_al equals thermal.layers[0] (the inner core), not thermal.layers[1]
    (the outer cladding). The outer cladding is carried honestly in
    thermal.layers (it is real and thermally relevant) but does not
    participate in the confinement/optical model -- giving the model TWO
    barrier materials is a separate, unfixed limitation, out of scope of
    finding 5 (which concerns cards/edge-inp-gainp-design.yaml's single-
    cladding stack). See design.provenance.sources
    ["ret.system.barrier.x_al"].

design:
  name: edge-inp-gaasp-design
  dot:
    linewidth: anchored
    delta_xx: 5.0
    gamma300: 12.0
  ret:
    # item 10 (pr-pkg1-fix2, low priority): ret.tau_cap_scales_with_density
    # (unset here -> false, the shipped no-cancellation convention; see
    # design.provenance.finding_1b_record) is currently NOT an axis of the
    # acceptance sweep -- the sweep spec will decide whether to add it.
    mode: confinement
    system:
      dot: InP
      matrix: {kind: GaAsP, x_p: 0.4}
      barrier: {kind: AlGaInP, x_al: 0.5, y_III: 0.51}
      substrate: GaAs
      geometry: {height_nm: 4.0, radius_nm: 12.0}
  drive:
    mode: EL-transport
    diode: {preset: hkust, tau_pulse_ns: 0.1}
    I_uA: 0.005161206095463967
    duty: 0.008
    b_res: 0.13636363636363635
    cw: true
    cw_irf_fwhm_ps: 50.0
    cw_tau_max_ns: 0.12
  thermal:
    T_hs: 300.0
    layers:
      - name: "(Al0.50Ga0.50)0.51In0.49P core"
        t_um: 0.5
        k300: 6.0
        alpha: 0.5
        spread: false
      - name: "(Al0.70Ga0.30)0.51In0.49P outer cladding"
        t_um: 1.5
        k300: 6.0
        alpha: 0.5
        spread: false
  cavity:
    enabled: false
  filter:
    track_material: dot
    hold_window: false
  aperture:
    compose: true
    density_cm2: 300000000.0
    diameter_um: 0.4
  emission:
    type: edge
    ridge_width_nm: 2000.0
    NA: 0.75
    R_back: 0.95
    L_um: 250.0
    alpha_cm: 5.0
    lambda_nm: 815.7

  provenance:
    card_id: edge-inp-gaasp-design
    class: primary

    sources:
      dot.linewidth:
        value: anchored
        tag: A
        source: >
          Opt-in to the anchored InP linewidth model (docs/rt_edge_contract.md
          block schema); anchor-fit class of Matsuda et al., PRB 63, 121304
          (2001), per device.py DotBlock.linewidth's documented convention.
      dot.delta_xx:
        value: 5.0
        tag: DR
        source: >
          [DR] Reischle et al., Optics Express 16, 12771 (2008), p. 12774,
          exciton-complex discussion: InP/GaInP-family X-XX binding range
          4-6 meV, quoted secondarily from Beirne et al., Phys. Rev. B 75,
          195302 (2007), Ref. 14 (not measured directly by Reischle et al.
          2008, matching the ledger's own reischle08-delta-xx tag: DR);
          used as the InP-dot-family proxy anchor for this InP/GaAsP
          design (no InP/GaAsP-dot X-XX measurement exists).
        anchor_id: reischle08-delta-xx
      dot.gamma300:
        value: 12.0
        tag: E
        source: >
          [E] Class proxy: In0.5Ga0.5As/GaAs single dot at 300 K (Matsuda et
          al., Physical Review B 63, 121304(R) (2001), ~12 meV homogeneous
          linewidth); the InP/GaAsP 300 K single-dot linewidth is unmeasured
          (docs/rt_edge_contract.md Evidence section). Sweep range 6-20 meV:
          Chatzarakis et al., Physical Review Applied 20, 034011 (2023)
          provides the 6.5 meV lower anchor (chatzarakis23-gamma300-class);
          the prior 16 meV entry for this claim is superseded (it was a
          300 K detection-bandpass filter width, not a measured emission
          linewidth -- see this field's note).
        anchor_id: matsuda01-gamma300-class
        note: >
          The g2 outcome hinges strongly on this number, evaluated fresh
          against the final card at its own drive.I_uA=0.011314080567212663
          (V_j and mu are unchanged across the sweep -- transport is
          independent of dot.gamma300 (the linewidth enters only the spectral overlap and filter stages): at gamma300 = 6.5 meV
          (chatzarakis23-gamma300-class lower anchor) g2_op = 0.6522505181;
          at 12.0 meV (this card's default, Matsuda 2001) g2_op =
          0.8295595445; at 16.0 meV (the previous, now-superseded
          Laferriere proxy) g2_op = 0.8690018619. All three recomputed
          fresh against the final card (council review 2026-09-06 item 1).
      ret.mode:
        value: confinement
        tag: E
        source: >
          Opt-in to dot_levels-derived confinement retention in place of the
          arsenide class-proxy Arrhenius fit (docs/rt_edge_contract.md block
          schema).
      ret.system.dot:
        value: InP
        tag: A
        source: "InP self-assembled QD, the RT edge-emitter tier's target dot material (docs/rt_edge_contract.md)."
      ret.system.matrix.x_p:
        value: 0.4
        tag: A
        source: >
          GaAs0.60P0.40 well composition, the simulator's own design-card
          GaAsP class (dot_levels.class_presets 'InP/GaAsP0.4/AlGaAs0.4 on
          GaAs'), chosen to keep the well direct-gap with margin
          (materials_research.md Section 0(c), per dot_levels.py docstring).
          Gu et al., Opt. Express 33, 23732 (2025) use x=0.35 in their own
          device; no single-photon data exists for either composition.
      ret.system.barrier.x_al:
        value: 0.5
        tag: E
        source: >
          pr-pkg1-capture-escape (peer-review-triage.md finding 5): equals
          thermal.layers[0]'s own inner-core Al fraction, (Al0.50Ga0.50)
          0.51In0.49P (Moser et al., APL 64, 235 (1994); Schubert et al.,
          JAP 86, 2025 (1999)) -- the "one x_al per card" rule applied to
          the layer that structurally plays the confinement "barrier" role
          (device.py's documented "shared inline stack" rule, also used by
          emission.type='edge'). Not a tabulation workaround: materials.
          refractive_index already resolves any AlGaInP x_al via
          composition-aware interpolation (materials.py _interp_n_by_x/
          _ALGAINP_ANCHORS), so an untabulated composition does not raise a
          KeyError; a literal x_al=0.55 MATERIAL_EXTRA entry was tried
          (pr-pkg1-capture-escape) and then removed (pr-pkg1-fix2 item 8):
          it reproduced the interpolation fallback's own value to float
          round-off, adding no independent source. The real outer cladding,
          (Al0.70Ga0.30)0.51In0.49P, is retained honestly in thermal.layers
          but deliberately does NOT enter ret.system.barrier (see the
          card-level KNOWN MODEL LIMITATION note: one barrier material for
          two claddings is a separate, unfixed limitation).
      ret.system.barrier.y_III:
        value: 0.51
        tag: DR
        source: >
          Lattice-matched-to-GaAs III-sublattice fraction, Vurgaftman et
          al., JAP 89, 5815 (2001) convention (materials.AlGaInP default).
      ret.system.substrate:
        value: GaAs
        tag: A
        source: "GaAs growth substrate, Gu et al., Opt. Express 33, 23732 (2025) HKUST class."
      ret.system.geometry.height_nm:
        value: 4.0
        tag: E
        source: >
          dot_levels.class_presets 'InP/GaAsP0.4/AlGaAs0.4 on GaAs' default
          height: the simulator's own design-card variant of Gu et al.
          2025's reported 4-7 nm InP island range.
      ret.system.geometry.radius_nm:
        value: 12.0
        tag: A
        source: >
          Radius not reported by Gu et al. 2025; carried over at 12 nm per
          dot_levels.class_presets' hkust() class default.
      drive.mode:
        value: EL-transport
        tag: A
        source: >
          Opt-in transport-aware electrical drive (docs/rt_edge_contract.md
          block schema); Gu et al., Opt. Express 33, 23732 (2025)
          electrically pumped InP/GaAsP ridge device.
      drive.diode.preset:
        value: hkust
        tag: E
        source: >
          transport.hkust_preset: Gu et al. 2025-like p-i-n stack
          (Al0.4Ga0.6As claddings/barriers each side of the GaAs1-xPx well).
      drive.diode.tau_pulse_ns:
        value: 0.1
        tag: A
        source: "[A] 0.1 ns pulse width, an 80 MHz-class pulsed electrical drive design choice as in Reischle et al., Appl. Phys. Lett. 97, 143513 (2010) / typical pulsed SPS operation."
      drive.duty:
        value: 0.008
        tag: A
        source: "[A] 0.008 duty at 80 MHz, the sweep configuration; 80 MHz-class pulsed electrical drive as in Reischle et al., Appl. Phys. Lett. 97, 143513 (2010) / typical pulsed SPS operation."
      drive.I_uA:
        value: 0.005161206095463967
        tag: DR
        source: >
          [DR] pr-pkg1-capture-escape (peer-review-triage.md finding 1b)
          re-solve: the confinement retention fix (RetentionBlock.n_dot_cm2
          now defaults to this card's own aperture.density_cm2=3e8 cm^-2
          instead of dot_levels.retention_params' 1e10 cm^-2 default)
          collapses S(300 K) far below its prior value (see design.
          provenance's finding-1b record below), so the prior I_uA=
          0.011314080567212663 operating point is no longer near-optimal.
          Re-run: Log-spaced grid I_uA=10^-4..10^-1 (31 points), followed
          by a local solve (scipy minimize_scalar, bounded) on the loaded
          card at T_hs=300 K, calling fsim_core.device.evaluate: the
          constrained pulsed-g2 minimum is at the explicit tau_pulse_ns=
          0.1 ns, duty=0.008 (80 MHz), I_uA=0.005161206095463967, where
          V_j=1.4622927350 V, f_qfl=0.1074024321, mu=0.0999999987,
          rho_op=0.3930166427, g2_op=0.9795610814, and
          collected_flux_pulsed_s=2.1745160393. eta_NA=0.8222156778,
          eta_total=0.0185615579 (waveguide-na-collection-fix's circular
          NA-cone / 1/e^2-width convention, A_mode = pi w_x w_y; unchanged
          from the prior operating point -- Lemma 1, collection is
          independent of the drive current). The collected flux is now
          far below the 1 kHz floor and g2_op is far above 0.5 -- this
          design NO LONGER clears either acceptance gate at its own
          default operating point once the density fix is applied (it is
          still the flux-maximising allowed current: the 0.5x point has
          mu=0.0128, below the 0.05 floor (sub-turn-on, infeasible); the
          2x point is feasible (mu=0.7656, not sub-turn-on) with
          g2_op=0.9960116 there, still worse (higher) than this point's
          g2_op, so it does not beat this point). See design.provenance's
          finding-1b record for the favourable-corner (T_hs=230 K,
          gamma300=6, delta_xx=8, NA=0.8, R_back=0.95, L=250 um) g2/flux
          under both the default (no-cancellation) and the opt-in
          full-cancellation (ret.tau_cap_scales_with_density) conventions.
          No literature single-dot InP/GaAsP drive current exists; this is
          a simulator-derived operating point.
      drive.cw:
        value: true
        tag: A
        source: "Opt-in CW g2(tau)/IRF diagnostics (docs/rt_edge_contract.md block schema)."
      drive.b_res:
        value: 0.13636363636363635
        tag: A
        source: "[A] class value transferred from a different material and temperature: Reischle et al., Optics Express 16, 12771 (2008), InP/AlGaInP QD C at 80 K (raw g2 0.43 -> 0.03 after background correction, rho approximately 0.88 -> b_res = 1/0.88 - 1 = 0.136; ledger anchor reischle08-b-res-80k in verify/data/rt_edge_anchors.yaml states rho = 0.88 directly -- this card's b_res = 1/rho - 1 transformation, and its transfer to 300 K InP/GaAsP, are assumptions of this card, not of that anchor); T-independent residual assumed."
      drive.cw_irf_fwhm_ps:
        value: 50.0
        tag: DR
        source: >
          Within the acceptance sweep's irf_ps=[50,200] ps class range
          (design.provenance.ranges); lowered from the module's 100 ps
          representative-fast-SPAD default (council review 2026-09-05):
          this dot's confinement escape is very fast (k_XX ~ 2074 ns^-1,
          dot_levels/cw_g2.escape_rates_from_retention at this operating
          point), which forces cw_g2.cw_report's fixed time step dt ~
          0.05/k_XX ~ 2.4e-5 ns; the discrete IRF kernel (irf_kernel,
          reach = 8 sigma_IRF) then has ~8 sigma_IRF/dt points regardless
          of drive.cw_tau_max_ns, so halving the IRF FWHM (which halves
          sigma_IRF) roughly halves both the kernel size and the
          drive.cw_tau_max_ns floor below, the only two-sided lever
          available from a card (cw_g2.py's grid/kernel code is out of
          this card's scope) to keep evaluate() inside the <5 s bound;
          still a fast-SPAD-class instrument response, at the sweep's own
          50 ps low end.
      drive.cw_tau_max_ns:
        value: 0.12
        tag: DR
        source: >
          Council review 2026-09-05: 0.02 ns put 81% of the IRF kernel
          weight on edge padding (kernel FWHM > window). Re-derived as
          >= 5 sigma_IRF + 5 tau_dip at this card's cw_irf_fwhm_ps = 50 ps:
          sigma_IRF = 50 ps / 2.3548 = 0.02123 ns (5 sigma = 0.1062 ns);
          tau_dip = 0.000964 ns from cw_g2.cw_report's own single-
          exponential dip fit at this operating point (5 tau_dip =
          0.0048 ns) -- floor 0.111 ns. 0.12 ns clears that floor with
          margin; at 100 ps FWHM (the module's usual default) this dot's
          fast k_XX (~2074 ns^-1, see drive.cw_irf_fwhm_ps above) pushes
          evaluate() to 5.0-5.8 s even at the bare 0.217 ns floor --
          over the <5 s bound -- so cw_irf_fwhm_ps was lowered together
          with cw_tau_max_ns (both card-level scalars) rather than left
          unmet; at cw_irf_fwhm_ps = 50 ps, evaluate() completes in
          ~2.8-3.0 s at this card's drive.I_uA, inside the <5 s/evaluation
          bound with margin; a numerical choice, not a literature value.
      thermal.T_hs:
        value: 300.0
        tag: A
        source: "[A] TEC-cooled package; the junction temperature is still solved self-consistently from the drive power. Default is the 300 K room-temperature operating point (docs/rt_edge_contract.md)."
      thermal.layers.0.t_um:
        value: 0.5
        tag: E
        source: "Inner (Al0.50Ga0.50)0.51In0.49P core-cladding thickness, class estimate."
      thermal.layers.0.k300:
        value: 6.0
        tag: E
        source: >
          Adachi (2007) AlGaInP alloy-class thermal-conductivity estimate;
          the same class value materials.MATERIAL_EXTRA records for
          (Al0.50Ga0.50)0.51In0.49P.
      thermal.layers.0.alpha:
        value: 0.5
        tag: E
        source: >
          Adachi (2007) alloy-class k(T) exponent, matching
          materials.MATERIAL_EXTRA's (Al0.50Ga0.50)0.51In0.49P alpha_k.
      thermal.layers.0.spread:
        value: false
        tag: A
        source: "Planar heat flow, no current-spreading correction (matches the legacy staged-device-design.yaml default)."
      thermal.layers.1.t_um:
        value: 1.5
        tag: E
        source: >
          Outer (Al0.70Ga0.30)0.51In0.49P cladding thickness, matching the
          legacy staged-device-design.yaml epi/cladding class value.
      thermal.layers.1.k300:
        value: 6.0
        tag: E
        source: >
          Same AlGaInP alloy-class thermal-conductivity estimate as the
          inner core layer (Adachi 2007); alloy scattering makes the two
          compositions indistinguishable at this [E] class precision.
      thermal.layers.1.alpha:
        value: 0.5
        tag: E
        source: "Same Adachi (2007) alloy-class k(T) exponent as the inner layer."
      thermal.layers.1.spread:
        value: false
        tag: A
        source: "Planar heat flow, no current-spreading correction."
      cavity.enabled:
        value: false
        tag: A
        source: >
          emission.type='edge' is incompatible with a resonant cavity
          (device.evaluate()'s guard; docs/rt_edge_contract.md); this
          design has no resonant cavity.
      filter.track_material:
        value: dot
        tag: A
        source: "[A] inert in this configuration (no cavity); kept for the cavity variant. hold_window is false, so the named material is validated but does not move the filter window."
      filter.hold_window:
        value: false
        tag: A
        source: "[A] inert in this configuration (no cavity); kept for the cavity variant."
      aperture.compose:
        value: true
        tag: A
        source: >
          Opt-in continuous Poisson competitor-bath composition
          (docs/rt_edge_contract.md "Aperture assumptions").
      aperture.density_cm2:
        value: 300000000.0
        tag: A
        source: >
          Lithographic single-dot-isolation design target (design.
          provenance.single_dot_selection: n_expected < 0.5), paired with
          aperture.diameter_um; NOT a published InP-dot density (council
          review 2026-09-05: the previous [E] citation to Chatzarakis et
          al., Phys. Rev. Applied 20, 034011 (2023) was wrong -- that
          paper's dots are InAs/GaAs, and its own low-density note is 7e8
          cm^-2, not this value). The only published InP-dot density in
          the digests is ~1e10 cm^-2 (Reischle et al., Appl. Phys. Lett.
          97, 143513 (2010), current-funneling growth), two orders of
          magnitude above this design target; single-dot selection here
          is a lithographic-mesa choice, distinct from that growth-density
          approach (mirrors the gainp card's aperture.density_cm2 tag).
      aperture.diameter_um:
        value: 0.4
        tag: A
        source: >
          Within the Chatzarakis et al., Phys. Rev. Applied 20, 034011
          (2023) 0.3-3 um e-beam mesa class; chosen for single-dot
          selection (design.provenance.single_dot_selection).
      emission.type:
        value: edge
        tag: A
        source: >
          Opt-in edge out-coupling (docs/rt_edge_contract.md;
          waveguide.edge_emission on the shared ret.system stack).
      emission.ridge_width_nm:
        value: 2000.0
        tag: A
        source: >
          2 um ridge, within the Chatzarakis et al., Phys. Rev. Applied 20,
          034011 (2023) 0.3-3 um mesa/ridge class; no InP/GaAsP edge-
          emitter ridge width has been published.
      emission.NA:
        value: 0.75
        tag: A
        source: >
          [A] 0.75 numeric aperture, within the 0.7-0.8 standard microscope-
          objective class (Laferriere et al., Nano Letters 23, 962 (2023)
          used NA 0.81 for first-lens collection); no InP/GaAsP edge-emitter
          NA has been published. Declared explicitly per council review
          2026-09-06 item 3 (previously an undeclared device.py default of
          0.5, which understated the collected-flux calculation).
      emission.R_back:
        value: 0.95
        tag: A
        source: >
          [A] HR-coated back facet, standard practice for edge-emitting
          lasers/SPS devices to force emission out the front facet; no
          InP/GaAsP edge-emitter back-facet coating has been published, so
          this is a stated coating assumption. Declared explicitly per
          council review 2026-09-06 item 3 (previously an undeclared
          device.py default of None, i.e. two facets sharing emission
          equally).
      emission.L_um:
        value: 250.0
        tag: A
        source: >
          [A] Cleaved ridge length, shorter than the device.py 500 um
          undeclared default, reducing propagation loss (emission.alpha_cm
          below) over the shorter path; no InP/GaAsP edge-emitter ridge
          length has been published. Declared explicitly per council
          review 2026-09-06 item 3.
      emission.alpha_cm:
        value: 5.0
        tag: E
        source: >
          [E] Ridge propagation-loss class value, the same class estimate
          already carried as device.py's own undeclared EmissionBlock.
          alpha_cm default (waveguide.py). Declared explicitly on the card
          per council review 2026-09-06 item 3 rather than left implicit.
      emission.lambda_nm:
        value: 815.7
        tag: DR
        source: >
          Council review 2026-09-05, completed after materials.
          MATERIAL_EXTRA gained ratio-scaled [E] refractive-index points
          for ret.system.matrix (GaAs0.60P0.40) and ret.system.barrier
          ((Al0.50Ga0.50)0.51In0.49P) at 700-850 nm (orchestrator-approved
          option (c): 668 nm class value x Ga0.51In0.49P's own measured
          n(lambda)/n(668) dispersion ratio, Schubert et al., JAP 77,
          3416 (1995) -- see materials.py comments on those entries).
          815.7 nm is this dot's own confinement-derived transition
          (dot_levels.levels(system), 300 K: E_X = 1.520 eV), i.e. the
          device.py EmissionBlock.lambda_nm=0 default's resolved value,
          set explicitly here (rather than left at 0) so the [DR] tag and
          this note are visible on the card itself. waveguide.edge_emission
          now runs at this wavelength instead of the previous 668 nm
          tabulation-limited fallback (18.0% off), so beta/Gamma_dot/
          n_eff/eta_NA and all downstream fluxes are evaluated at the
          modelled emitter's own line.

          KNOWN MODEL DEVIATION, not a design choice: this solver output
          (815.7-816 nm, dot_levels' confinement Hamiltonian on the
          design-card GaAsP0.4 variant; see verify/verify_dot_levels.py's
          known-deviations section, item d-iv-a) is ~9% above the
          published HKUST-class target emission, 750-755 nm (Gu et al.,
          Opt. Express 33, 23732 (2025), 755 nm; Luo et al., Opt. Express
          30, 40750 (2022), a second 750 nm-class candidate; verify/data/
          rt_edge_anchors.yaml's gu25-hkust-wavelength / luo22-hkust-
          wavelength-si anchors). This gap is the module's own documented
          large-mismatch 3D-island-relaxation limitation (dot_levels.py
          docstring), not something this card's emission.lambda_nm papers
          over by picking the published number instead of the solver's.

    ranges:
      thermal.T_hs:
        lo: 230.0
        hi: 300.0
        unit: K
        tag: A
        note: "[A] TEC-cooled package; the junction temperature is still solved self-consistently from the drive power."
      dot.delta_xx:
        lo: 4.0
        hi: 8.0
        unit: meV
        tag: DR
        source: >
          docs/rt_edge_contract.md Evidence section's restated union across
          both independent sources: Beirne et al., Phys. Rev. B 75, 195302
          (2007) 4 meV lower bound (quoted secondarily by Reischle et al.,
          Optics Express 16, 12771 (2008), p. 12774) and Bommer et al., J.
          Appl. Phys. 110, 063108 (2011) 7 +/- 1 meV upper bound; union
          4-8 meV, overlapping only marginally near 6 meV.
