meta:
  name: qcap-staged
  device: "staged InP/GaAsP QD electrical device, mesa on GaAs and GaAs/Si templates"
  role: prediction (Phase-1 thermal deliverable -- requirement envelopes only)
  source: "QCAP staged-device concept; no fabricated device exists. Every entry [A]/[E]."
  note: >
    Prediction card: outputs are requirement envelopes and sensitivity
    rankings, never point predictions (planning doc section 1). The epi-stack
    effective conductivity is the dominant unknown -- it is swept, and the
    T_j maps carry its full range.

params:
  mesa_diameter:
    range: [0.3, 3.0]
    unit: um
    tag: A
    source: "e-beam mesa layout, mirroring the Chatzarakis 0.3-3 um pattern"
  epi_thickness:
    value: 1.5
    unit: um
    tag: A
    source: "cladding + current-spreading stack above the substrate/buffer; design TBD"
  epi_k:
    range: [8.0, 40.0]
    unit: W/m/K
    tag: A
    source: "effective (anisotropic) conductivity of GaAsP/AlGaInP-class alloy stack; alloy scattering can push below 10 -- MEASURE"
  epi_alpha:
    value: 0.5
    unit: "1"
    tag: A
    source: "k(T) exponent for the alloy stack: alloy scattering flattens the bulk ~T^-1.25 law; 0.5 assumed"
  mesa_etch_through:
    value: 1.0
    unit: "1"
    tag: A
    source: "1 = mesa etched through the epi stack (pillar, laterally insulated); 0 = planar (cone spreading)"
  buffer_thickness:
    value: 2.0
    unit: um
    tag: E
    source: "GaAs buffer on Si template, typical heteroepitaxy"
  buffer_k:
    value: 44.0
    unit: W/m/K
    tag: E
    source: "defect-reduced GaAs buffer on Si, ~20% below bulk GaAs"
  V_drive:
    value: 1.9
    unit: V
    tag: E
    source: "red p-i-n forward voltage at operating current"
  I_drive:
    range: [1.0, 200.0]
    unit: uA
    tag: A
    source: "drive-current envelope for the T_j map"
  duty:
    value: 1.0
    unit: "1"
    tag: A
    source: "CW worst case; pulsed drive scales linearly"
  T_heatsink:
    value: 77.0
    unit: K
    tag: A
    source: "LN2 stage baseline for the map; 77-120 K is the anchored Phase-3 window"

  # --- Phase-3 spectral/drive envelope inputs (all [A] until measured) ---
  delta_xx_staged:
    range: [1.5, 5.0]
    unit: meV
    tag: A
    source: "InP/GaAsP X-XX splitting: ZERO published single-dot values [V, null] -- the program's decisive in-house measurement; swept"
  gamma_scale:
    range: [0.7, 1.3]
    unit: "1"
    tag: A
    source: "InP/GaAsP Gamma(T) unknown; the arsenide-class V-a fit shape is carried, scaled by this factor"
  b_e_total:
    range: [1.0e-3, 0.3]
    unit: "1"
    tag: A
    source: "total injection background (WL EL + barrier EL + leakage) at the operating point, in signal units; MEASURE under injection"
  mu_op_staged:
    range: [0.1, 1.0]
    unit: "1"
    tag: A
    source: "electrical loading per pulse at the operating point"
  sigma_inh:
    value: 40.0
    unit: meV
    tag: A
    source: "inhomogeneous ensemble broadening for the F5 aperture statistics (foundation section 5)"
  comp_brightness:
    value: 0.3
    unit: "1"
    tag: A
    source: "relative brightness of in-window competitor dots (off-resonant coupling); F5 penalty input"
  qd_density:
    range: [1.0e+8, 2.0e+10]
    unit: cm^-2
    tag: A
    source: "growth lever: native 7e9-2e10; low-density growth reaches ~7e8 (Chatzarakis Sec. II analogy)"
