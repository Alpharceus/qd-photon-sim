meta:
  name: nitride-qw-fluctuation-pulse-design
  role: device-design
  device: >
    Planar In0.25Ga0.75N/GaN QW-thickness-FLUCTUATION dot in a
    vertical-cavity, electrically driven single-photon design
    (fsim_core.device.DeviceDesign.platform="ingan_gan_planar",
    nitride.dot.geometry_type="qw_fluctuation"), rectangular
    finite-electrical-pulse loading.
  source: "nitride-geometry-stark-contract (piece 5), docs/nitride_geometry_stark_contract.md; parent card cards/nitride-cavity-pulse-design.yaml (piece 6), docs/nitride_cavity_contract.md"
  note: >
    Same-composition QW-thickness-fluctuation headline card, a copy of the
    round-1 c-plane headline card cards/nitride-cavity-pulse-design.yaml
    with the following intended changes only: nitride.dot.geometry_type
    (isolated_dot -> qw_fluctuation), nitride.dot.shape (explicit disc, the
    only shape qw_fluctuation supports), nitride.dot.height_nm (3.0 -> 3.5
    nm [A]), nitride.dot.radius_nm (10.0 -> 20.0 nm [A]), nitride.dot.
    wl_thickness_nm (0.0 -> 3.0 nm, the local thickness-fluctuation "w"
    [A]), and the matching drive.diode fields (wl_thickness_nm 0.5 -> 3.0
    nm, x_in unchanged at 0.25, d_i_nm 24.5 -> 27.0 nm, d_active_nm unset
    -> 3.5 nm) required by device.py's own QW-card consistency guard
    (_evaluate_nitride: "QW cards require drive.diode.wl_thickness_nm ==
    nitride.dot.wl_thickness_nm" and "== nitride.dot.x_in", and
    "drive.diode.d_i_nm >= dot height"). Every other leaf (dot, ret.channel
    =min, drive.finite_pulse/rep_rate_hz/duty/gate_ns/I_uA/cw/b_res,
    thermal, cavity, emission, aperture, nitride.dot.x_in/strain_fraction/
    screening_fraction/external_field_kVcm/vbo_InN_GaN_eV/
    strain_c_fraction, nitride.cavity, nitride.tau_rad0_ns/k_nr_ns/
    background_tau_ns/eta_background) is held IDENTICAL to that c-plane
    card, per docs/nitride_geometry_stark_contract.md "QW-fluctuation
    pair". The dot's own confinement solver (fsim_core.nitride_levels.
    _qw_levels) reports no explicit reservoir_energy_eV override --
    nitride.background carries no override key, which device.py's guard
    requires for qw_fluctuation cards -- and exposes reservoir_kind=
    'ingan_qw' from the SAME surrounding InGaN well (x_in=0.25,
    wl_thickness_nm=3.0 nm) shared between the confinement dot and the
    diode's own SRH background layer, closing the reservoir-vs-diode
    disagreement documented in _nitride_reservoir_energy_eV's docstring
    for isolated-dot cards; this QW well still uses the existing bulk-SRH
    carrier approximation (fsim_core.nitride_transport.evaluate_injection)
    rather than a newly solved QW carrier distribution. Same-composition
    thickness fluctuation confines carriers LATERALLY through the
    subband-energy difference between the thin dot column and the thicker
    surrounding well (fsim_core/nitride_levels.py _qw_levels: "de_lat=
    er-ee" / "dh_lat=hr-eh"), not through a composition or barrier-height
    change.

    Headline planar InGaN/GaN cavity card, rectangular electrical-pulse
    loading (drive.cycle_loading=rectangular). Companion card
    cards/nitride-qw-fluctuation-set-design.yaml uses IDENTICAL geometry/optics/
    material parameters (dot, ret, drive.diode/finite_pulse/rep_rate_hz/
    duty/gate_ns/I_uA/cw/b_res, thermal, cavity, emission, aperture,
    nitride.dot, nitride.cavity, nitride.tau_rad0_ns/k_nr_ns/
    background_tau_ns/eta_background) -- only meta.name, design.name,
    drive.cycle_loading and the SET pricing metadata (drive.eta_load,
    drive.set_params) differ (docs/nitride_geometry_stark_contract.md
    "QW-fluctuation pair"). Opts into every nitride mode: dot.linewidth=anchored,
    dot.lineshape=lorentzian, ret.mode=nitride_confinement, drive.mode=
    EL-transport with drive.diode.preset=nitride-planar, drive.finite_pulse
    =true, emission.type=vertical_cavity, cavity.type=nitride_planar. Every
    explicit leaf carries a design.provenance.sources entry keyed by its
    dotted design path; design.provenance.ranges records the frozen
    headline sweep grid and the one-at-a-time sensitivity ranges piece 7
    (nitride-sweep-results) consumes. Loads and evaluates with
    fsim_core.device (DeviceDesign.load/evaluate); checked mechanically by
    verify/verify_nitride_cards.py. No production code is edited by this
    piece.

    Class discipline (README.md's five-way split): this card's own
    evaluated output is (N) numerical verification of device.py's wiring
    (does the card load/round-trip/evaluate as declared), not a demonstrated
    hardware result -- most inputs are [A] design choices or [E] estimates,
    a handful ([V]) are literature-transcribed material/doping constants
    transferred from an off-platform measurement, which makes the TRANSFER
    itself [E] or [A] even where the underlying number is [V]. No claim of
    held-out prediction is made anywhere on this card.

design:
  name: nitride-qw-fluctuation-pulse-design
  platform: ingan_gan_planar

  dot:
    linewidth: anchored
    lineshape: lorentzian
    gamma0: 1.0
    a_ac: 0.03
    E_LO: 91.5
    gamma300: 35.0
    r_xx: 1.0
    delta_xx: -10.0

  ret:
    mode: nitride_confinement
    channel: min
    tau_cap_ps: 10.0
    tau_cap_scales_with_density: false
    b0: 0.0
    beta: 0.0

  drive:
    mode: EL-transport
    diode:
      preset: nitride-planar
      tau_pulse_ns: 0.1
      N_A: 1.0e+17
      N_D: 1.0e+18
      d_i_nm: 27.0
      d_active_nm: 3.5
      x_in: 0.25
      wl_thickness_nm: 3.0
    finite_pulse: true
    cycle_loading: rectangular
    rep_rate_hz: 8.0e+7
    duty: 0.008
    gate_ns: null
    I_uA: 0.02
    cw: false
    b_res: 0.1

  thermal:
    T_hs: 300.0
    mesa_diameter_um: 20.0
    layers:
      - name: "GaN epi film"
        t_um: 2.0
        k300: 130.0
        alpha: 0.5
        spread: false
      - name: "dielectric DBR + contact stack (effective)"
        t_um: 1.0
        k300: 2.0
        alpha: 0.0
        spread: false
    substrate:
      name: Si
      k300: 150.0
      alpha: 1.3

  cavity:
    enabled: true
    type: nitride_planar

  emission:
    type: vertical_cavity

  filter: {}

  aperture:
    density_cm2: 1.0e+10
    diameter_um: 0.05

  nitride:
    dot:
      height_nm: 3.5
      radius_nm: 20.0
      x_in: 0.25
      wl_thickness_nm: 3.0
      strain_fraction: 1.0
      screening_fraction: 0.0
      external_field_kVcm: 0.0
      vbo_InN_GaN_eV: 1.15
      strain_c_fraction: 0.7
      geometry_type: qw_fluctuation
      shape: disc
    cavity:
      Q: 2000.0
      mode_volume_norm: 2.0
      spatial_overlap: 1.0
      eta_out: 0.1
      T_track: 300.0
      dEdT_cav_meV_K: -0.04
      detuning_offset_meV: 0.0
      purcell_enabled: true
    tau_rad0_ns: 1.0
    k_nr_ns: 0.0
    background_tau_ns: 0.0
    eta_background: 0.1

  provenance:
    card_id: nitride-qw-fluctuation-pulse-design
    class: headline
    platform: ingan_gan_planar
    cycle_loading: rectangular

    sources:
      platform:
        value: ingan_gan_planar
        unit: enum
        tag: A
        source: "Opt-in planar InGaN/GaN evaluator (fsim_core/device.py DeviceDesign.platform, _evaluate_nitride)."

      dot.linewidth:
        value: anchored
        unit: enum
        tag: A
        source: "Required opt-in for the nitride evaluator (device.py evaluate() guard: ret.mode='nitride_confinement' requires dot.linewidth='anchored')."
      dot.lineshape:
        value: lorentzian
        unit: enum
        tag: A
        source: "Required opt-in for the nitride evaluator (device.py evaluate() guard rejects any other lineshape for platform='ingan_gan_planar')."
      dot.gamma0:
        value: 1.0
        unit: meV
        tag: A
        source: >
          Low-temperature homogeneous linewidth floor. No InGaN single-dot
          low-T linewidth measurement is in the digest at this In content
          (7f/7a report 0.3-2.5 meV, 5 K, at lower In content); 1.0 meV is
          an explicit within-range [A] design choice, not fit to those
          numbers.
      dot.a_ac:
        value: 0.03
        unit: meV/K
        tag: A
        source: >
          Acoustic-phonon linewidth slope; no InGaN-dot-specific value in
          the digest. [A] design choice within the same order of magnitude
          as the module's InP class default (device.py DotBlock.a_ac=2e-3
          meV/K is a different material's [V] Ortner et al. value, not
          transferred here).
      dot.E_LO:
        value: 91.5
        unit: meV
        tag: E
        source: >
          [V] GaN bulk LO phonon (Seguin et al., arXiv:cond-mat/0610425
          (2006), main text) transferred, unmodified, to the alloyed
          InGaN dot's own phonon coupling: an [E] alloy transfer, not a
          measurement of this specific alloy fraction.
        anchor_id: seguin2006-gan-lo-phonon
      dot.gamma300:
        value: 35.0
        unit: meV
        tag: A
        source: >
          300 K homogeneous linewidth. No electrical InGaN/GaN single-dot
          300 K linewidth measurement exists in the digest. Wang et al.
          (arXiv:1610.00152 / Sci. Rep. 7, 12089 (2017)) report 19.0 +/- 0.4
          meV at 220 K for a-plane InGaN dots and note the RT class
          extrapolates to roughly 25-30 meV (Notes-for-the-simulator item 3
          in ../_goal/nitride_digests.md); Tamariz et al. (ACS Photonics 7,
          1515 (2020)) report 55 +/- 7 meV at 300 K for the DIFFERENT
          GaN/AlN material system under optical pumping. 35 meV is an [A]
          design choice inside the union of both class ranges; it is NOT a
          fit to either paper's data, and is NOT the Wang 220 K value
          rescaled -- do not read a hidden fit here.
        note: "See design.provenance.ranges['dot.gamma300'] for the one-at-a-time sensitivity axis [25, 35, 55] meV."
      dot.r_xx:
        value: 1.0
        unit: dimensionless
        tag: A
        source: >
          Gamma_XX/Gamma_X ratio; no InGaN-dot-specific measurement in the
          digest. [A] neutral (equal-linewidth) design choice, distinct
          from the module's InP class default (device.py DotBlock.r_xx=
          0.72, a different material's [DR] class value, not transferred
          here).
      dot.delta_xx:
        value: -10.0
        unit: meV
        tag: E
        source: >
          [V] Deshpande et al., Nat. Commun. 4, 1675 (2013), p.2-3, Fig. 3c
          (single-dot EL, 10 K, nanowire dot-in-wire, XX above X =
          antibinding), transferred unmodified in sign and magnitude to
          this planar 300 K design: an [E] platform/temperature transfer,
          not the -10 meV figure itself. Seguin et al. (arXiv:cond-mat/
          0610425 (2006)) report a -3.5 to +16 meV InGaN range spanning
          both signs (p.3); this card does not average over that range.
        anchor_id: deshpande2013-xx-splitting
        note: "See design.provenance.ranges['dot.delta_xx'] for the one-at-a-time sensitivity axis [-10, +10, +16] meV."

      ret.mode:
        value: nitride_confinement
        unit: enum
        tag: A
        source: "Required opt-in for the nitride evaluator (device.py _evaluate_nitride guard)."
      ret.channel:
        value: min
        unit: enum
        tag: A
        source: >
          nitride_levels.rates()'s 'min' channel picks the faster of the
          electron/hole escape rates (2D-reservoir detailed-balance model,
          [A]); the RetentionBlock class default 'pair_half' is rejected by
          this evaluator (requires a bound wetting-layer continuum this
          card's finite-well model does not carry) and must be overridden
          explicitly.
      ret.tau_cap_ps:
        value: 10.0
        unit: ps
        tag: A
        source: >
          Carrier capture time into the dot; no InGaN-dot-specific
          measurement in the digest. [A] design choice, matching
          nitride_levels.rates()'s own 10.0 ps class default (dot_levels.py
          retention_params convention) restated explicitly per this
          contract's rule that every explicit card leaf carries its own
          source.
        note: "See design.provenance.ranges['ret.tau_cap_ps'] for the one-at-a-time sensitivity axis [1, 10, 100] ps."
      ret.tau_cap_scales_with_density:
        value: false
        unit: bool
        tag: A
        source: >
          Shipped 'no-cancellation' convention (device.py RetentionBlock
          docstring; docs/rt_edge_contract.md 'Model axes' pkg5b
          discussion of the analogous InP tier's own default); the opt-in
          'full-cancellation' alternative is left off by default on this
          card, consistent with the RT-edge tier's own shipped default.
      ret.b0:
        value: 0.0
        unit: dimensionless
        tag: A
        source: >
          Explicit zero: the nitride evaluator does not read the legacy
          proxy-Arrhenius retention fields (ret.mode='nitride_confinement'
          bypasses them entirely), so this is a no-op restatement of the
          RetentionBlock class default, set explicitly to document "no
          proxy Arrhenius override" rather than leaving it silently unset.
      ret.beta:
        value: 0.0
        unit: dimensionless
        tag: A
        source: "Same no-op restatement as ret.b0 above; the nitride evaluator never reads this legacy proxy-Arrhenius field."

      drive.mode:
        value: EL-transport
        unit: enum
        tag: A
        source: "Required opt-in for the nitride evaluator (device.py _evaluate_nitride guard)."
      drive.diode.preset:
        value: nitride-planar
        unit: enum
        tag: A
        source: "Required opt-in diode preset (fsim_core.nitride_transport.planar_pin -> NitrideDiode); device.py rejects any other preset for platform='ingan_gan_planar'."
      drive.diode.tau_pulse_ns:
        value: 0.1
        unit: ns
        tag: A
        source: >
          [A] 100 ps electrical pump pulse, a design choice matching the
          RT-edge tier's own 100 ps convention (docs/rt_edge_contract.md;
          cards/edge-inp-gainp-design.yaml drive.diode.tau_pulse_ns); no
          InGaN/GaN electrical pulse-width measurement is in the digest.
      drive.diode.N_A:
        value: 1.0e+17
        unit: "cm^-3"
        tag: V
        source: >
          Zhang et al., Appl. Phys. Lett. 108, 153102 (2016), p.2, Fig. 2
          caption: p-GaN acceptor doping of their own planar InGaN/GaN
          site-controlled diode, reused unmodified. Zhang 2016's device is
          itself planar (unlike Deshpande's nanowire), so this transfer is
          [V] source / [E] transfer from their QW active region to this
          design's dot-in-reservoir transport model.
        anchor_id: zhang2016-doping-na
        transfer_notes: "[V Zhang 2016 source, E planar transfer]."
      drive.diode.N_D:
        value: 1.0e+18
        unit: "cm^-3"
        tag: V
        source: "Zhang et al., Appl. Phys. Lett. 108, 153102 (2016), p.2, Fig. 2 caption: n-GaN donor doping, reused unmodified. Same transfer basis as drive.diode.N_A."
        anchor_id: zhang2016-doping-nd
        transfer_notes: "[V Zhang 2016 source, E planar transfer]."
      drive.diode.d_i_nm:
        value: 27.0
        unit: nm
        tag: A
        source: >
          [A] Intrinsic-region thickness, kept as drive.diode.
          wl_thickness_nm (3.0 nm) + 2 x 12 nm Zhang-2016-adapted spacers =
          27.0 nm (same adapted-geometry construction as the c-plane
          parent card cards/nitride-cavity-pulse-design.yaml's 24.5 nm,
          rebuilt from THIS card's own 3.0 nm reservoir instead of its
          0.5 nm). device.py's own QW-card guard also requires
          drive.diode.d_i_nm >= nitride.dot.height_nm (27.0 >= 3.5); an
          adapted-geometry assumption, not a transcribed Zhang 2016 d_i
          value.
      drive.diode.d_active_nm:
        value: 3.5
        unit: nm
        tag: A
        source: >
          [A] SRH active-region thickness, set equal to nitride.dot.
          height_nm (3.5 nm) so the diode's own active recombination
          volume spans the same QW-fluctuation dot column height as the
          confinement solver, rather than the c-plane parent card's
          implicit fsim_core.nitride_transport.NitrideDiode class default
          (3.0 nm, left unset there -- see
          design.provenance.diode_unset_defaults on the c-plane parent).
      drive.diode.x_in:
        value: 0.25
        unit: dimensionless
        tag: A
        source: >
          Set equal to nitride.dot.x_in (0.25) per this contract's rule
          that the transport diode's active composition must stay
          consistent with the confinement dot's own reservoir composition;
          see dot.delta_xx/nitride.dot.x_in for the underlying [V]/[E]
          transfer of 0.25 itself (Deshpande et al. 2013). device.py's own
          QW-card guard requires drive.diode.x_in == nitride.dot.x_in
          exactly for geometry_type=qw_fluctuation.
      drive.diode.wl_thickness_nm:
        value: 3.0
        unit: nm
        tag: A
        source: >
          [A] Set to 3.0 nm, EQUAL to nitride.dot.wl_thickness_nm (the
          local QW-thickness-fluctuation width "w"), per
          docs/nitride_geometry_stark_contract.md "QW-fluctuation pair":
          the transport diode's SRH reservoir thickness must stay
          consistent with the confinement dot's own surrounding well for
          QW-type cards, closing the reservoir-vs-diode disagreement the
          isolated-dot c-plane cards carry (their nitride.dot.
          wl_thickness_nm=0 vs. drive.diode.wl_thickness_nm=0.5 nm
          mismatch, documented in device.py's
          _nitride_reservoir_energy_eV docstring). device.py's own QW-card
          guard (_evaluate_nitride) requires drive.diode.wl_thickness_nm
          == nitride.dot.wl_thickness_nm exactly for geometry_type=
          qw_fluctuation, and rejects any nitride.background.
          reservoir_energy_eV override on this card class.
      drive.finite_pulse:
        value: true
        unit: bool
        tag: A
        source: "Required opt-in for the nitride evaluator (device.py _evaluate_nitride guard: platform='ingan_gan_planar' requires finite_pulse=True and empty mechanism)."
      drive.cycle_loading:
        value: rectangular
        unit: enum
        tag: A
        source: >
          Rectangular finite-electrical-pulse loading (fsim_core.
          pulse_counting.pulse_g2), the non-SET headline loading regime;
          contrasts with cards/nitride-qw-fluctuation-set-design.yaml's
          deterministic_pair.
      drive.rep_rate_hz:
        value: 8.0e+7
        unit: Hz
        tag: A
        source: >
          [A] 80 MHz repetition rate, matching the RT-edge tier's own
          headline convention (docs/rt_edge_contract.md; cards/
          edge-inp-gainp-design.yaml). Gives a 12.5 ns full pulse period
          (drive.gate_ns=null resolves to this whole period, not the 100 ps
          pump pulse). No InGaN/GaN electrical repetition-rate measurement
          is in the digest at this rate (Deshpande 2014's own 200 MHz MAXIMUM
          rate is used only on the separate comparison card, never here --
          see deshpande2014-max-rep-rate).
      drive.duty:
        value: 0.008
        unit: dimensionless
        tag: A
        source: >
          [A] Informational restatement of tau_pulse_ns*rep_rate_hz*1e-9 =
          0.1e-9*8e7 = 0.008 (matching the module's own worked-example
          comment, fsim_core/device.py _evaluate_nitride: "spec worked
          example: 0.1 ns @ 8e7 Hz -> 0.008"). NOT independently consumed
          by _evaluate_nitride: the actual pulse duty cycle used inside the
          nitride evaluator is always recomputed from drive.diode.
          tau_pulse_ns and drive.rep_rate_hz (a local variable shadows this
          DriveBlock field); this leaf documents the resolved value for
          card readers rather than driving any calculation itself.
      drive.gate_ns:
        value: null
        unit: ns
        tag: A
        source: >
          [A] Not requested: resolves to the whole 12.5 ns pulse period
          (device.py DriveBlock.gate_ns docstring), the RT-edge tier's own
          convention for an unrequested gate (cards/edge-inp-gainp-design.
          yaml drive.gate_ns).
      drive.I_uA:
        value: 0.02
        unit: uA
        tag: A
        source: >
          [A] Simulator-derived operating current, a project design choice
          (no InGaN/GaN electrical single-dot drive-current measurement
          matching this geometry exists in the digest); the headline sweep
          grid's current_uA axis (design.provenance.ranges) brackets this
          value with 0.002 and 0.2 uA.
      drive.cw:
        value: false
        unit: bool
        tag: A
        source: >
          [A] No CW diagnostics requested on the headline cards (unlike
          the RT-edge InP cards, which opt into drive.cw=true); this
          contract's acceptance gates are pulsed-only (docs/
          nitride_cavity_contract.md "Acceptance gates"; absent optical
          pumping is checked mechanically by verify_nitride_cards.py).
      drive.b_res:
        value: 0.1
        unit: dimensionless
        tag: A
        source: >
          [A] Residual background channel (background photons per
          collected X photon, T-independent); no InGaN/GaN-specific
          residual-background measurement exists in the digest (unlike the
          RT-edge tier's own Reischle-2008-derived 80 K InP electrical
          anchor, docs/rt_edge_contract.md, which is off-platform for this
          material system and not transferred here). 0.1 is a round,
          explicitly-stated design assumption.
        note: "See design.provenance.ranges['drive.b_res'] for the one-at-a-time sensitivity axis [0, 0.1, 1]."

      thermal.T_hs:
        value: 300.0
        unit: K
        tag: A
        source: >
          [A] Room-temperature heatsink default; the headline sweep grid's
          T_hs axis (design.provenance.ranges) covers the full TEC-cooled
          non-cryogenic range 230-300 K (docs/rt_edge_contract.md
          "Acceptance gates" convention, reused here). T_j is solved
          self-consistently from the drive power, not pinned to T_hs.
      thermal.mesa_diameter_um:
        value: 20.0
        unit: um
        tag: A
        source: >
          [A] Heat-source/contact mesa diameter for the thermal-spreading
          calculation (fsim_core.device._stack/t_junction), deliberately
          larger than the 0.05 um lithographic single-dot OPTICAL aperture
          (aperture.diameter_um) and independent of the NitrideDiode's own
          0.785 um^2 default ELECTRICAL injection area (drive.diode.
          area_um2, left unset -- see design.provenance.diode_unset_defaults):
          a generic small-contact-mesa class value, not independently
          sourced in the digest.
      thermal.layers.0.name:
        value: "GaN epi film"
        unit: string
        tag: A
        source: "Planar GaN-on-Si epitaxial film, the platform's own growth substrate family (../_goal/nitride_digests.md Sec. 9, Tamariz et al. 2020: NH3-MBE GaN QDs on AlN/Si(111))."
      thermal.layers.0.t_um:
        value: 2.0
        unit: um
        tag: A
        source: "[A] Generic epi-film thickness class value; not independently sourced (no GaN epi thickness for a vertical-cavity device is reported in the digest)."
      thermal.layers.0.k300:
        value: 130.0
        unit: "W/(m*K)"
        tag: A
        source: >
          [A] No GaN thermal-conductivity value is present in
          ../_goal/nitride_digests.md; 130 W/(m*K) is a generic
          crystalline-semiconductor-class assumption (order of magnitude of
          commonly cited bulk-GaN room-temperature values), NOT digest-
          sourced, and explicitly NOT the legacy GaAs class fallback
          (device.py ThermalBlock.substrate default) this contract
          forbids using unlabelled.
      thermal.layers.0.alpha:
        value: 0.5
        unit: dimensionless
        tag: A
        source: "[A] k(T) power-law exponent; matches the module's own legacy layer-class default (device.py ThermalBlock.layers), not independently sourced for GaN in the digest."
      thermal.layers.0.spread:
        value: false
        unit: bool
        tag: A
        source: "[A] Planar heat flow through this layer, no current-spreading correction (fsim_core.thermal.Layer convention)."
      thermal.layers.1.name:
        value: "dielectric DBR + contact stack (effective)"
        unit: string
        tag: A
        source: >
          Lumped effective layer for the dielectric DBR (nitride.cavity)
          plus metal contact stack, whose real thermal resistance is not
          separately modelled by this piece's simple film stack.
      thermal.layers.1.t_um:
        value: 1.0
        unit: um
        tag: A
        source: "[A] Generic effective thickness; not independently sourced."
      thermal.layers.1.k300:
        value: 2.0
        unit: "W/(m*K)"
        tag: A
        source: >
          [A] Deliberately low effective conductivity representing the
          combined dielectric-DBR/contact thermal bottleneck; an UNKNOWN
          package thermal resistance, explicitly tagged [A] per this
          contract's rule ("never label an unknown package thermal
          resistance verified") -- not a measured or class-sourced value.
      thermal.layers.1.alpha:
        value: 0.0
        unit: dimensionless
        tag: A
        source: "[A] No assumed temperature dependence for this lumped effective layer (a deliberately simple, conservative choice)."
      thermal.layers.1.spread:
        value: false
        unit: bool
        tag: A
        source: "[A] Planar heat flow through this effective layer."
      thermal.substrate.name:
        value: Si
        unit: string
        tag: A
        source: "Si growth substrate, matching the platform's own growth family (../_goal/nitride_digests.md Sec. 9, Tamariz et al. 2020, GaN QDs on Si(111))."
      thermal.substrate.k300:
        value: 150.0
        unit: "W/(m*K)"
        tag: A
        source: >
          [A] No substrate thermal-conductivity value is present in
          ../_goal/nitride_digests.md; 150 W/(m*K) is a generic bulk-Si
          class assumption near room temperature, NOT digest-sourced, and
          explicitly NOT the legacy GaAs class fallback (device.py
          ThermalBlock.substrate default k300=55.0) this contract forbids
          using unlabelled.
      thermal.substrate.alpha:
        value: 1.3
        unit: dimensionless
        tag: A
        source: "[A] k(T) power-law exponent class value for Si; not independently sourced in the digest."

      cavity.enabled:
        value: true
        unit: bool
        tag: A
        source: "Required opt-in for the nitride evaluator (device.py _evaluate_nitride guard)."
      cavity.type:
        value: nitride_planar
        unit: enum
        tag: A
        source: "Required opt-in cavity type for the nitride evaluator; legacy cavity.F_P/G are deliberately left at their class defaults and rejected if overridden (device.py guard)."

      emission.type:
        value: vertical_cavity
        unit: enum
        tag: A
        source: "Required opt-in emission type for the nitride evaluator (device.py _evaluate_nitride guard); a planar vertical out-coupling geometry, not the RT-edge tier's ridge-waveguide edge emission."

      aperture.density_cm2:
        value: 1.0e+10
        unit: "cm^-2"
        tag: A
        source: >
          [A] Lithographic single-dot-isolation density target, together
          with aperture.diameter_um giving an expected dot count under this
          aperture of pi*(0.05/2 um)^2 * 1e-8 cm^2/um^2 * 1e10 cm^-2 =
          0.19635 [DR from these two A inputs]. Also supplies the transport
          dot density (drive.n_dot_cm2 is left unset/0, so
          fsim_core.device._evaluate_nitride falls back to this field).
        note: "See design.provenance.single_dot_selection for the worked dot-count number."
      aperture.diameter_um:
        value: 0.05
        unit: um
        tag: A
        source: >
          [A] Small lithographic aperture for single-dot current/optical
          selection, deliberately much smaller than the RT-edge tier's own
          0.4 um aperture (cards/edge-inp-gainp-design.yaml) and much
          smaller than thermal.mesa_diameter_um (20 um, the separate
          thermal/contact footprint) -- see design.provenance.
          single_dot_selection.

      nitride.dot.height_nm:
        value: 3.5
        unit: nm
        tag: A
        source: >
          [A] QW-fluctuation dot COLUMN height design choice, deliberately
          distinct from the isolated-dot c-plane parent card's 3.0 nm
          (cards/nitride-cavity-pulse-design.yaml): 3.5 nm leaves room for
          a 3.0 nm local thickness fluctuation (nitride.dot.
          wl_thickness_nm) inside a still-thin QW while satisfying
          nitride_levels._validate's "0 < wl_thickness_nm < height_nm"
          requirement for geometry_type=qw_fluctuation. Not transcribed
          from any single paper; the digest's InGaN c-plane class range
          (Deshpande 2013: 2 nm nanowire dot-in-wire; Wang et al. a-plane:
          ~7 nm; Stachurski 2022 GaN/AlN: 1-3 nm) brackets this value.
        note: "See docs/nitride_geometry_stark_contract.md 'Frozen geometry grid' for the piece-6 sweep axis this feeds; this card's own value (3.5 nm) is the fixed QW-pair reference."
      nitride.dot.radius_nm:
        value: 20.0
        unit: nm
        tag: A
        source: >
          [A] QW-fluctuation dot radius design choice, deliberately larger
          than the isolated-dot c-plane parent card's 10.0 nm (cards/
          nitride-cavity-pulse-design.yaml): a wide, thin dot is the
          defining QW-fluctuation geometry (spec: "wide and thin, with its
          surrounding well as the reservoir"), independent of the
          Deshpande 2013 nanowire transfer used on the separate
          comparison card cards/nitride-deshpande2014-comparison-design.
          yaml.
        note: "See docs/nitride_geometry_stark_contract.md 'Frozen geometry grid' for the piece-6 sweep axis this feeds; this card's own value (20.0 nm) is the fixed QW-pair reference."
      nitride.dot.x_in:
        value: 0.25
        unit: dimensionless
        tag: V
        source: "Deshpande et al., Nat. Commun. 4, 1675 (2013), p.2 (single-wire EDX); reused unmodified. Platform transfer (nanowire dot-in-wire to planar reservoir) is [E], not this composition figure."
        anchor_id: deshpande2013-x-in
        note: "See design.provenance.ranges['nitride.dot.x_in'] for the headline grid axis [0.15, 0.25, 0.40]."
      nitride.dot.wl_thickness_nm:
        value: 3.0
        unit: nm
        tag: A
        source: >
          [A] Local QW-thickness-fluctuation width "w" (spec: "w=3 nm"),
          the geometric feature this card class opts INTO: NitrideDotSystem
          .geometry_type='qw_fluctuation' requires nitride_levels._qw_levels
          (fsim_core/nitride_levels.py, commit 57ab49d), which solves this
          card's dot COLUMN (height_nm=3.5 nm) against a surrounding
          vertical reservoir of the SAME composition at wl_thickness_nm=
          3.0 nm thickness, then confines carriers laterally through the
          resulting subband-energy difference (de_lat/dh_lat in
          _qw_levels), never through a composition or barrier-height
          change. Deliberately distinct from the isolated-dot c-plane
          parent card's 0.0 nm (nitride_levels has no wetting-layer
          continuum model for geometry_type='isolated_dot' and rejects a
          nonzero value there as unsupported); the diode's own
          drive.diode.wl_thickness_nm is set EQUAL to this leaf (3.0 nm)
          per device.py's QW-card consistency guard, closing the
          reservoir-vs-diode mismatch the isolated-dot cards carry.
      nitride.dot.geometry_type:
        value: qw_fluctuation
        unit: enum
        tag: A
        source: >
          [A] Opts into the same-composition QW-thickness-fluctuation
          confinement model (fsim_core.nitride_levels._qw_levels), the ONE
          structural change (together with shape/height_nm/radius_nm/
          wl_thickness_nm and the matched drive.diode fields) from the
          isolated-dot c-plane parent card cards/nitride-cavity-pulse-
          design.yaml (geometry_type left at its class default
          'isolated_dot' there). nitride_levels._validate requires
          shape='disc' and 0 < wl_thickness_nm < height_nm for this
          geometry_type; both are satisfied by this card's own leaves.
      nitride.dot.shape:
        value: disc
        unit: enum
        tag: A
        source: >
          [A] Explicit restatement of nitride_levels.NitrideDotSystem's
          own class default ('disc'), the ONLY shape geometry_type=
          qw_fluctuation supports (nitride_levels._validate: "qw_fluctuation
          requires disc shape and no shape_height_fraction"); recorded
          explicitly per this contract's rule that a resolved default is
          documented rather than left silently implicit.
      nitride.dot.strain_fraction:
        value: 1.0
        unit: dimensionless
        tag: A
        source: "[A] Full (unrelaxed) strain assumed, the conservative planar default (fsim_core.nitride_levels.NitrideDotSystem class default)."
        note: "See design.provenance.ranges['nitride.dot.strain_fraction'] for the one-at-a-time sensitivity axis [0.5, 1]."
      nitride.dot.screening_fraction:
        value: 0.0
        unit: dimensionless
        tag: A
        source: >
          [A] Unscreened polarization field default: 0 (no free-carrier
          screening assumed), distinct from the verify_nitride_device.py
          test fixture's own 0.98 (near-fully-screened) value -- this
          headline card makes the conservative, unscreened design choice
          explicitly.
        note: "See design.provenance.ranges['nitride.dot.screening_fraction'] for the one-at-a-time sensitivity axis [0, 0.5, 1]."
      nitride.dot.external_field_kVcm:
        value: 0.0
        unit: kV/cm
        tag: A
        source: >
          [A] No additional imposed field beyond the diode's own
          self-consistently solved, signed forward-bias field (device.py
          _evaluate_nitride adds -V_j/d_i as a separate term on top of this
          card's own unbiased NitrideDotSystem field at evaluation time);
          this leaf is the card's baseline (V=0) system definition only.
      nitride.dot.vbo_InN_GaN_eV:
        value: 1.15
        unit: eV
        tag: V
        source: "Tsai & Bayram, ACS Omega 5, 3917 (2020), Table 2, text p.3 (HSE06 InN/GaN valence-band offset). Reused unmodified; a further alloy-interpolation transfer inside nitride_levels.py (out of scope) is [A]."
        anchor_id: tsai2020-inn-gan-vbo
      nitride.dot.strain_c_fraction:
        value: 0.7
        unit: dimensionless
        tag: A
        source: "[A] Fraction of the biaxial strain resolved along c; matches fsim_core.nitride_levels.NitrideDotSystem's own class default, restated explicitly per this contract's rule."

      nitride.cavity.Q:
        value: 2000.0
        unit: dimensionless
        tag: A
        source: >
          [A] Assumed dielectric-DBR cavity Q. The published InGaN-QD
          cavity ceiling is much lower (Taylor et al. 2010: Q=167 best
          spot, up to 260 across the published nitride-cavity literature
          summarized in ../_goal/nitride_digests.md Sec. 5/10d) -- 2000 is
          an explicit, above-measured-ceiling design assumption, flagged in
          docs/nitride_cavity_contract.md "Known limitations", not
          presented as demonstrated.
        anchor_id: taylor2010-cavity-q
        note: "See design.provenance.ranges['nitride.cavity.Q'] for the headline grid axis [500, 2000, 10000]; nitride-sweep-results.md also runs a Q=167, purcell_enabled=false observed-ceiling reference."
      nitride.cavity.mode_volume_norm:
        value: 2.0
        unit: "V/(lambda/n)^3"
        tag: A
        source: "[A] Normalized mode volume; not reported for any InGaN-QD cavity in the digest (../_goal/nitride_digests.md Sec. 5: 'Mode volume was not reported in any of these papers -- [E]'). Matches fsim_core.nitride_cavity.NitrideCavityParams' own class default."
        note: "See design.provenance.ranges['nitride.cavity.mode_volume_norm'] for the one-at-a-time sensitivity axis [1, 2, 10]."
      nitride.cavity.spatial_overlap:
        value: 1.0
        unit: dimensionless
        tag: A
        source: "[A] Ideal (unity) spatial mode overlap; matches fsim_core.nitride_cavity.NitrideCavityParams' own class default."
      nitride.cavity.eta_out:
        value: 0.1
        unit: dimensionless
        tag: A
        source: "[A] Out-coupling efficiency class value; matches fsim_core.nitride_cavity.NitrideCavityParams' own class default, restated explicitly."
        note: "See design.provenance.ranges['nitride.cavity.eta_out'] for the one-at-a-time sensitivity axis [0.01, 0.1, 0.5]."
      nitride.cavity.T_track:
        value: 300.0
        unit: K
        tag: A
        source: "[A] Cavity-tracking reference temperature, fixed at 300 K across the full T_hs sweep (nitride-sweep-results.md: 'Fixed cavity T_track=300 K across T_hs')."
      nitride.cavity.dEdT_cav_meV_K:
        value: -0.04
        unit: meV/K
        tag: A
        source: "[A] Cavity-mode thermo-optic walk; matches fsim_core.nitride_cavity.NitrideCavityParams' own class default (also the legacy CavityBlock.dEdT_cav value), restated explicitly. No InGaN/GaN cavity thermo-optic measurement is in the digest."
      nitride.cavity.detuning_offset_meV:
        value: 0.0
        unit: meV
        tag: A
        source: "[A] Zero design detuning at T_track; matches the class default."
        note: "See design.provenance.ranges['nitride.cavity.detuning_offset_meV'] for the one-at-a-time sensitivity axis [0, +10] meV."
      nitride.cavity.purcell_enabled:
        value: true
        unit: bool
        tag: A
        source: >
          [A] Purcell enhancement enabled. Taylor et al. 2010 (../_goal/
          nitride_digests.md Sec. 5a) explicitly report NO observed Purcell
          effect at their much lower measured Q~50-170 -- flagged in
          docs/nitride_cavity_contract.md "Known limitations" as an
          assumption this paper does not support at this card's own,
          higher, assumed Q.
        anchor_id: taylor2010-no-purcell-observed
        note: "See design.provenance.ranges['nitride.cavity.purcell_enabled'] for the one-at-a-time sensitivity axis [false, true]."

      nitride.tau_rad0_ns:
        value: 1.0
        unit: ns
        tag: A
        source: >
          [A] Field-free radiative lifetime default, deliberately distinct
          from Deshpande et al., Appl. Phys. Lett. 105, 141109 (2014),
          abstract, 300 K measured recombination lifetime 1.3 +/- 0.3 ns
          (deshpande2014-lifetime) -- NOT a transferred measured
          field-suppressed lifetime; fsim_core/nitride_levels.py's own
          module default TAU_RAD0_DEFAULT_NS=1.3 ns already carries that
          citation, and this card explicitly chooses a different, simpler
          1.0 ns field-free assumption instead of inheriting it silently.
        note: "See design.provenance.ranges['nitride.tau_rad0_ns'] for the one-at-a-time sensitivity axis [0.2, 1, 4] ns."
      nitride.k_nr_ns:
        value: 0.0
        unit: "ns^-1"
        tag: A
        source: "[A optimistic] Zero non-radiative decay rate; an explicit, optimistic best-case assumption, not a measured InGaN non-radiative rate (none is in the digest at this platform/temperature)."
        note: "See design.provenance.ranges['nitride.k_nr_ns'] for the one-at-a-time sensitivity axis [0, 1] ns^-1."
      nitride.background_tau_ns:
        value: 0.0
        unit: ns
        tag: A
        source: "[A optimistic] No background afterglow past the pump pulse; an explicit, optimistic best-case assumption."
        note: "See design.provenance.ranges['nitride.background_tau_ns'] for the one-at-a-time sensitivity axis [0, 1] ns."
      nitride.eta_background:
        value: 0.1
        unit: dimensionless
        tag: A
        source: "[A] Background collection/acceptance efficiency; a round, explicitly-stated design assumption, not digest-sourced."
        note: "See design.provenance.ranges['nitride.eta_background'] for the one-at-a-time sensitivity axis (not itself swept by nitride-sweep-results.md; recorded here as an explicit input)."

    filter_unset_defaults: >
      filter is left entirely at FilterBlock class defaults (enabled=true,
      auto_w=true [A] -- the collection window equals the anchored
      linewidth Gamma(T_j), the F-series operating convention -- w=2.0 meV
      unused while auto_w=true, dx=0.0 meV [A] no filter offset, track=
      "mode" and track_material="" both inert here (no legacy Varshni
      tracking is exercised by the nitride evaluator), hold_window=false).
      Recorded here per this contract's rule that a resolved default is
      documented rather than left silently implicit.

    diode_unset_defaults: >
      NitrideDiode fields left unset on this card (fsim_core.
      nitride_transport.NitrideDiode class defaults apply, resolved here
      per this contract's rule that a factory default not exposed as an
      accepted card override is still recorded): d_active_nm (module default 3.0 nm; OVERRIDDEN on this card to 3.5 nm, see provenance.sources drive.diode.d_active_nm) [A],
      area_um2=0.785 um^2 [A] (this NitrideDiode injection area is
      independent of aperture.diameter_um=0.05 um and of thermal.
      mesa_diameter_um=20 um -- fsim_core.device._evaluate_nitride does not
      resolve it from either, unlike the legacy EL-transport diode path's
      _diode_from_drive; a pre-existing module behaviour, not a defect
      introduced by this card), R_s_ohm=100.0 ohm [A], n_ideality=2.0 [A],
      tau_SRH_ns=1.0 ns [A], tau_cap0_ps=10.0 ps [A], tau_matrix_ns=1.0 ns
      [A], eps_r=10.28 [E] (matches Strak et al., arXiv:2407.01134 (2024),
      Table 3, p.38 static GaN dielectric constant 10.28, not independently
      re-cited as a ledger anchor here), f_Rs_local=0.3 [E]. None of these
      are overridden by this card; they are the module's own class
      defaults, restated here for transparency rather than left implicit.

    background_model_defaults: >
      fsim_core.nitride_transport.evaluate_injection's eta_rad_matrix
      (default 0.1 [A]) and E_urbach_meV (default None, module resolves
      its own class value [E]) and eta_total (default 0.01 [A]) are NOT
      forwarded from any card field by fsim_core.device._evaluate_nitride
      (its own call site does not pass them through) -- they are resolved
      module defaults, not accepted nitride card overrides. Recorded here
      per this contract's instruction to record resolved default values in
      provenance rather than inventing a new YAML field to expose them.

