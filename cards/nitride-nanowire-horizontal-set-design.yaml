meta:
  name: nitride-nanowire-horizontal-set-design
  role: device-design
  device: "As-built horizontal In0.40Ga0.60N/GaN nanowire dot-in-wire diode (Deshpande et al. 2013/2014 geometry family), independent prediction, not a fit."
  source: "docs/nitride_nanowire_contract.md (piece 8 card schema); .workers/briefs/nitride-nanowire.md (User answers 1-4)"
  note: "Gated headline card, class=headline, platform=ingan_gan_nanowire, family=horizontal_as_built. Regime: idealized one-pair-per-cycle deterministic loading (SET), plus the Coulomb-blockade and resonant-tunnelling injector hardware screens (fsim_core.pulse_counting.deterministic_cycle_g2). Rewritten from the contract's own Card schema tables (not copied from any planar card); the planar comparison card cards/nitride-deshpande2014-comparison-design.yaml is untouched and remains the separate, non-gating planar reference. Independent prediction (design brief User answer 2): not fitted to the 2013/2014 held-out lifetime/g2 anchors."

design:
  name: nitride-nanowire-horizontal-set-design
  platform: ingan_gan_nanowire

  dot:
    linewidth: anchored
    lineshape: lorentzian
    gamma300: 35.0

  ret:
    mode: nitride_confinement
    tau_cap_scales_with_density: false

  drive:
    mode: EL-transport
    diode:
      preset: nitride-nanowire
      tau_pulse_ns: 0.1
      conducting_radius_nm: 12.5
      N_A: 5.0e+17
      N_D: 3.0e+18
      n_ideality: 2.0
      tau_SRH_ns: 0.01
      eps_r: 10.28
      T: 300.0
      tau_matrix_ns: 1.0
    cycle_loading: deterministic_pair
    rep_rate_hz: 2.0e+8
    duty: 0.02
    gate_ns: null
    I_uA: 2.0e-3
    cw: false
    b_res: 0.1
    eta_load: 1.0
    set_params: {R_T_ohm: 1.0e+6, eps_r: 9.5, ec_margin: 10.0, radius_nm: 12.5}

  thermal:
    T_hs: 300.0

  cavity:
    enabled: false

  filter:
    enabled: true
    auto_w: true
    auto_w_scale: 1.0
    w: 2.0
    dx: 0.0
    track: mode
    track_material: ""
    hold_window: false

  aperture: {}

  emission:
    type: nanowire

  nitride:
    nanowire:
      family: horizontal_as_built
      core_radius_nm: 12.5
      outer_radius_nm: 12.5
      strain_bound: relaxed
      shell: none
      barrier_left_nm: 15.0
      barrier_right_nm: 15.0
    dot:
      radius_nm: 12.5
      height_nm: 2.0
      x_in: 0.40
      strain_fraction: 0.0
      screening_fraction: 0.0
      external_field_kVcm: 0.0
      vbo_InN_GaN_eV: 1.15
      strain_c_fraction: 0.7
      k_intrinsic_ns: 0.0
    surface:
      S_cm_s: 1.0e+3
      shell: none
      shell_multiplier: 1.0
      reservoir_access: 1.0
      occupied_dot_access: 0.05
    photonics:
      family: horizontal_as_built
      NA: 0.5
      n_wire: null
      n_group_override: null
      n_ambient: 1.0
      n_oxide: null
      oxide_thickness_nm: 100.0
      n_substrate: null
      dipole_weights: [0.3333333333333333, 0.3333333333333333, 0.3333333333333333]
      emitter_height_nm: null
      collection_scale: 1.0
      radiative_rate_factor: 1.0
      beta_scale: 1.0
      taper_transmission: 1.0
      bottom_reflectivity: 0.0
      top_contact_transmission: 1.0
      propagation_transmission: 1.0
      unguided_collection_scale: 0.0
      taper_output_mfr_nm: null
    wire_thermal:
      R_s_ohm: 2.38e+9
      Rth_K_W: 1.0e+9
      f_Rs_local: 1.0
      eta_total: 0.01
      C_parasitic_F: 0.0
    injector:
      al_fraction: 0.30
      electron_topology: double_barrier
      hole_topology: double_barrier
      electron_barrier_thickness_nm: 2.0
      hole_barrier_thickness_nm: 2.0
      electron_well_width_nm: 4.0
      hole_well_width_nm: 4.0
      growth_step_nm: 0.2593
      growth_tolerance_steps: 1.0
      me_barrier_override: null
      mh_barrier_override: null
      dEc_eV_override: null
      dEv_eV_override: null
      me_well: 0.209
      mh_well: 1.88
      delta_Ev_GaN_AlN_eV: 0.70
      n_cm3: 3.0e+18
      p_cm3: 5.0e+17
      alignment_uncertainty_meV: 15.0
      degeneracy: 2.0
      reservoir_state_count_e: 1.0
      reservoir_state_count_h: 1.0
      mg_acceptor_energy_meV: 170.0
      include_polarization: true
      bypass_prefactor: 1.0
      polarity: Ga
      field_leverarm: 1.0
      slice_length_nm: 0.2
      min_slices_per_segment: 8
      alignment_tunable: false
      bias_tuning_range_meV: 0.0
      occupancy_control_known: false
      second_pair_control_known: false
    tau_rad0_ns: 1.0
    tau_cap_ps: 10.0

  provenance:
    card_id: nitride-nanowire-horizontal-set-design
    class: headline
    platform: ingan_gan_nanowire
    family: horizontal_as_built
    cycle_loading: deterministic_pair
    strain_bound: relaxed

    sources:
      platform:
        value: ingan_gan_nanowire
        unit: enum
        tag: A
        source: "Opt-in nanowire evaluator dispatch (fsim_core/device.py evaluate(): platform=ingan_gan_nanowire dispatches to nitride_nanowire_device.evaluate_nanowire)."
      dot.linewidth:
        value: anchored
        unit: enum
        tag: A
        source: "Required opt-in for the nanowire evaluator (nitride_nanowire_device._validate)."
      dot.lineshape:
        value: lorentzian
        unit: enum
        tag: A
        source: "Required opt-in for the nanowire evaluator (nitride_nanowire_device._validate)."
      dot.gamma300:
        value: 35.0
        unit: meV
        tag: A
        source: "Reservoir injection linewidth (evaluate_injection's w_meV) and, when filter.auto_w=true, the spectral filter window; no InGaN nanowire single-dot 300 K linewidth measurement exists in the digest. Design choice, not fit to any anchor. Other DotBlock leaves (delta_xx, gamma_scale, r_xx, gamma0, a_ac, E_LO, phonon) stay at their class (InP) defaults: not consumed by the nanowire evaluator, which reads only linewidth/lineshape/gamma300."
      ret.mode:
        value: nitride_confinement
        unit: enum
        tag: A
        source: "Required opt-in for the nanowire evaluator (nitride_nanowire_device._validate)."
      ret.tau_cap_scales_with_density:
        value: false
        unit: bool
        tag: A
        source: "Required false for the nanowire evaluator (_validate rejects true). All other RetentionBlock leaves (a_esc, E_a, b_p, E_b, b0, beta, preset, system, tau_rad_ns, channel, overrides, n_dot_cm2, tau_cap_ps) stay at class defaults: not consumed (the nanowire capture/lifetime numbers come from nitride.tau_cap_ps and nitride.tau_rad0_ns instead)."
      cavity.enabled:
        value: false
        unit: bool
        tag: A
        source: "Contract: cavity.enabled is false for both nanowire families (no Q/DBR/cavity-Q axis on this platform)."
      emission.type:
        value: nanowire
        unit: enum
        tag: A
        source: "Required opt-in for the nanowire evaluator (_validate)."
      filter.enabled:
        value: true
        unit: bool
        tag: A
        source: "Genuine spectral FilterBlock transmission is applied on this platform (module docstring: no cavity out-coupling exists here, so the real spectral filter stands in for it), gated the same way the legacy path gates it."
      filter.auto_w:
        value: true
        unit: bool
        tag: A
        source: "F-series operating convention: the collection window equals the anchored linewidth Gamma(T_j) = dot.gamma300 * filter.auto_w_scale."
      filter.auto_w_scale:
        value: 1.0
        unit: dimensionless
        tag: A
        source: "No widening/narrowing of the auto_w collection window."
      filter.dx:
        value: 0.0
        unit: meV
        tag: A
        source: "No filter offset from the line center."
      filter.w:
        value: 2.0
        unit: meV
        tag: A
        source: "Class default; unused while filter.auto_w=true."
      filter.track:
        value: mode
        unit: enum
        tag: A
        source: "Class default; inert (no cavity mode exists on this platform for a slit to track)."
      filter.track_material:
        value: (empty)
        unit: enum
        tag: A
        source: "Class default; inert (the nanowire evaluator never reads this field)."
      filter.hold_window:
        value: false
        unit: bool
        tag: A
        source: "Class default; inert (no cavity-less Varshni-tracking chain is exercised here)."
      aperture:
        value: (empty, class defaults)
        unit: mapping
        tag: A
        source: "Nanowire cards forbid any non-default ApertureBlock leaf (_validate: 'nanowire forbids non-default planar drive.aperture options'); there is no aperture/mesa current-supply partition on this platform (the wire IS the current path)."
      thermal.T_hs:
        value: 300.0
        unit: K
        tag: V
        source: "Deshpande et al., Appl. Phys. Lett. 105, 141109 (2014), abstract: room temperature (300 K) measurement condition, reused as the heatsink target. T_j is solved self-consistently from the drive power via nitride.wire_thermal, not pinned to 300 K."
        anchor_id: deshpande2014_abstract
      thermal.mesa_diameter_um / thermal.layers / thermal.substrate:
        value: (class defaults)
        unit: mixed
        tag: A
        source: "Legacy planar ThermalBlock leaves; not consumed by the nanowire evaluator (device power/temperature come from nitride.wire_thermal, drive.diode and thermal.T_hs only -- see nitride_nanowire_device.py's own module docstring)."
      drive.mode:
        value: EL-transport
        unit: enum
        tag: A
        source: "Required opt-in for the nanowire evaluator (_validate)."
      drive.diode.preset:
        value: nitride-nanowire
        unit: enum
        tag: A
        source: "Required diode preset opt-in (_validate: drive.diode.preset must be 'nitride-nanowire')."
      drive.diode.tau_pulse_ns:
        value: 0.1
        unit: ns
        tag: A
        source: "Explicit 100 ps electrical pulse width design input (module docstring: 'the 0.1 ns electrical pulse [is a] card-level [A] design input, not a fit to Deshpande et al. (APL 2014)'); consumed as both the pump width (rectangular regime) and the SET loading_window_ns (deterministic_pair regime)."
      drive.diode.conducting_radius_nm:
        value: 12.5
        unit: nm
        tag: A
        source: "Equal to nitride.nanowire.core_radius_nm (contract DEVICE-PIECE CONSTRAINT 1: conducting_radius_nm in (0, core_radius_nm], never an optical radius alias); the whole conducting core carries current on both families."
      drive.diode.N_A:
        value: 5.0e+17
        unit: cm^-3
        tag: V
        source: "Deshpande et al., Nat. Commun. 4, 1675 (2013): p-GaN reservoir acceptor doping (Mg 5e17 cm^-3), reused unmodified (contract directive round H2)."
        anchor_id: deshpande2013_geometry
      drive.diode.N_D:
        value: 3.0e+18
        unit: cm^-3
        tag: V
        source: "Deshpande et al., Nat. Commun. 4, 1675 (2013): n-GaN reservoir donor doping (Si 3e18 cm^-3), reused unmodified (contract directive round H2)."
        anchor_id: deshpande2013_geometry
      drive.diode.n_ideality:
        value: 2.0
        unit: dimensionless
        tag: A
        source: "Diode ideality factor; no InGaN/GaN nanowire p-i-n ideality-factor measurement is in the digest. Class default."
      drive.diode.tau_SRH_ns:
        value: 0.01
        unit: ns
        tag: DR
        source: "Back-solved so the GaN-kernel dark current reproduces the inferred 2.6-3.1 V junction-voltage window at 1 nA/300 K (contract drive.diode table); not an independent SRH-lifetime measurement."
      drive.diode.eps_r:
        value: 10.28
        unit: dimensionless
        tag: E
        source: "GaN static relative permittivity class value (contract drive.diode table)."
      drive.diode.T:
        value: 300.0
        unit: K
        tag: A
        source: "Overridden every call by the device piece's own T_j from wire_operating_point (contract 'Composition rules for the device piece' bullet 3); not an independently swept card default."
      drive.diode.tau_matrix_ns:
        value: 1.0
        unit: ns
        tag: A
        source: "Class default matrix-element relaxation time (contract drive.diode table)."
      drive.cycle_loading:
        value: deterministic_pair
        unit: enum
        tag: A
        source: "Idealized one-pair-per-cycle deterministic loading (fsim_core.pulse_counting.deterministic_cycle_g2), pairing with the SET/RT injector hardware screens."
      drive.rep_rate_hz:
        value: 2.0e+8
        unit: Hz
        tag: V
        source: "Deshpande et al., Appl. Phys. Lett. 105, 141109 (2014), abstract: reported maximum excitation repetition rate (up to 200 MHz), reused unmodified as the headline rate; this does NOT verify the g2=0.29 measurement was itself taken at 200 MHz. The core sweep's own reduced axis also includes 80 MHz (a named 100 ps / 80 MHz operating row is recorded under provenance.ranges below)."
        anchor_id: deshpande2014_abstract
      drive.duty:
        value: 0.02
        unit: dimensionless
        tag: DR
        source: "Consumed DIRECTLY by the nanowire device (fsim_core/nitride_nanowire_device.py: duty = float(d.drive.duty), fed straight into wire_operating_point -- it is NOT recomputed from drive.diode.tau_pulse_ns/drive.rep_rate_hz there), so this leaf must itself equal tau_pulse_ns * 1e-9 * rep_rate_hz = 0.1e-9 * 2e8 = 0.02 (asserted by verify_nitride_nanowire_cards.py); a rep-rate sweep row (e.g. the named 100 ps / 80 MHz operating row below, duty=0.008=0.1e-9*8e7) must set this leaf to match its own rep_rate_hz, never leave this card's 0.02 unchanged."
      drive.gate_ns:
        value: null
        unit: ns
        tag: A
        source: "Not requested: resolves to the whole pulse period (device.py DriveBlock.gate_ns docstring)."
      drive.I_uA:
        value: 2.0e-3
        unit: uA
        tag: A
        source: "2 nA, the 2013 device's own reported maximum current (Deshpande et al., Nat. Commun. 4, 1675 (2013)); the 2 nA figure itself lives in the ledger's deshpande2013_thermal_and_pl entry (rise_2nA_K), not deshpande2013_geometry, which carries no current value at all. At the horizontal card's R_s_ohm=2.38 GOhm this keeps V_terminal inside the 2013 device's own reported 2-20 V terminal-voltage range (V_terminal ~8 V) -- that 2-20 V range is [E] from the paper as read by the project, not yet in the ledger as its own anchor entry -- unlike a 20 nA/0.02 uA choice which would imply ~50 V across this series resistance alone. Kept identical on the vertical card (drive.I_uA is not on the horizontal/vertical allow-list of intended differences): at the vertical card's much smaller designed-contact R_s_ohm=1e6 ohm the same current drops only ~0.002 V, so V_terminal there tracks the junction voltage V_j regardless."
        anchor_id: deshpande2013_thermal_and_pl
      drive.cw:
        value: false
        unit: bool
        tag: A
        source: "No CW g2(tau)/IRF diagnostics requested; this contract's acceptance gates are pulsed/deterministic-pair only."
      drive.b_res:
        value: 0.1
        unit: dimensionless
        tag: A
        source: "Residual background channel (background photons per collected X photon, T-independent); no InGaN/GaN nanowire residual-background measurement exists in the digest (design brief: b_res stays 0.1 nitride-wide, with a 0.02 sensitivity motivated by the 2013 corrected HBT g2 0.16, never a headline substitution)."
      drive.eta_load:
        value: 1.0
        unit: dimensionless
        tag: A
        source: "Nanowire cards forbid any other value (_validate): SET/pulse loading is modeled explicitly via pulse_counting, not via a separate scalar loading efficiency."
      drive.set_params.R_T_ohm:
        value: 1.0e+6
        unit: ohm
        tag: A
        source: "Tunnel-junction resistance for the Coulomb-blockade screen (unchanged SET convention, drive_mech.set_feasibility); computed for every row (both regimes) as a diagnostic, reported (set_feasible) only for the deterministic_pair regime."
      drive.set_params.eps_r:
        value: 9.5
        unit: dimensionless
        tag: E
        source: "III-N dielectric-constant assumption for the isolated-sphere Coulomb-charging formula (design brief User answer 3); matches deshpande2013_coulomb_reference's own eps_r."
        anchor_id: deshpande2013_coulomb_reference
      drive.set_params.ec_margin:
        value: 10.0
        unit: dimensionless
        tag: A
        source: "Charge-quantization margin (drive_mech.set_feasibility's own convention: E_C/kT must exceed this margin to pass the Coulomb screen)."
      drive.set_params.radius_nm:
        value: 12.5
        unit: nm
        tag: A
        source: "Equals nitride.dot.radius_nm (the disc radius), never nitride.nanowire.core_radius_nm directly (contract 'Composition rules for the device piece' bullet 1): defaulting to the core radius would silently substitute set_EC_over_kT's reference charging energy on the vertical family (E_C=1.5 meV at 100 nm core vs. the intended E_C=12.126 meV at 12.5 nm disc). Present on this SET card only; the pulse card's drive.set_params has no radius_nm leaf and relies on the device's own disc-radius default (which is identical), per the contract's SET-only framing of this leaf."
        anchor_id: deshpande2013_coulomb_reference
      nitride.nanowire.family:
        value: horizontal_as_built
        unit: enum
        tag: A
        source: "Required family selector."
      nitride.nanowire.core_radius_nm:
        value: 12.5
        unit: nm
        tag: V
        source: "Deshpande et al., Nat. Commun. 4, 1675 (2013): optical diameter 25 +/- 5 nm, half taken as the core/disc radius (contract: 'core_radius_nm (horizontal) ... V (2013 optical diameter/2)')."
        anchor_id: deshpande2013_geometry
      nitride.nanowire.outer_radius_nm:
        value: 12.5
        unit: nm
        tag: A
        source: "Equal to core_radius_nm: shell='none' requires outer_radius_nm == core_radius_nm (contract 'Family-specific interfaces')."
      nitride.nanowire.strain_bound:
        value: relaxed
        unit: enum
        tag: DR
        source: "Headline/upper strain scenario (design brief User answer 4): removes the piezoelectric strain-deformation shift and P_pz while retaining spontaneous polarization P_sp (Deshpande 2013's own <2 meV blueshift with current is read as near-absent piezo field in the wire). The unrelaxed/conservative partner is produced by the sweep script, never by this card."
      nitride.nanowire.shell:
        value: none
        unit: enum
        tag: A
        source: "Bare wire, no AlGaN shell (contract: shell is a sensitivity-only axis on the core grid, not a headline leaf)."
      nitride.nanowire.barrier_left_nm:
        value: 15.0
        unit: nm
        tag: V
        source: "Deshpande et al., Nat. Commun. 4, 1675 (2013): 15 nm i-GaN barrier each side of the disc."
        anchor_id: deshpande2013_geometry
      nitride.nanowire.barrier_right_nm:
        value: 15.0
        unit: nm
        tag: V
        source: "Deshpande et al., Nat. Commun. 4, 1675 (2013): 15 nm i-GaN barrier each side of the disc."
        anchor_id: deshpande2013_geometry
      nitride.dot.height_nm:
        value: 2.0
        unit: nm
        tag: V
        source: "Deshpande et al., Nat. Commun. 4, 1675 (2013): disc height 2.0 nm."
        anchor_id: deshpande2013_geometry
      nitride.dot.radius_nm:
        value: 12.5
        unit: nm
        tag: A
        source: "Equal to nitride.nanowire.core_radius_nm: for horizontal_as_built the disc fills the semiconductor core (pre-H6 convention, no separate dot-in-wire structure -- contract 'Family-specific interfaces' H6 correction)."
      nitride.dot.x_in:
        value: 0.40
        unit: dimensionless
        tag: V
        source: "Deshpande et al., Appl. Phys. Lett. 105, 141109 (2014), abstract: In0.40Ga0.60N dot composition, reused unmodified."
        anchor_id: deshpande2014_abstract
      nitride.dot.strain_fraction:
        value: 0.0
        unit: dimensionless
        tag: DR
        source: "Derived from strain_bound=relaxed (contract 'Single strain-bound switch': strain_fraction is display-only, validated 0.0 for relaxed, never itself passed to levels())."
      nitride.dot.screening_fraction:
        value: 0.0
        unit: dimensionless
        tag: A
        source: "Main-grid fixed value (design brief User answer 4: 'screening_fraction stays an independent axis at {0,1} on a reduced cut only')."
      nitride.dot.external_field_kVcm:
        value: 0.0
        unit: kV/cm
        tag: A
        source: "No additional externally applied field beyond the diode's own self-consistently solved depletion field (fed back by the device piece after the transport solve)."
      nitride.dot.vbo_InN_GaN_eV:
        value: 1.15
        unit: eV
        tag: V
        source: "Rinke et al., Phys. Rev. B 77, 075202 (2008): InN/GaN valence-band offset (contract Card schema default)."
      nitride.dot.strain_c_fraction:
        value: 0.7
        unit: dimensionless
        tag: DR
        source: "Fraction of the biaxial strain resolved along c; matches NitrideNanowireSystem's own class default (contract Card schema)."
      nitride.dot.k_intrinsic_ns:
        value: 0.0
        unit: ns^-1
        tag: A
        source: "Intrinsic occupied-dot non-radiative loss beyond surface/escape; NOT a contract Card-schema leaf (nitride_nanowire_device.py's own optional addendum, _ALLOWED_DOT_KEYS), explicit here at its neutral default (zero extra loss) rather than left silently implicit."
      nitride.surface.S_cm_s:
        value: 1.0e+3
        unit: cm/s
        tag: E
        source: "Secondary attribution: Deshpande 2013 p.1 cites its own ref. 35 for this GaN-nanowire surface-recombination-velocity number; ref. 35 has never been read by this project, so this is [E], not a direct Deshpande [V] measurement (contract 'Provenance corrections')."
        anchor_id: deshpande2013_surface_velocity
      nitride.surface.shell:
        value: none
        unit: enum
        tag: A
        source: "Matches nitride.nanowire.shell (identical across all four cards, per this round's binding card-content decision)."
      nitride.surface.shell_multiplier:
        value: 1.0
        unit: dimensionless
        tag: A
        source: "Unity multiplier for shell='none' (no passivation reduction); the AlGaN shell_multiplier=0.1 partner is a sensitivity-only cut, never substituted here (identical on all four cards, per this round's binding decision)."
      nitride.surface.reservoir_access:
        value: 1.0
        unit: dimensionless
        tag: A
        source: "Conservative full access (contract 'Composition rules for the device piece' bullet 8); identical on all four cards."
      nitride.surface.occupied_dot_access:
        value: 0.05
        unit: dimensionless
        tag: DR
        source: "Headline default (contract 'Provenance corrections'): DERIVED from the surface module's own J0 hard-wall ground-state overlap ratio in a 2 nm sidewall capture layer over the uniform-density value, at core_radius_nm=12.5 (fsim_core/nitride_nanowire_surface.py; physics coherence review finding M1) -- this is a derivation from the module's own geometry, not a transcribed measurement, so it cites NO lifetime anchor. The declared conservative [A] partner is 1.0 (recorded here, never removed, as the sweep's declared partner value; 0.1 is kept only as a third sensitivity point). Neither default is tuned to reproduce the held-out 0.71/1.1/1.3 ns lifetime anchors (deshpande2013_lifetimes), which this entry deliberately does not cite. Identical on all four cards, per this round's binding decision."
        anchor_id: null
      nitride.photonics.family:
        value: horizontal_as_built
        unit: enum
        tag: A
        source: "Mirrors nitride.nanowire.family (also re-set by the device piece itself at evaluation time)."
      nitride.photonics.NA:
        value: 0.5
        unit: dimensionless
        tag: A
        source: "Objective numerical aperture (Deshpande 2013 reports a 50x objective but not its NA -- contract 'Family-specific interfaces': 'NA=0.5 [A] and its collection scale are card leaves'). Horizontal-consumed; inert for vertical_photonic (no free-space objective collection on the designed guided-wave family)."
      nitride.photonics.n_wire:
        value: null
        unit: dimensionless
        tag: E
        source: "None: falls back to gan_ordinary_index(lambda_nm) (dispersion-tagged module default)."
      nitride.photonics.n_group_override:
        value: null
        unit: dimensionless
        tag: A
        source: "None: falls back to the GaN dispersion shape for the beta(V) group-index estimator. Vertical-consumed only."
      nitride.photonics.n_ambient:
        value: 1.0
        unit: dimensionless
        tag: A
        source: "Air ambient."
      nitride.photonics.n_oxide:
        value: null
        unit: dimensionless
        tag: V
        source: "None: falls back to sio2_index(lambda_nm) (Malitson 1965). Horizontal-consumed only (the 100 nm thermal SiO2 the 2013 wire is dispersed on)."
      nitride.photonics.oxide_thickness_nm:
        value: 100.0
        unit: nm
        tag: V
        source: "Deshpande et al., Nat. Commun. 4, 1675 (2013): 100 nm thermal SiO2 on (001) Si substrate. Horizontal-consumed only."
        anchor_id: deshpande2013_device_geometry
      nitride.photonics.n_substrate:
        value: null
        unit: dimensionless
        tag: E
        source: "None: falls back to a 2-point Si n,k anchor table. Horizontal-consumed only."
      nitride.photonics.dipole_weights:
