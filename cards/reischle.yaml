meta:
  name: reischle
  device: "InP/Ga0.51In0.49P QD p-i-n LED in low-Q AlGaAs DBR cavity, MOVPE on GaAs; ~20 um contact aperture"
  role: validation (V-c)
  source: "Reischle et al., Appl. Phys. Lett. 97, 143513 (2010); local PDF digitized 2026-07-21"
  note: >
    Pulsed electrical excitation, HBT autocorrelation. Dominant line assigned
    by the paper to a negatively charged exciton (trion): NO radiative cascade
    partner, so the filtered-cascade leakage is eps ~ 0 structurally and the
    F-series predicts g2 = 1 - rho^2. Sample temperatures are drive-heating
    estimates from the paper (50-Ohm termination), an in-the-wild DeltaT_J.
    Two sources: (i) APL 97, 143513 (2010), pulsed device at ~20-40 K
    (g2_vs_ERR + rho_spectral below); (ii) Opt. Express 16, 12771 (2008),
    the 80 K DC result (g2_oe2008 below) -- the paper itself applies the
    F2 background law (its Eq. 1) with a spectrally evaluated rho.

params:
  line_type:
    value: 0.0
    unit: "0=trion,1=neutral-X"
    tag: DR
    source: "paper Sec: dominant line 'most probably from a negatively charged exciton' -> eps ~ 0 (no cascade)"
  E_line:
    value: 1.8396
    unit: eV
    tag: DR
    source: "digitized Fig. 2(b) pulsed spectrum, Device 1 Pos. 2"
  T_device1:
    value: 40.0
    unit: K
    tag: DR
    source: "paper: sample ~40 K for Device 1 (heating via 50-Ohm termination at 4.5 V)"
  T_device2:
    value: 20.0
    unit: K
    tag: DR
    source: "paper: ~20 K for Device 2 (improved contacts, ~2 V operation)"
  V_dc:
    value: 4.5
    unit: V
    tag: DR
    source: "Device 1 pulsed-spectra/autocorrelation bias (4.65 V for the DC spectrum)"
  V_pp:
    value: 4.8
    unit: V
    tag: DR
    source: "pulse amplitude, 200 ps width for the 100/200 MHz runs"
  tau_decay:
    value: 500.0
    unit: ps
    tag: DR
    source: "QD decay time from TCPC (paper)"
  qd_density:
    value: 1.0e+10
    unit: cm^-2
    tag: DR
    source: "paper: high QD density ~1e10; discrete current paths excite few dots"

  # --- OE 16, 12771 (2008): the 80 K DC result (V-c(ii)) ---
  gamma_80K_oe:
    value: 0.8
    unit: meV
    tag: V
    source: "OE2008: peak-1 (neutral X) linewidth 0.8 meV at 80 K (QD C)"
  delta_xx_oe:
    range: [4.0, 6.0]
    unit: meV
    tag: DR
    source: "OE2008/ref 14: typical X-XX binding energy 4-6 meV in InP/GaInP dots"
  w_oe:
    range: [1.0, 3.0]
    unit: meV
    tag: E
    source: "APD window marked by vertical lines in OE2008 Fig. 3(c,d); narrow, few-meV class -- swept"

data:
  g2_vs_ERR:
    tag: V
    source: >
      Published g2(0) values: central-peak area vs Poisson level, red numbers
      in Fig. 3 (Device 1 Pos. 2) and Fig. 2 insets (200 MHz). No background
      correction applied by the authors. err for the 500 MHz multi-Lorentz
      point and the Fig. 2 insets not stated; 0.05 assumed [E].
    points:
      - {device: 1, position: 2, ERR_MHz: 100.0, pulse_ps: 200.0, g2: 0.37, err: 0.02}
      - {device: 1, position: 2, ERR_MHz: 200.0, pulse_ps: 200.0, g2: 0.53, err: 0.02}
      - {device: 1, position: 2, ERR_MHz: 500.0, pulse_ps: 150.0, g2: 0.49, err: 0.05}
      - {device: 1, position: 1, ERR_MHz: 200.0, pulse_ps: 200.0, g2: 0.24, err: 0.05}
      - {device: 2, position: 2, ERR_MHz: 200.0, pulse_ps: 200.0, g2: 0.34, err: 0.05}

  g2_oe2008:
    tag: V
    source: >
      Opt. Express 16, 12771 (2008), DC electrical excitation. g2_b: antibunching
      after IRF (500 ps) deconvolution, as published. rho: the paper's own
      spectral evaluation of S/(S+B) under the APD window. g2_corr: the paper's
      background-corrected value via its Eq. (1) -- which is algebraically the
      F-series F2 law g2 = 1 - rho^2(1 - g2_s) inverted.
    points:
      - {dot: "B", T: 4.0,  V_dc: 2.35, g2_raw: 0.41, g2_b: 0.15, err: 0.05, rho: 0.94, g2_corr: 0.04, counts_cps: 21500.0}
      - {dot: "C", T: 80.0, V_dc: 1.97, g2_raw: 0.43, g2_b: 0.25, err: 0.05, rho: 0.88, g2_corr: 0.03, counts_cps: 4600.0}

  rho_spectral:
    tag: DR
    source: >
      Signal fraction rho(w) = S/(S+B) for a window of full width w centered
      on the X- line, digitized from the Fig. 2(b) PULSED spectrum (same
      excitation as the g2 runs). rho_lo: background referenced to the frame
      bottom (max-background convention); rho_hi: referenced to the curve's
      own minimum (min-background). Linear-intensity axis assumed. The
      detection window of the HBT runs is NOT stated in the paper (slit-
      defined); w is therefore swept.
    points:
      - {w_meV: 1.0,  rho_lo: 0.901, rho_hi: 0.950}
      - {w_meV: 2.0,  rho_lo: 0.890, rho_hi: 0.944}
      - {w_meV: 3.0,  rho_lo: 0.873, rho_hi: 0.935}
      - {w_meV: 4.0,  rho_lo: 0.855, rho_hi: 0.925}
      - {w_meV: 5.0,  rho_lo: 0.834, rho_hi: 0.913}
      - {w_meV: 6.0,  rho_lo: 0.816, rho_hi: 0.902}
      - {w_meV: 8.0,  rho_lo: 0.780, rho_hi: 0.881}
      - {w_meV: 10.0, rho_lo: 0.745, rho_hi: 0.859}
