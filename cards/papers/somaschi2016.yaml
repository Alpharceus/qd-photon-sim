  - {date: 2026-11-04, by: "Sonnet 5.5 (coder) r4-redteam-fixes", reason: "r4 red-team item 8: setup.filter_applies_to g2_hom_brightness (brightness measured behind the etalon); SI 10 pm vs main-text 7 pm / 10 ueV discrepancy recorded in filter_fwhm_GHz (10 ueV kept)", note: "obtained: brightness_res 0.1305 -> 0.0552 [0.0547, 0.0558] vs 0.154 +/- 0.015, expect pass -> fail (nothing pre-registered); g2_raw 0.003119, M_raw 0.918 [0.854, 0.9996], M_corr 0.9238 [0.865, 0.9998] unchanged; eta_prep_pred 0.9361, tau_pred 121.3 pass. setup.zpl_filter left true (its where-text is the etalon quote and it agrees with the cascade at a 10 ueV filter)", change: "expect pass -> fail (brightness_res)"}
