# Somaschi et al., Nat. Photonics 10, 340 (2016): electrically tuned InGaAs dot in a micropillar, strictly resonant 15 ps pulses.
# Numbers from .workers/devlib/papers/somaschi2016.yaml (arXiv main text read; supplement pages are images, NOT read).
# ONE device: resonant QD3 (g2 0.0028, M 0.9956/0.989, brightness 0.154, F_P 9.8, FSS 15 ueV). The non-resonant QD1 data
# (F_P 7.6, 150 ps, beta 0.88, eta_out 0.70, g2 0.024, M 0.78, brightness 0.65) belong to a different dot and drive and are not in this card.
# Not items: beta (0.88 = F/(1+F) of the entered F_P), lifetime 150 ps (defines F_P 7.6) and beta x eta_out 0.63 are guaranteed by inputs.
meta:
  id: somaschi2016
  role: paper-device
  cite: "N. Somaschi, V. Giesz, L. De Santis, J. C. Loredo, ... P. Senellart, Near-optimal single-photon sources in the solid state, Nature Photonics 10, 340-345 (2016)"
  doi: "10.1038/nphoton.2016.23"
  arxiv: "1510.06499"
  extraction: ".workers/devlib/papers/somaschi2016.yaml"
  read_level: V-full
  display_as: micropillar   # 3D view only (the cavity model is lumped): the device is a micropillar, Somaschi et al., Nat. Photonics 10, 340 (2016): electrically contacted micropillar [V] (main text; .workers/devlib/papers/somaschi2016.yaml); drawn with [A] display defaults
  summary: "InGaAs dot QD3 in an electrically tuned micropillar (F_P 9.8, Q ~12000), 15 ps resonant cross-polarised pulses, 4 K; paper: g2 0.0028, M 0.989 raw / 0.9956 corrected, brightness 0.154"
device:
  T_K: {value: 4.0, unit: K, tag: V, where: "p.3 text (devices studied at 4 K)"}
  material:
    kind: ingaas_gaas
    params:
      tau_bare_ns: {value: 1.3, unit: ns, tag: V, where: "p.3 text (bulk exciton lifetime of 1.3 ns assumed for F_P)"}
      gamma_star_4K_ns: {range: [0.0, 1.5192674479961275], unit: "1/ns", tag: E, source: "no pure-dephasing number in the main text; registry InGaAs class range 0-1 ueV"}
      a_ac_ns_per_K: {value: 0.0, unit: "1/ns/K", tag: A, source: "T = 4 K equals the reference temperature; no slope measured"}
      fss_ueV: {value: 15.0, unit: ueV, tag: V, where: "p.5 text (FSS of 15 ueV used for QD3; 10-15 ueV on p.4); R4: live again, V-system {G,X,Y}"}
  structure:
    kind: generic_cavity
    params:
      F_P: {value: 9.8, unit: "1", tag: V, where: "p.5 text (Purcell factor F_P = 9.8 quoted for the resonant device)"}
      Q: {value: 11100, unit: "1", tag: V, where: "SI: \"The FWHM of the reflectivity dip gives the total cavity damping, κ = 120 µeV, corresponding to a Q-factor of Q = 11100.\" (device QD3, Fig. S3 is the reflectivity of the H polarized cavity mode); R4: replaces the main-text Q ~ 12000 of QD1/QD2. NOTE: this width is measured on the reflectivity dip of the H polarized cavity mode (SI Fig. S3) and is used for the V mode as an [A]"}
      mode_split_ueV: {value: 90.0, unit: ueV, tag: V, where: "p.4 text: \"Because of the 1D wires connecting the pillar to the frame, the cavity also presents a small polarization splitting in the 90µeV range. The laser polarization is set along one direction of the cavity axes (named V), which is roughly oriented 45° with respect to the QD axes. A V polarization thus creates a coherent superposition of both exciton states that temporally evolves toward the orthogonal state coupled to the H polarized cavity mode.\" (somaschi2016.txt l.175-181); SI: \"For resonant excitation experiments, the laser energy is set to the V polarized cavity mode energy.\" (somaschi2016_SI.txt l.67-68)"}
      resonant_mode: {value: V, unit: enum, tag: DR, where: "SI: \"For resonant excitation experiments, the laser energy is set to the V polarized cavity mode energy.\" (somaschi2016_SI.txt l.67-68), the excitation is strictly resonant with the dot, so the dot sits on the V mode; main text: \"the strong Purcell effect in the V mode\" (somaschi2016.txt l.204-205). Opt-in leaf, V is the default (bit-identical to the pre-existing behaviour); H is not used by this card. NOTE: kappa = 120 ueV (Q = 11100, SI Fig. S3) is the width measured on the H-mode reflectivity dip and is used here for the V mode as an [A]"}
      detuning_ueV: {value: 0.0, unit: ueV, tag: A, source: "F_P is quoted at cavity resonance; the dot is Stark-tuned onto the mode by bias (p.3)"}
      eta_out: {value: 0.70, unit: "1", tag: V, where: "SI Fig S3 (QD3: Rmin gives eta_out = kappa_top/kappa = 0.7 +/- 0.05; beta x eta_out ~ 0.63 for QD3, p.5, consistent)"}
  drive:
    kind: resonant_pulse
    params:
      shape: {value: gauss, unit: "", tag: A, source: "'shaped laser pulses' of 15 ps (p.4); the shape is not given"}
      fwhm_ps: {value: 15.0, unit: ps, tag: V, where: "p.4 text (temporal width of 15 ps; taken as intensity FWHM, the paper does not say)"}
      area_pi: {value: 0.866, unit: pi, tag: DR, where: "p.5 Fig 3 caption: g2 measured at 0.75 P_pi; area = sqrt(0.75) pi = 0.866 pi assuming power proportional to area squared. Brightness is quoted near the pi pulse (p.5), so it is compared at 0.866 pi (inversion 0.95)"}
      detuning_meV: {value: 0.0, unit: meV, tag: V, where: "p.4 text (strictly resonant excitation)"}
      f_rep_MHz: {value: 82.0, unit: MHz, tag: DR, where: "p.3 text: \"SPS is excited twice every laser pulse cycle (12.2 ns) with a delay of 3 ns.\"; arithmetic 1 / 12.2 ns = 81.97 MHz, rounded to 82"}
      cross_pol: {value: true, unit: "", tag: V, where: "p.4 text (V excitation, H collection, extinction ~1e5)"}
      pol_angle_deg: {value: 45.0, unit: deg, tag: V, where: "p.4 text (V excitation at ~45 deg to the QD axes)"}
      laser_leak: {range: [0.0, 0.003], unit: "1", tag: DR, where: "p.4 few % x etalon/pulse bandwidth"}
  setup:
    kind: lens_fibre_det
    params:
      zpl_filter: {value: true, unit: "", tag: V, where: "p.4 text: \"an etalon filter with 10 µeV (7 pm) bandwidth\" (somaschi2016.txt l.184-185)"}
      filter_fwhm_GHz: {value: 2.418, unit: "GHz", tag: DR, where: "SI: \"signal, ﬁltered with an etalon with 10 µeV bandwidth (transmission 70%) is sent to a\" (somaschi2016_SI.txt); arithmetic 10 ueV / (h = 4.1357 ueV/GHz) = 2.418 GHz (2.418 is not printed). DISCREPANCY recorded as found, SI vs main text: SI \"Under strictly resonant excitation, an etalon with 10 pm bandwidth and 70 % transmis-\" versus main text \"fluorescence signal of few percent is further reduc ed using an etalon filter with 10 µeV\" (somaschi2016.txt). 10 pm at the card's lambda_nm (arithmetic, ours, none of it printed: 1239.84 eV nm / 925 nm x 0.010 nm / 925 nm = 14.5 ueV = 3.5 GHz) is wider than 10 ueV, so the etalon width is 2.4-3.5 GHz depending on which statement is right; the 10 ueV value is kept (SI, point value 2.418 GHz) and the range is NOT swept"}
      filter_applies_to: {value: g2_hom_brightness, unit: "", tag: V, where: "the brightness 0.16 was measured BEHIND the etalon (SI): \"this conﬁguration, the setup eﬃciency was measured to be 2 .9%. Considering the maximal\" \"the brightness was estimated to be 16% and 8% for QD3 and QD4.\" (the 2.9 % setup efficiency and the brightness are quoted for the etalon configuration), and \"signal, ﬁltered with an etalon with 10 µeV bandwidth (transmission 70%) is sent to a\"; so the filtered photon number also sets the brightness"}
reported:
  - {id: g2_raw, observable: g2_0, convention: raw, value: 0.0028, err: 0.0012, tag: V, where: "p.4 text / p.5 Fig 3b caption / abstract (QD3 at 0.75 P_pi)", note: "measured value after the etalon, no correction stated"}
  - {id: M_raw, observable: hom_I, convention: raw, value: 0.989, err: 0.004, tag: V, where: "p.4 text (same-polarisation HOM, 3 ns delay, without g2 correction)"}
  - {id: M_corr, observable: hom_I, convention: corrected, value: 0.9956, err: 0.0045, tag: V, where: "p.4 text / abstract (corrected for g2(0))"}
  - {id: brightness_res, observable: B_first_lens, value: 0.154, err: 0.015, tag: V, where: "abstract (p.5 text prints 0.16 +/- 0.02)", note: "polarised photons per pulse at the first lens in cross-polarised detection, setup-calibrated; includes the polarisation-rotation loss p_X = 0.23 that the paper computes (p.5)"}
series: []
reproduce:
  - item: g2_raw
    class: M
    tol: {k_sigma: 2, abs: 0.005}
    tol_reason: "paper 2 sigma is only 0.0024; widened to 0.005 absolute because the post-etalon laser leak (envelope 0-3%) adds 2 f_leak to the raw g2 and is unquoted. The model is a two-level system without the V-excitation / H-collection FSS geometry that suppresses re-excitation"
    expect: pass
    weak: true
    weak_reason: "the null model g2 = 0 also passes: the tolerance floor abs 0.005 exceeds the paper value 0.0028, so the pass shows only that the filtered, FSS-gated model is near zero, not that it reproduces 0.0028 (model 0.0031)"
    reason: "R4 filter (SI: 10 ueV = 2.418 GHz etalon) + FSS V-system (15 ueV, 45 deg, H collection): Fable prediction central ~0.0032 vs 0.0028"
  - item: M_raw
    class: M
    tol: {k_sigma: 2, abs: 0.01}
    tol_reason: "values are near unity; 1% absolute (paper 2 sigma 0.008); gamma* is an envelope 0-1 ueV because the paper gives none, so this is a prediction with the class range, not a transcription"
    expect: pass-envelope
    reason: "R4: filtered overlap ~0.997 at gamma* 0; the paper 0.989 needs gamma* <= 0.05 /ns, the card has only the InGaAs class range [0, 1.52] /ns (no linewidth in the paper): the paper value enters the envelope top, the central stays below"
  - item: M_corr
    class: M
    tol: {k_sigma: 2, abs: 0.01}
    tol_reason: "same near-unity 1% absolute (paper 2 sigma 0.009); compared with the model g2-only corrected convention, the same correction the paper applies"
    expect: pass-envelope
    reason: "FX4: central model 0.920 vs 0.9956 +/- 0.0045 is far outside the window; 0.9956 lies inside the envelope [0.848, 0.999] only at the top of the gamma* 0-1 ueV range, so it is not a pass (same gap as M_raw: emission during the long pulse)"
  - item: brightness_res
    class: M
    tol: {k_sigma: 2}
    tol_reason: "2 sigma of the paper's 0.015 (+/-0.03). Written before the run: a two-level model with F_P 9.8, eta_out 0.70 and no polarisation-geometry loss is expected to give about 0.6, not 0.15, because the paper attributes the low value to p_X = 0.23 (FSS rotation vs strong Purcell, p.5), which is not modelled and was deliberately NOT entered as an input"
    expect: fail
    reason: "r4 red-team item 8: setup.filter_applies_to = g2_hom_brightness, because the 0.154 / 0.16 brightness was measured BEHIND the etalon (SI: setup efficiency 2.9 % and the brightness quoted in the etalon configuration). The filtered photon number falls from 0.252 to 0.107 per pulse (x 0.42: the 10 ueV Lorentzian passes B/(B + Gamma/2pi) of the long photon and the FSS-rotated H emission is partly outside it), so the model brightness drops 0.1305 -> 0.0552 (envelope 0.0547-0.0558) vs 0.154 +/- 0.015, 2.8 x low, outside 2 sigma. Nothing was pre-registered; this is the honest outcome. The earlier combined-model pass (0.131) was the unfiltered photon number against a brightness measured behind the etalon."
  - item: eta_prep_pred
    class: P
    observable: eta_prep
    expect: pass
    tol_reason: "no reported value for the resonant device; the paper's p_X = 0.23 is a theory value for the H-emitting exciton, not comparable to the two-level inversion"
  - item: tau_pred
    class: P
    observable: tau_ps
    expect: pass
    tol_reason: "no reported lifetime for QD3; the paper's 150 ps belongs to non-resonant QD1 (F_P 7.6)"
fits: []
