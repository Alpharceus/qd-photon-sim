# Bennett, Patel, Shields et al., arXiv:0803.3700 (2008): "Indistinguishable photons from a diode" (EARLY PREPRINT of Patel et al., Nat. Photon. 4, 632 (2010)).
# Numbers from .workers/devlib/papers/bennett2008_diode.yaml and the raw text (page = arXiv v1 page). Model not tuned.
meta:
  id: bennett2008_diode
  role: paper-device
  cite: "A. J. Bennett, R. B. Patel, A. J. Shields, K. Cooper, P. Atkinson, C. A. Nicoll, D. A. Ritchie, Indistinguishable photons from a diode, arXiv:0803.3700 (2008). NOTE: this is the 2008 preprint of what was published as R. B. Patel et al., Nature Photonics 4, 632 (2010) (journal ref taken from the Cao 2015 reference list); numbers may differ from the published 2010 text and only the preprint was read"
  arxiv: "0803.3700"
  extraction: ".workers/devlib/papers/bennett2008_diode.yaml"
  read_level: V-full
  summary: "InGaAs X- dot (1.31495 eV, T1 800 ps, T2* 62 ps) in a planar-microcavity p-i-n diode, 4 K, 300 ps injection pulse then a Stark step into a 31 ps collection window, 505 MHz: HOM visibility 60 +/- 4 % raw / 64 +/- 4 % dark-count corrected vs 3.75 % at dc bias, g2(0) 0.03 +/- 0.01"
  notes:
    - "PREPRINT: the card transcribes the arXiv:0803.3700 preprint (Patel 2010 is the published version); numbers (g2 0.03, visibility 60/64 %) are those of the preprint."
    - "THREE CONVENTIONS (trap 1): visibility 60 +/- 4 % is RAW (includes detector dark counts); 64 +/- 4 % is dark-count corrected and equals the squared wave-function overlap for balanced beam splitters (text p.4); 3.75 % = T2/2T1 is the theory value for continuous emission at fixed bias. The engine overlap hom_I_gated is the corrected quantity, so it is compared with 64 %; the raw visibility is reported only (the engine raw HOM visibility uses the UNGATED overlap, and the dark count rate is not given)."
    - "GATE vs JITTER (mapping ambiguity): the preprint states that the collected range of emission times is 31 ps (p.2) and that a Gaussian timing jitter of width 31 ps with a 60 ps 1/e coherence time fits the dip (p.4-5). These are the SAME physical window described twice (the paper model has no separate gate), so the card enters ONE top-hat gate of 31 ps (hom_gate_ps) and no extra jitter; entering both would double count. A top-hat of 31 ps is not a Gaussian of width 31 ps (width convention sigma / FWHM also unstated), which is the dominant model uncertainty of the comparison."
    - "GATE START: the memoryless exponential decay makes the overlap independent of when the gate opens once the emission onset lies before it (engine finding: jitter has no effect for hom_gate_start_ps > 0 because the delay only shifts the common start); the gate is therefore opened at the emission onset (start 0, [A]), which is also the only case in which the engine jitter acts."
    - "T2*: T1 = 800 ps (the paper calls it the radiative lifetime) and T2* = 62 ps (1/T2 = 1/2T1 + 1/T2*, text p.5) are entered (gamma*_repo = 2/T2* = 32.3/ns, conversion ours). T2* is derived from the fitted 60 ps coherence time, so it is only partly independent of the dip."
    - "NOT CARDED: g2(0) = 0.03 +/- 0.01 inside the 31 ps window (the engine gate_ps counts from the pump onset, not a Stark window; the preprint attributes the 0.03 to background, brief 2.2 estimates 1.5 % background); HOM peak areas 48 / 19 %; the Stark coefficient (not in the text)."
device:
  T_K: {value: 4.0, unit: K, tag: V, where: "text p.3 (diode cooled to 4 K)"}
  material:
    kind: ingaas_gaas
    params:
      lambda_nm: {value: 942.9, unit: nm, tag: DR, where: "text p.3 (X- at 1.31495 eV): 1239.842 / 1.31495, conversion ours"}
      tau_bare_ns: {value: 0.8, unit: ns, tag: V, where: "text p.5 (radiative lifetime T1 = 800 ps)"}
      gamma_star_4K_ns: {value: 32.26, unit: 1/ns, tag: DR, where: "text p.5 (T2* = 62 ps from 1/T2 = 1/2T1 + 1/T2*): gamma*_repo = 2/T2* = 2/0.062 ns, factor 2 and conversion ours"}
      a_ac_ns_per_K: {value: 0.0, unit: 1/ns/K, tag: A, source: "dephasing entered from the measured coherence at 4 K; no temperature scan in the paper"}
  structure:
    kind: bulk_planar
    params:
      mirror: {value: true, unit: "", tag: V, where: "text p.3 (2 top / 12 bottom Bragg periods around a lambda spacer; the cavity raises the collection and has no measurable effect on the emission rate, so no Purcell factor is entered)"}
  drive:
    kind: electrical_pulsed
    params:
      mechanism: {value: "M-3 pulsed", unit: "", tag: A, source: "pulsed injection followed by a Stark-step collection window"}
      tau_on_ns: {value: 0.3, unit: ns, tag: V, where: "text p.3 (nominally 300 ps positive pulse injects the carriers)"}
      I_uA: {value: 0.000267, unit: uA, tag: E, source: "effective current into the dot for mu ~ 0.5 over 300 ps; the injection level is not stated (does not enter the gated overlap, which is a single-photon quantity). M-3 multiplies eta_capture twice, so eta_capture is held at 1"}
      eta_capture: {value: 1.0, unit: "1", tag: A, source: "held at 1; injection efficiency folded into I_uA (see I_uA)"}
      f_rep_MHz: {value: 505.0, unit: MHz, tag: DR, where: "text p.4 (source repetition period 1.98 ns): 1e3/1.98, conversion ours"}
      hom_gate_ps: {value: 31.0, unit: ps, tag: V, where: "text p.2 (selected energies reduce the range of emission times to 31 ps)"}
      hom_gate_start_ps: {value: 0.0, unit: ps, tag: A, source: "gate opens at the emission onset; see meta.notes (GATE START)"}
      hom_jitter_ps: {value: 0.0, unit: ps, tag: A, source: "no extra jitter: the fitted 31 ps Gaussian jitter is the same window as hom_gate_ps (see meta.notes GATE vs JITTER)"}
  setup:
    kind: lens_fibre_det
    params:
      NA: {value: 0.5, unit: "1", tag: V, where: "text p.3 (microscope objective NA = 0.5)"}
      zpl_filter: {value: true, unit: "", tag: V, where: "text p.3 (monochromator filters the photons in energy before the interferometer)"}
reported:
  - {id: hom_dc_reference, observable: hom_I, convention: intrinsic, value: 0.0375, tag: V, where: "text p.5 (visibility under fixed bias T2/2T1 = 3.75 %)", note: "theory value from T1 and T2*; no error printed"}
  - {id: hom_corr_gated, observable: hom_I_gated, value: 0.64, err: 0.04, tag: V, where: "text p.4 (visibility 64 +/- 4 % after subtracting detector dark counts = squared wave-function overlap)", note: "dark-count corrected"}
  - {id: hom_raw_gated, observable: hom_V, convention: raw, value: 0.60, err: 0.04, tag: V, where: "text p.4 / abstract (visibility 60 +/- 4 % in the raw data)", note: "raw, includes dark counts; reported only"}
  - {id: g2_gated, observable: g2_0, convention: raw, value: 0.03, err: 0.01, tag: V, where: "text p.3 / Fig 3a (g2(0) = 0.03 +/- 0.01 in the selected window)", note: "raw; attributed to background, not carded"}
series: []
reproduce:
  - item: hom_dc_reference
    class: M
    tol: {abs: 0.002}
    tol_reason: "3.75 % is the textbook T2/2T1 evaluated from T1 and T2* of the same paper, so only the engine convention (gamma*_repo = 2/T2*, Lindblad overlap Gamma/(Gamma + gamma*)) is tested, not an independent measurement; 0.002 absolute (about 5 % of the value, three significant digits quoted)"
    expect: pass
  - item: hom_corr_gated
    class: M
    tol: {k_sigma: 2}
    tol_reason: "2 sigma of the printed 4 % (0.08). No free input: T1 and T2* are entered, the 31 ps window is the paper own statement and no jitter is added (single window, see meta.notes); brief 6 expected the model band 0.55-0.75 with the jitter as the one assumption"
    expect: fail
    reason: "model 0.736 vs 0.64 +/- 0.04 (just outside 2 sigma = 0.08): a hard 31 ps top-hat gate with T1 800 ps / T2* 62 ps gives the jitter-free limit of the brief; the paper fits a Gaussian emission-time jitter (and the Stark sweep) that a top-hat of the same nominal width does not reproduce. Model-shape gap (gate vs Gaussian window), not a missing input; adding the 31 ps jitter on top of the gate (engine hom_jitter_ps) would double count and gives 0.68-0.70 only because the engine jitter is applied at a gate starting at the emission onset"
fits: []
history:
  - {date: 2026-10-12, by: "Sonnet 5.5 (claude-sonnet-5-5)", reason: "initial transcription", note: "initial transcription"}
