  - {date: 2026-11-03, by: "Sonnet 5.5 (r4-phonon coder)", reason: "r4-phonon I1 (Zf_window: setup.filter_width_meV drives the ZPL truncation and sideband transmission, per-point windows 0.0298 / 0.0745 / 0.0745 meV on rate_vs_T) and I2 (r4-phonon I2 (registry row inas_ingaas_metamorphic_cband l_xy [3,5] -> [5,8] nm, l_z [1,2] -> [2,3] nm, tag E: 'O-band dot class; Kolatschek rate(T) brackets it', Fable r4 adjudication): Z(4 K) 0.891 -> 0.947)", change: "rate_4K 6.8e5 -> 5.205e5 (envelope 5.05e5-7.8e5 -> 3.54e5-6.26e5), expect fail -> pass; rate_vs_T rms 1.82 -> 0.4527, expect fail -> pass; g2_4K and g2_vs_T unchanged. Fable predicted both absolute items stay fail; flipped with the honest reason, tolerances untouched"}
