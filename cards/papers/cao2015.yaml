# Cao et al., arXiv:1507.06169 (2015): ultrafast electrical control of a resonantly driven single-photon source (Stark-gated resonance fluorescence).
# Numbers from .workers/devlib/papers/cao2015.yaml and the raw text (page = arXiv v1 page). Model not tuned.
meta:
  id: cao2015
  role: paper-device
  cite: "Y. Cao, A. J. Bennett, D. J. P. Ellis, I. Farrer, D. A. Ritchie, A. J. Shields, Ultrafast electrical control of a resonantly driven single photon source, arXiv:1507.06169 (2015)"
  arxiv: "1507.06169"
  extraction: ".workers/devlib/papers/cao2015.yaml"
  read_level: V-full
  summary: "InAs/GaAs X in a p-i-n planar-DBR diode, 10 K, cw resonant laser at 1.324 eV gated into resonance by 300 ps electrical pulses at 200 MHz: T1 1.0 ns, T2 1.0 ns, Rabi period 1.6 ns at 500 nW, triggered g2(0) 0.028 +/- 0.010 (background corrected)"
  notes:
    - "GATED RESONANCE: the cw laser is fixed; the bias Stark-shifts the exciton into resonance for 300 ps once per period. The drive stark_gated_resonant carries the time-dependent detuning (det_off outside the gate, det_on = 0 inside), the Rabi frequency from the measured period and power, and a sharp gate edge (Landau-Zener non-adiabatic: the dot switches on)."
    - "COHERENCE INPUTS: T1 = 1.0 ns (triggered-emission lifetime, p.8) and T2 = 1.0 +/- 0.1 ns (Fabry-Perot filtered linewidth 1.3 ueV, p.4) give gamma*_repo = 2 (1/T2 - 1/2T1) = 1.0/ns. The paper own model uses lifetime broadening and pure dephasing of 1 GHz each (p.6), a different bookkeeping of the same rates; the directly measured T2 is used. The lifetime and linewidth items are therefore calibrations of these two inputs."
    - "BACKGROUND: g2 0.028 +/- 0.010 is BACKGROUND CORRECTED (laser scatter was 7.8 % of the correlation signal); the raw triggered value is not printed. The comparison is with the model intrinsic g2."
    - "UNSTATED CONDITIONS: the laser power of the triggered measurement is not given (the cw powers run 25-500 nW; E range here), and neither are the Stark coefficient / off-gate detuning (the off-gate excitation is negligible for any |det_off| >> hbar Gamma_2 = 1.3 ueV; E range 0.1-5 meV) nor the gate-edge time (taken sharp, t_r = 0; the engine shows the result is sensitive to t_r >= 50 ps)."
    - "NOT CARDED: cw g2 0.040 +/- 0.005 at 25 nW (480 ps detector response: the cw resonant drive has no IRF-convolved observable); resonance-fluorescence linewidths 16.7-36.8 ueV (spectral diffusion); Rabi damping and the 40-100 ns bunching."
device:
  T_K: {value: 10.0, unit: K, tag: V, where: "extraction (T = 10 K)"}
  material:
    kind: inas_gaas_sk
    params:
      lambda_nm: {value: 936.4, unit: nm, tag: DR, where: "extraction (laser energy E_L = 1.324 eV): 1239.842 / 1.324, conversion ours"}
      tau_bare_ns: {value: 1.0, unit: ns, tag: V, where: "calibrated (fits): text p.8 (lifetime T1 = 1.0 ns from the time-resolved triggered emission)"}
      gamma_star_4K_ns: {value: 1.0, unit: 1/ns, tag: DR, where: "calibrated (fits): text p.4 (T2 = 1.0 +/- 0.1 ns from the 1.3 ueV Fabry-Perot filtered linewidth) with T1 = 1.0 ns: gamma*_repo = 2 (1/T2 - 1/2T1), conversion ours"}
      a_ac_ns_per_K: {value: 0.0, unit: 1/ns/K, tag: A, source: "dephasing entered from the measured coherence at the operating temperature; no temperature scan in the paper"}
  structure:
    kind: bulk_planar
    params:
      mirror: {value: true, unit: "", tag: V, where: "extraction (planar DBR wafer: 7 repeats below / 4 on top, confocal collection, no pillar, no Purcell effect)"}
  drive:
    kind: stark_gated_resonant
    params:
      det_off_meV: {range: [0.1, 5.0], unit: meV, tag: E, source: "Delta outside the gate (bias -0.29 V vs resonance near +0.2 V): the Stark coefficient is not given in the text; any value >> hbar Gamma_2 = 1.3 ueV switches the laser off"}
      det_on_meV: {value: 0.0, unit: meV, tag: V, where: "text p.7 (the exciton is Stark shifted into resonance with the fixed laser for the pulse width)"}
      t_gate_ps: {value: 300.0, unit: ps, tag: V, where: "text p.7-8 / Fig 3c (300 ps pulse width)"}
      t_r_ps: {value: 0.0, unit: ps, tag: A, source: "sharp gate edge: the edge time is not given; the model's non-adiabatic limit (the dot just switches on)"}
      rabi_period_ns: {value: 1.6, unit: ns, tag: V, where: "text p.6 (Rabi period 1.6 +/- 0.2 ns at 500 nW)"}
      power_ref_nW: {value: 500.0, unit: nW, tag: V, where: "text p.6 (Rabi period quoted at 500 nW)"}
      power_nW: {range: [25.0, 500.0], unit: nW, tag: E, source: "the laser power of the triggered g2 is not stated; the cw powers of the paper span 25-500 nW (Rabi frequency scales as sqrt(power), text p.6)"}
      f_rep_MHz: {value: 200.0, unit: MHz, tag: V, where: "text p.7 (200 MHz pulse train)"}
  setup:
    kind: lens_fibre_det
    params: {}
reported:
  - {id: g2_gated_bgc, observable: g2_0, convention: intrinsic, value: 0.028, err: 0.010, tag: V, where: "text p.8 / Fig 3c (background-corrected electrically triggered g2(0) = 0.028 +/- 0.010, 200 MHz, 300 ps)", note: "laser scatter contributed 7.8 % of the correlation signal; raw value not printed"}
  - {id: T1_triggered, observable: tau_ps, value: 1000.0, tag: V, where: "text p.8 (lifetime T1 = 1.0 ns extracted from the time-resolved fluorescence at -0.29 V, 300 ps pulses)", note: "no error printed"}
  - {id: linewidth_FP, observable: linewidth_ueV, value: 1.3, err: 0.1, tag: V, where: "text p.4 (Fabry-Perot filtered linewidth 1.3 +/- 0.1 ueV at 25 nW, T2 = 1.0 ns)", note: "resonant filtering of the charge noise; equals hbar (Gamma + gamma*) = 2 hbar/T2"}
series: []
reproduce:
  - item: g2_gated_bgc
    class: M
    tol: {k_sigma: 2}
    tol_reason: "2 sigma of the printed 0.010 (0.02). No fitted input: T1 and T2 are the measured coherence, the Rabi period the measured one, the gate the nominal 300 ps; the laser power (25-500 nW) and the off-gate detuning are E ranges to which g2 is insensitive (model estimate: 0.026 at 500 nW, 0.023 at 25 nW). Compared with the background-corrected value (model intrinsic)"
    expect: pass
  - item: T1_triggered
    class: C
    tol: {rel: 0.05}
    tol_reason: "calibration: tau_bare_ns is set to the measured triggered-emission lifetime (no Purcell factor); 5 % because no error is printed"
    expect: pass
  - item: linewidth_FP
    class: C
    tol: {k_sigma: 2}
    tol_reason: "calibration: gamma_star is derived from the same T2 (Fabry-Perot filtered linewidth) with T1, so hbar (Gamma + gamma*) = 2 hbar/T2 can only agree; 2 sigma of the printed 0.1 ueV"
    expect: pass
fits:
  - {param: material.tau_bare_ns, fitted_to: [T1_triggered]}
  - {param: material.gamma_star_4K_ns, fitted_to: [linewidth_FP]}
history:
  - {date: 2026-10-12, by: "Sonnet 5.5 (claude-sonnet-5-5)", reason: "initial transcription", note: "initial transcription"}
