meta:
  name: edge-inp-gainp-design
  role: device-design
  device: >
    InP self-assembled QD in Ga0.51In0.49P clad by (Al0.55Ga0.45)0.51In0.49P
    on GaAs; RT electrical edge emitter, Reischle-2008-class ("red")
    transport diode.
  source: "fallback RT edge-emitter design card, docs/rt_edge_contract.md"
  note: >
    Fallback card of the room-temperature electrical edge-emitter tier
    (docs/rt_edge_contract.md), Reischle et al. 2008/2010 InP/GaInP class.
    Opts into every new device.py mode: dot.linewidth=anchored, ret.mode=
    confinement (inline ret.system, no ret.preset -- same inline-stack
    style as the primary card), drive.mode=EL-transport with drive.diode.
    preset, emission.type=edge, aperture.compose, a non-empty filter.
    track_material, and drive.cw. ret.system.vbo_override_eV carries the
    Pryor dot-matrix VBO used by dot_levels.class_presets()'s matching
    'InP/GaInP/AlGaInP0.55 on GaAs' entry. Every scalar this card sets
    carries a design.provenance.sources entry keyed by its dotted design
    path; design.provenance also records the sweepable ranges the
    acceptance sweep consumes and the single-dot selection argument.
    drive.b_e and cavity.beta_sin are evaluator-derived and are never set
    here. Loads and evaluates with fsim_core.device (DeviceDesign.load /
    evaluate); checked mechanically by verify/verify_rt_edge_cards.py.

    pr-pkg1-capture-escape (peer-review-triage.md finding 5): ret.system.
    barrier is now the class's native (Al0.55Ga0.45)0.51In0.49P, ONE Al
    fraction across ret.system.barrier, thermal.layers and drive.diode.
    preset='red' (materials.refractive_index resolves x_al=0.55 through
    its _interp_n_by_x fallback between the tabulated x_al=0.50 and 1.0
    MATERIAL_EXTRA anchors -- a literal x_al=0.55 entry was tried and
    removed, pr-pkg1-fix2 item 8: it reproduced the interpolated value to
    float round-off, so it added no independent source, only a second
    place to keep in sync; see design.provenance.sources[
    "ret.system.barrier.x_al"]). This card previously substituted a
    x_al=0.50 barrier in ret.system while thermal.layers/drive.diode used
    0.55 -- ONE Al fraction now runs through all three, which is a real
    provenance-consistency fix, but its PHYSICAL effect is small: at
    x_al=0.50/0.55/1.0 the confinement-side E_a, a_esc, S (hence g2/rho)
    are numerically identical (the confinement Hamiltonian does not see
    ret.system.barrier.x_al's small refractive-index difference); only the
    waveguide mode moves, shifting collected_flux_pulsed_s by ~6% across
    the full 0.50-to-1.0 range (58.770 -> 59.276 -> 62.324 s^-1 at this
    card's own operating point).

design:
  name: edge-inp-gainp-design
  dot:
    linewidth: anchored
    delta_xx: 7.0
    gamma300: 12.0
  ret:
    # item 10 (pr-pkg1-fix2, low priority): ret.tau_cap_scales_with_density
    # (unset here -> false, the shipped no-cancellation convention; see
    # design.provenance.finding_1b_record) is currently NOT an axis of the
    # acceptance sweep -- the sweep spec will decide whether to add it.
    mode: confinement
    system:
      dot: InP
      matrix: {kind: GaInP, x_ga: 0.51}
      barrier: {kind: AlGaInP, x_al: 0.55, y_III: 0.51}
      substrate: GaAs
      geometry: {height_nm: 3.0, radius_nm: 10.0}
      vbo_override_eV: {dot-matrix: -0.045}
  drive:
    mode: EL-transport
    diode:
      preset: red
      active: {kind: GaInP, x_ga: 0.51}
      tau_pulse_ns: 0.1
    I_uA: 0.0010181197712793297
    duty: 0.008
    b_res: 0.13636363636363635
    cw: true
    cw_irf_fwhm_ps: 100.0
    cw_tau_max_ns: 0.24
    loading_model: auto  # [A] peer-review-triage.md finding 2 -- legacy switch, bit-identical
    finite_pulse: false  # [A] peer-review-triage.md finding 1 -- static per-pulse loading (legacy)
    gate_ns: null        # [A] peer-review-triage.md finding 4 -- legacy background-fraction formula
  thermal:
    T_hs: 300.0
    layers:
      - name: "(Al0.55Ga0.45)0.51In0.49P cladding"
        t_um: 1.5
        k300: 6.0
        alpha: 0.5
        spread: false
  cavity:
    enabled: false
  filter:
    track_material: matrix
    hold_window: false
  aperture:
    compose: true
    density_cm2: 300000000.0
    diameter_um: 0.4
  emission:
    type: edge
    ridge_width_nm: 2000.0
    NA: 0.75
    R_back: 0.95
    L_um: 250.0
    alpha_cm: 5.0
    lambda_nm: 770.0

  provenance:
    card_id: edge-inp-gainp-design
    class: fallback

    sources:
      dot.linewidth:
        value: anchored
        tag: A
        source: >
          Opt-in to the anchored InP linewidth model (docs/rt_edge_contract.md
          block schema); anchor-fit class of Matsuda et al., PRB 63, 121304
          (2001), per device.py DotBlock.linewidth's documented convention.
      dot.delta_xx:
        value: 7.0
        tag: V
        source: >
          Bommer et al., J. Appl. Phys. 110, 063108 (2011), biexciton-
          binding discussion: measured InP/GaInP-class micropillar-dot
          X-XX splitting.
        anchor_id: bommer11-delta-xx
      dot.gamma300:
        value: 12.0
        tag: E
        source: >
          [E] Class proxy: In0.5Ga0.5As/GaAs single dot at 300 K (Matsuda et
          al., Physical Review B 63, 121304(R) (2001), ~12 meV homogeneous
          linewidth); the InP/AlGaInP 300 K single-dot linewidth is
          unmeasured (docs/rt_edge_contract.md Evidence section). Sweep
          range 6-20 meV: Chatzarakis et al., Physical Review Applied 20,
          034011 (2023) provides the 6.5 meV lower anchor
          (chatzarakis23-gamma300-class); the prior 16 meV entry for this
          claim is superseded (it was a 300 K detection-bandpass filter
          width, not a measured emission linewidth -- see this field's
          note).
        anchor_id: matsuda01-gamma300-class
        note: >
          The g2 outcome hinges strongly on this number, evaluated fresh
          against the final card at its own drive.I_uA=0.0018830313178885266
          (V_j and mu are unchanged across the sweep -- transport is
          independent of dot.gamma300 (the linewidth enters only the spectral overlap and filter stages): at gamma300 = 6.5 meV
          (chatzarakis23-gamma300-class lower anchor) g2_op = 0.4563238376
          (~0.46); at 12.0 meV (this card's default, Matsuda 2001) g2_op =
          0.6890713444 (~0.69); at 16.0 meV (the previous, now-superseded
          Laferriere proxy) g2_op = 0.7604492717 (~0.76). All three
          recomputed fresh against the final card (council review
          2026-09-06 item 1).
      ret.mode:
        value: confinement
        tag: E
        source: >
          Opt-in to dot_levels-derived confinement retention in place of
          the arsenide class-proxy Arrhenius fit (docs/rt_edge_contract.md
          block schema).
      ret.system.dot:
        value: InP
        tag: A
        source: "InP self-assembled QD, Reischle et al. 2008 class dot material."
      ret.system.matrix.x_ga:
        value: 0.51
        tag: V
        source: >
          Ga0.51In0.49P, lattice-matched to GaAs at 300 K (Vurgaftman et
          al., JAP 89, 5815 (2001)); Reischle et al., Optics Express 16,
          12771 (2008) matrix material.
      ret.system.barrier.x_al:
        value: 0.55
        tag: V
        source: >
          The class's own native barrier composition (dot_levels.
          class_presets 'InP/GaInP/AlGaInP0.55 on GaAs'; Reischle et al.,
          Optics Express 16, 12771 (2008) p-i-n barrier), now used
          directly: materials.refractive_index resolves x_al=0.55 through
          its _interp_n_by_x [E] linear-interpolation fallback between the
          tabulated x_al=0.50 and x_al=1.0 (AlInP) MATERIAL_EXTRA anchors
          (pr-pkg1-fix2 item 8 -- a literal "(Al0.55Ga0.45)0.51In0.49P"
          entry was tried and removed: it reproduced the interpolated
          value to float round-off, adding no independent source), so
          emission.type='edge' (which shares this same ret.system stack,
          device.py's documented "shared inline stack" rule) no longer
          needs a substitute composition. ONE Al fraction now runs across
          ret.system.barrier, thermal.layers (the
          "(Al0.55Ga0.45)0.51In0.49P cladding" layer) and drive.diode.
          preset='red' (transport.red_diode_preset's own internal
          AlGaInP0.55 barrier, cross-checked by verify_rt_edge_cards.py) --
          a genuine provenance-consistency fix over this card's previous
          substituted x_al=0.50 ret.system.barrier, but its physical effect
          is small: at x_al=0.50/0.55/1.0 the confinement-side E_a, a_esc,
          S are numerically identical (verified: S_resolved unchanged to
          10 significant figures across the sweep); only the waveguide
          mode's collected_flux_pulsed_s moves, by ~6% end to end (58.770
          -> 59.276 -> 62.324 s^-1 at this card's own operating point).
      ret.system.barrier.y_III:
        value: 0.51
        tag: DR
        source: >
          Lattice-matched-to-GaAs III-sublattice fraction, Vurgaftman et
          al., JAP 89, 5815 (2001) convention (materials.AlGaInP default).
      ret.system.substrate:
        value: GaAs
        tag: A
        source: "GaAs substrate, Reischle et al., Optics Express 16, 12771 (2008) class."
      ret.system.geometry.height_nm:
        value: 3.0
        tag: V
        source: >
          Reischle et al. 2008 class InP dot height, dot_levels.
          class_presets 'InP/GaInP/AlGaInP0.55 on GaAs' default.
      ret.system.geometry.radius_nm:
        value: 10.0
        tag: A
        source: >
          Radius not reported by Reischle et al.; carried over at 10 nm
          per dot_levels.class_presets' reischle() class default.
      ret.system.vbo_override_eV.dot-matrix:
        value: -0.045
        tag: V
        source: >
          Pryor, Phys. Rev. B 56, 10404 (1997): InP valence band 45 meV
          below GaInP (Fe impurity-level spectra), replacing the model-
          solid +0.17 eV default; dot_levels.class_presets reischle()
          convention.
      drive.mode:
        value: EL-transport
        tag: A
        source: >
          Opt-in transport-aware electrical drive (docs/rt_edge_contract.md
          block schema); Reischle et al., Optics Express 16, 12771 (2008)
          / Appl. Phys. Lett. 97, 143513 (2010) electrically pumped
          InP/GaInP p-i-n device.
      drive.diode.preset:
        value: red
        tag: E
        source: >
          transport.red_diode_preset: Reischle-2008-like red p-i-n stack
          ((Al0.55Ga0.45)0.51In0.49P intrinsic barriers, Al0.52In0.48P
          claddings).
      drive.diode.active.x_ga:
        value: 0.51
        tag: V
        source: >
          Ga0.51In0.49P active/matrix layer, matching ret.system.matrix and
          the Reischle et al. 2008 class device; transport.
          red_diode_preset(active='GaInP') default.
      drive.diode.tau_pulse_ns:
        value: 0.1
        tag: A
        source: "[A] 0.1 ns pulse width, an 80 MHz-class pulsed electrical drive design choice as in Reischle et al., Appl. Phys. Lett. 97, 143513 (2010) / typical pulsed SPS operation."
      drive.duty:
        value: 0.008
        tag: A
        source: "[A] 0.008 duty at 80 MHz, the sweep configuration; 80 MHz-class pulsed electrical drive as in Reischle et al., Appl. Phys. Lett. 97, 143513 (2010) / typical pulsed SPS operation."
      drive.I_uA:
        value: 0.0010181197712793297
        tag: DR
        source: >
          [DR] pr-pkg1-capture-escape (peer-review-triage.md finding 1b)
          re-solve: the confinement retention fix (RetentionBlock.n_dot_cm2
          now defaults to this card's own aperture.density_cm2=3e8 cm^-2
          instead of dot_levels.retention_params' 1e10 cm^-2 default)
          collapses S(300 K) from ~0.0046 to ~0.00019 (see dot_levels'
          retention_params note and design.provenance's finding-1b record
          below), so the prior I_uA=0.0018830313178885266 operating point
          is no longer near-optimal. Re-run: Log-spaced grid I_uA=
          10^-4..10^-1 (31 points), followed by a local solve (scipy
          minimize_scalar, bounded) on the loaded card at T_hs=300 K,
          calling fsim_core.device.evaluate: the constrained pulsed-g2
          minimum is at the explicit tau_pulse_ns=0.1 ns, duty=0.008
          (80 MHz), I_uA=0.0010181197712793297, where V_j=1.6101282192 V,
          f_qfl=0.9978293886, mu=0.5406812735, rho_op=0.7500991150,
          g2_op=0.7736310524, and collected_flux_pulsed_s=59.2763955005.
          eta_NA=0.8136400721, eta_total=0.0189441140 (waveguide-na-
          collection-fix's circular NA-cone / 1/e^2-width convention,
          A_mode = pi w_x w_y). The collected flux is now far below the
          1 kHz floor and g2_op is far above 0.5 -- this design NO LONGER
          clears either acceptance gate at its own default operating
          point once the density fix is applied (it is still the flux-
          maximising allowed current: the 0.5x point is feasible
          (mu=0.0678, not sub-turn-on) with g2_op=0.8101323 there, still
          worse (higher) than this point's g2_op, so it does not beat this
          point; the 2x point has mu=1.0814, outside the allowed
          [0.05, 1.0] range). See design.provenance's finding-1b record
          for the favourable-corner (T_hs=230 K, gamma300=6, delta_xx=8,
          NA=0.8, R_back=0.95, L=250 um) g2/flux under both the default
          (no-cancellation) and the opt-in full-cancellation
          (ret.tau_cap_scales_with_density) conventions. No literature
          single-dot InP/GaInP drive current exists; this is a
          simulator-derived operating point.
      drive.cw:
        value: true
        tag: A
        source: "Opt-in CW g2(tau)/IRF diagnostics (docs/rt_edge_contract.md block schema)."
      drive.b_res:
        value: 0.13636363636363635
        tag: A
        source: "[A] class value transferred from a different material and temperature: Reischle et al., Optics Express 16, 12771 (2008), InP/AlGaInP QD C at 80 K (raw g2 0.43 -> 0.03 after background correction, rho approximately 0.88 -> b_res = 1/rho - 1 = 0.136; ledger anchor reischle08-b-res-80k in verify/data/rt_edge_anchors.yaml states rho = 0.88 directly -- this card's b_res = 1/rho - 1 transformation, and its transfer to this 300 K design, are assumptions of this card, not of that anchor); T-independent residual assumed."
      drive.cw_irf_fwhm_ps:
        value: 100.0
        tag: E
        source: >
          Within the acceptance sweep's irf_ps=[50,200] ps class range
          (design.provenance.ranges); a representative fast-SPAD instrument
          response, faster than the module's Reischle-2008-class 500 ps
          default.
      drive.cw_tau_max_ns:
        value: 0.24
        tag: DR
        source: >
          Council review 2026-09-05: 0.02 ns put 81% of the IRF kernel
          weight on edge padding (kernel FWHM > window). Re-derived as
          >= 5 sigma_IRF + 5 tau_dip: sigma_IRF = 100 ps FWHM / 2.3548 =
          0.0425 ns (5 sigma = 0.212 ns); tau_dip = 0.00462 ns from
          cw_g2.cw_report's own single-exponential dip fit at this
          operating point (5 tau_dip = 0.0231 ns) -- floor 0.235 ns.
          0.24 ns clears that floor with margin and (cw_g2's max-2e5-point
          grid cap in force) evaluate() completes in ~0.4 s at this card's
          drive.I_uA, inside the <5 s/evaluation bound; a numerical
          choice, not a literature value.
      drive.loading_model:
        value: auto
        tag: A
        source: >
          peer-review-triage.md finding 2 -- "auto" (default) reproduces
          today's F_p != 1.0 switch between loading.f1b_g2/f8_g2
          bit-identically; not requested (this card leaves drive.F_p at its
          1.0 default, so "auto" and "capped_poisson" agree here anyway).
      drive.finite_pulse:
        value: false
        tag: A
        source: >
          peer-review-triage.md finding 1 -- false (default, legacy): keeps
          the static per-pulse loading distribution (f1b_g2). Not requested
          on this card; the acceptance sweep will decide whether to switch
          it on.
      drive.gate_ns:
        value: null
        tag: A
        source: >
          peer-review-triage.md finding 4 -- null (default, legacy): keeps
          the existing per-collected-X/CW-time-model background-fraction
          formula. Not requested on this card (only meaningful together with
          drive.finite_pulse=true); recommended default when opted in is
          tau_pulse_ns + 5*ret.tau_rad_ns.
      thermal.T_hs:
        value: 300.0
        tag: A
        source: "[A] TEC-cooled package; the junction temperature is still solved self-consistently from the drive power. Default is the 300 K room-temperature operating point (docs/rt_edge_contract.md)."
      thermal.layers.0.t_um:
        value: 1.5
        tag: E
        source: >
          Single (Al0.55Ga0.45)0.51In0.49P cladding thickness class,
          matching the legacy staged-device-design.yaml epi/cladding value.
      thermal.layers.0.k300:
        value: 6.0
        tag: E
        source: >
          Adachi (2007) AlGaInP alloy-class thermal-conductivity estimate;
          the same class value materials.MATERIAL_EXTRA records for the
          tabulated x_al=0.50 (Al0.50Ga0.50)0.51In0.49P composition.
          pr-pkg1-fix2 item 7: linearly interpolating in x_al between the
          tabulated x_al=0.50 (k300=6.0) and x_al=1.0/AlInP (k300=8.0)
          MATERIAL_EXTRA anchors at this card's own x_al=0.55 (t=0.1) gives
          k300=6.2, not 6.0; 6.0 is kept deliberately rather than switched
          to 6.2 -- both are [E] class estimates from the SAME alloy model
          (Adachi 2007), 0.2 W/cm/K apart, well inside that model's own
          class-precision uncertainty, so the two Al fractions are
          indistinguishable at this precision and picking either is
          equally defensible; 6.0 (the literal tabulated x_al=0.50 value)
          is kept to avoid a downstream self-heating/Tj shift from a
          within-uncertainty relabeling.
      thermal.layers.0.alpha:
        value: 0.5
        tag: E
        source: >
          Adachi (2007) alloy-class k(T) exponent, matching
          materials.MATERIAL_EXTRA's (Al0.50Ga0.50)0.51In0.49P alpha_k.
      thermal.layers.0.spread:
        value: false
        tag: A
        source: "Planar heat flow, no current-spreading correction (matches the legacy staged-device-design.yaml default)."
      cavity.enabled:
        value: false
        tag: A
        source: >
          emission.type='edge' is incompatible with a resonant cavity
          (device.evaluate()'s guard; docs/rt_edge_contract.md); this
          design has no resonant cavity.
      filter.track_material:
        value: matrix
        tag: A
        source: "[A] inert in this configuration (no cavity); kept for the cavity variant. hold_window is false, so the named material is validated but does not move the filter window."
      filter.hold_window:
        value: false
        tag: A
        source: "[A] inert in this configuration (no cavity); kept for the cavity variant."
      aperture.compose:
        value: true
        tag: A
        source: >
          Opt-in continuous Poisson competitor-bath composition
          (docs/rt_edge_contract.md "Aperture assumptions").
      aperture.density_cm2:
        value: 300000000.0
        tag: A
        source: >
          Lithographic single-dot-isolation design target (design.
          provenance.single_dot_selection), distinct from Reischle et al.
          2008's own large-aperture (~20 um) current-funneling approach
          (cards/reischle.yaml qd_density) and from the ~1e10 cm^-2
          published InP-dot density digest (Reischle et al., Appl. Phys.
          Lett. 97, 143513 (2010)) -- two orders of magnitude above this
          design target (council review 2026-09-05).
      aperture.diameter_um:
        value: 0.4
        tag: A
        source: >
          Within the Chatzarakis et al., Phys. Rev. Applied 20, 034011
          (2023) 0.3-3 um e-beam mesa class; chosen for single-dot
          selection (design.provenance.single_dot_selection), distinct
          from Reischle et al. 2008's own ~20 um contact aperture.
      emission.type:
        value: edge
        tag: A
        source: >
          Opt-in edge out-coupling (docs/rt_edge_contract.md;
          waveguide.edge_emission on the shared ret.system stack).
      emission.ridge_width_nm:
        value: 2000.0
        tag: A
        source: >
          2 um ridge, within the Chatzarakis et al., Phys. Rev. Applied 20,
          034011 (2023) 0.3-3 um mesa/ridge class; no InP/GaInP edge-
          emitter ridge width has been published.
      emission.NA:
        value: 0.75
        tag: A
        source: >
          [A] 0.75 numeric aperture, within the 0.7-0.8 standard microscope-
          objective class (Laferriere et al., Nano Letters 23, 962 (2023)
          used NA 0.81 for first-lens collection); no InP/GaInP edge-emitter
          NA has been published. Declared explicitly per council review
          2026-09-06 item 3 (previously an undeclared device.py default of
          0.5, which understated the collected-flux calculation).
      emission.R_back:
        value: 0.95
        tag: A
        source: >
          [A] HR-coated back facet, standard practice for edge-emitting
          lasers/SPS devices to force emission out the front facet; no
          InP/GaInP edge-emitter back-facet coating has been published, so
          this is a stated coating assumption. Declared explicitly per
          council review 2026-09-06 item 3 (previously an undeclared
          device.py default of None, i.e. two facets sharing emission
          equally).
      emission.L_um:
        value: 250.0
        tag: A
        source: >
          [A] Cleaved ridge length, shorter than the device.py 500 um
          undeclared default, reducing propagation loss (emission.alpha_cm
          below) over the shorter path; no InP/GaInP edge-emitter ridge
          length has been published. Declared explicitly per council
          review 2026-09-06 item 3.
      emission.alpha_cm:
        value: 5.0
        tag: E
        source: >
          [E] Ridge propagation-loss class value, the same class estimate
          already carried as device.py's own undeclared EmissionBlock.
          alpha_cm default (waveguide.py). Declared explicitly on the card
          per council review 2026-09-06 item 3 rather than left implicit.
      emission.lambda_nm:
        value: 770.0
        tag: DR
        source: >
          Council review 2026-09-05, completed after materials.
          MATERIAL_EXTRA gained ratio-scaled [E] refractive-index points
          for ret.system.matrix (Ga0.51In0.49P) at 700-850 nm
          (orchestrator-approved option (c): 668 nm class value x
          Ga0.51In0.49P's own measured n(lambda)/n(668) dispersion ratio,
          Schubert et al., JAP 77, 3416 (1995) -- see materials.py comments
          on that entry); ret.system.barrier ((Al0.55Ga0.45)0.51In0.49P)
          resolves at those same wavelengths through the x_al
          interpolation fallback described on ret.system.barrier.x_al
          above (pr-pkg1-fix2 item 8), not a literal tabulated entry.
          770.0 nm is this dot's own confinement-derived transition
          (fsim_core.dot_levels.levels(system), using the matching
          dot_levels.class_presets 'InP/GaInP/AlGaInP0.55 on GaAs' preset,
          300 K: E_X = 1.610 eV), i.e. the device.py
          EmissionBlock.lambda_nm=0 default's resolved value, set explicitly
          here so the [DR] tag and this note are visible on the card itself.
          waveguide.edge_emission now runs at this wavelength instead of the
          previous 668 nm tabulation-limited fallback (13.2% off), so
          beta/Gamma_dot/n_eff/eta_NA and all downstream fluxes are evaluated
          at the modelled emitter's own line.

          KNOWN MODEL DEVIATION, not a design choice: this solver output
          (770 nm, dot_levels' confinement Hamiltonian on the design-card
          GaInP variant; see verify/verify_dot_levels.py's known-deviations
          section, item d-iv-a) is ~14.2% above the published Reischle-class
          target wavelength, ~674 nm (Reischle et al., Appl. Phys. Lett. 93,
          201101 (2008), 1.8396 eV; cards/reischle.yaml E_line) -- equivalently
          ~12.5% below that target in photon energy (770 nm is 1.610 eV vs.
          674 nm's 1.8396 eV). This gap is
          the module's own documented large-mismatch 3D-island-relaxation
          limitation (dot_levels.py docstring), not something this card's
          emission.lambda_nm papers over by picking the published number
          instead of the solver's.

