meta:
  name: zhao
  device: "electrically driven single-photon source, sub-Poissonian ('quiet') current drive vs normal shot-noise-limited drive"
  role: validation (pump statistics)
  source: "Zhao et al., PRResearch 6, L032021 (2024) / arXiv:2309.09703 [V, read by PI]"
  note: >
    F8/F8b/F9 (F-series v1.1) validation card: published pump-statistics g2
    values under normal vs quiet (sub-Poissonian, squeezed) electrical drive
    at matched pump strength I/I_th=4.0. C_dep_pF and squeezing_dB are the
    device parameters behind the quiet-pump demonstration -- the small
    depletion capacitance is what puts the junction in the N>>1 "collective
    regulation" granularity regime (F9), and the squeezing figure is the
    measured pump-noise reduction that F8b's thinning lemma (F_p<1 -> stays
    <1 for any eta) is meant to survive down to the dot. The SDE fit (plan
    task 4) consumes this card's g2_vs_pump dataset directly.

params:
  C_dep_pF:
    value: 3.5
    unit: pF
    tag: E
    source: "Zhao et al., p. 4 (and arXiv v1): 'QD lasers generally feature lower C_dep, sometimes as low as 3.5 pF' [E: a literature-generic sentence, NOT a measured value of this device; the QW laser example is 280 pF]"
  squeezing_dB_raw:
    value: -0.9
    unit: dB
    tag: V
    source: "Zhao et al., PRResearch 6, L032021 (2024), main p. 2-3: 'the largest noise reduction is 0.9 dB at 8 GHz' [V]; repo sign (negative = squeezing). Band 3-12 GHz, 40 mA = 4.4 I_th (I_th 9 mA), T 293 K, RBW 200 kHz, balanced two-photodiode detection. err 0.1 dB [V, arXiv:2309.09703v1 only; the published version prints no error bar]. This RAW detector value is the like-for-like comparison target (ledger zhao_squeezing_dB_det); r3-bommer-zhao-answer.md Q2"
    err: 0.1
  eta_total:
    value: 0.219
    unit: ""
    tag: V
    source: "Zhao 2024 SI Table S3 (SI 'Squeezing data analysis' p. 8-10): T = 0.4 (fibre coupling, measured) x 0.794 (isolator) x 0.933 (1st beamsplitter) x 0.933 (2nd beamsplitter) x 0.891 (fibre + connector) x 0.9 (detector, S_PD 0.95 A/W) x 0.99 (electrical noise, SNC 20 dB) = 0.2195 [V; the detector and electrical factors are typical-value / derived inputs of the SI]"
  squeezing_dB:
    value: 3.1
    unit: dB
    tag: V
    source: "[V as published, NOT a target: SI inverts Eq. S3 on the wrong ratio (1/S); the consistent inversion of the raw -0.9 dB with T = 0.219 gives S_facet = 0.145, i.e. -8.4 dB [DR]. Zhao 2024 main p. 3: '3.1 dB at the laser output facet after correcting for the overall efficiency' (SI value 3.12 dB). Loss bound with T = 0.219: 10 log10(1 - T) = -1.07 dB, so a raw 0.9 dB cannot correspond to only 3.1 dB at the facet]"
    conflict: "Published title: 'Broadband amplitude squeezing at room temperature in electrically driven quantum dot laser'. The card carries the published 3.1 dB (corrected to the laser facet), but the measured RAW value is 0.9 dB below shot noise at 8 GHz (arXiv v1: 0.9 +/- 0.1 dB; its '6.7 %' is itself 0.3 dB). Resolved in devlib-r3-papers (r3-bommer-zhao-answer.md Q2): the raw 0.9 dB (squeezing_dB_raw) is the comparison target; 3.1 dB is internally inconsistent with the SI loss model (consistent facet value -8.4 dB [DR]) and is not a target. See also .workers/review/p2-whole-deck-findings.md line 'presentation2/sections/02_emission.json:626,669'."

data:
  g2_vs_pump:
    tag: V
    source: "Zhao et al., PRResearch 6, L032021 (2024) / arXiv:2309.09703, published g2(0) values [V, read]"
    points:
      - {pump: "normal", I_over_Ith: 4.0, g2: 1.0224, err: 0.003}
      - {pump: "quiet",  I_over_Ith: 4.0, g2: 0.9823, err: 0.006}

# --- display-only 3D scene (Library model; no solver reads this block; tags V/DR/E/A + where on every number) ---
scene:
  material:
    kind: inas_gaas_sk
    params:
      lambda_nm: {value: 1308.0, unit: nm, tag: V, where: "Zhao 2024 SI Table S1: emission wavelength 1308 nm (arXiv v1: 1.31 um); InAs/GaAs QD DFB laser, 8 QD layers"}
  structure:
    kind: edge_ridge
    params:
      ridge_width_nm: {value: 2000.0, unit: nm, tag: V, where: "Zhao 2024 SI Table S1: mesa width 2 um"}
      L_um: {value: 750.0, unit: um, tag: V, where: "Zhao 2024 SI Table S1: cavity length 750 um"}
  drive:
    kind: electrical_cw
  note: >
    Closest registry class: edge-emitting ridge waveguide (the published title is an electrically driven quantum-dot laser; the card holds only pump-statistics numbers: C_dep_pF, squeezing_dB, g2). Wavelength 1308 nm, mesa 2 um and cavity 750 um are [V] (SI Table S1); facet reflectivities 0.03 (AR) / 0.95 (HR) [V] have no scene field and are not drawn; the material kind is the registry's closest InAs/GaAs class. The quiet-pump current source is not drawn.
