        tag: A
        source: "One-at-a-time sensitivity axis (nitride-sweep-results.md), not a headline Cartesian axis."
      nitride.dot.strain_fraction:
        values: [0.5, 1.0]
        unit: dimensionless
        tag: A
        source: "One-at-a-time sensitivity axis (nitride-sweep-results.md)."
      dot.gamma300:
        values: [25.0, 35.0, 55.0]
        unit: meV
        tag: A
        source: "One-at-a-time sensitivity axis (nitride-sweep-results.md); NOT a fit to Wang 220 K data or to Tamariz 2020 -- see dot.gamma300's own source note."
      dot.delta_xx:
        values: [-10.0, 10.0, 16.0]
        unit: meV
        tag: A
        source: "One-at-a-time sensitivity axis (nitride-sweep-results.md), spanning both antibinding and binding InGaN-dot XX signs (Seguin et al. 2006's -3.5 to +16 meV range)."
      ret.tau_cap_ps:
        values: [1.0, 10.0, 100.0]
        unit: ps
        tag: A
        source: "One-at-a-time sensitivity axis (nitride-sweep-results.md)."
      ret.tau_cap_scales_with_density:
        values: [false, true]
        unit: bool
        tag: A
        source: "One-at-a-time sensitivity axis at density 1e9 cm^-2, including false at that same density (nitride-sweep-results.md)."
      nitride.tau_rad0_ns:
        values: [0.2, 1.0, 4.0]
        unit: ns
        tag: A
        source: "One-at-a-time sensitivity axis (nitride-sweep-results.md)."
      nitride.k_nr_ns:
        values: [0.0, 1.0]
        unit: "ns^-1"
        tag: A
        source: "One-at-a-time sensitivity axis (nitride-sweep-results.md)."
      nitride.background_tau_ns:
        values: [0.0, 1.0]
        unit: ns
        tag: A
        source: "One-at-a-time sensitivity axis (nitride-sweep-results.md)."
      drive.b_res:
        values: [0.0, 0.1, 1.0]
        unit: dimensionless
        tag: A
        source: "One-at-a-time sensitivity axis (nitride-sweep-results.md)."
      nitride.cavity.eta_out:
        values: [0.01, 0.1, 0.5]
        unit: dimensionless
        tag: A
        source: "One-at-a-time sensitivity axis (nitride-sweep-results.md)."
      nitride.cavity.mode_volume_norm:
        values: [1.0, 2.0, 10.0]
        unit: "V/(lambda/n)^3"
        tag: A
        source: "One-at-a-time sensitivity axis (nitride-sweep-results.md)."
      nitride.cavity.detuning_offset_meV:
        values: [0.0, 10.0]
        unit: meV
        tag: A
        source: "One-at-a-time sensitivity axis (nitride-sweep-results.md)."
